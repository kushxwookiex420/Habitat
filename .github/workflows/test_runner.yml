name: Habitat Build Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check application and pipeline scripts
        run: npm run check
      - name: Generate DropPilot product decision report
        run: node scripts/rank-droppilot-products.mjs --out dist/droppilot-ranked-products.json
      - name: Publish review report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: droppilot-product-decision-report
          path: dist/droppilot-ranked-products.json
          if-no-files-found: error
          retention-days: 14
