name: Bridge Presence APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/bridge-presence-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_KEY: ${{ secrets.HABITAT_KEYSTORE_BASE64 != '' && secrets.HABITAT_KEYSTORE_PASSWORD != '' && secrets.HABITAT_KEY_ALIAS != '' && secrets.HABITAT_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Select the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          [ -n "$SDKMANAGER" ]
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug bridge APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Re-sign with the installed Bridge certificate
        # Optional: runs only after the owner provisions the four signing secrets.
        # The keystore is decoded to the runner's temporary directory and removed
        # afterwards; no private key material is stored in this repository.
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.HABITAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HABITAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HABITAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HABITAT_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "508c5a3e4b4812cbfbca2c685f5d369fde55b3bfd864727340038b59d14b247c"
        run: |
          set -euo pipefail
          umask 077
          KS="$RUNNER_TEMP/habitat-update.jks"
          trap 'rm -f "$KS" "$RUNNER_TEMP/app-debug.unsigned.apk"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/app-debug.unsigned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$APK" \
            "$RUNNER_TEMP/app-debug.unsigned.apk"
          CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          echo "Re-signed with the installed Bridge certificate."

      - name: Verify APK signature
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            echo "== $apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          done < <(find app/build/outputs/apk -name '*.apk' -print0)

      - name: Checksums
        run: |
          set -euo pipefail
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            sha256sum "$apk" | tee "$apk.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: habitat-bridge-presence-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
