name: Nexus D1 live verification

# One-shot push trigger is restricted to a unique commit message on the
# non-production branch. Manual dispatch remains available with confirmation.
# The unique trigger commit runs the current branch head, including the fixture-order fix.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type isolated to confirm this is a disposable database
        required: true
        type: string
  push:
    branches:
      - ax-nexus/revision-3-nonprod

permissions:
  contents: read

jobs:
  verify:
    if: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'RUN_ISOLATED_NEXUS_D1_ONCE') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'isolated') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run against disposable D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXUS_D1_TEST_DATABASE_ID: ${{ vars.NEXUS_D1_TEST_DATABASE_ID }}
          HABITAT_D1_DATABASE_ID: ${{ vars.HABITAT_D1_DATABASE_ID }}
          NEXUS_D1_TEST_CONFIRM: isolated
          HABITAT_D1_API_TOKEN: ${{ secrets.HABITAT_D1_API_TOKEN }}
        run: |
          test "$NEXUS_D1_TEST_CONFIRM" = "isolated"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXUS_D1_TEST_DATABASE_ID"
          test -n "$HABITAT_D1_DATABASE_ID"
          test "$NEXUS_D1_TEST_DATABASE_ID" != "$HABITAT_D1_DATABASE_ID"
          node scripts/d1-live-test.mjs
