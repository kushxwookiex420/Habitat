name: DropPilot Daily Demo Footage Research

# Four rotating batches per run improve catalog coverage while keeping only two
# research batches in flight. Search results remain leads, never rights approval.
on:
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/droppilot-demo-research-daily.yml"
      - "scripts/research-droppilot-demo-batch.mjs"
      - "product-demo-research.mjs"
      - "tests/product-demo-research.test.mjs"
      - "data/droppilot-active-product-video-manifest.json"

permissions:
  contents: read

concurrency:
  group: droppilot-demo-research-daily-v2
  cancel-in-progress: false

jobs:
  choose-batches:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.choose.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - id: choose
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Allowing the Render deployment to settle before demo research."
            sleep 75
          fi
          batch_count="$(node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("data/droppilot-active-product-video-manifest.json","utf8")); console.log(Math.ceil((m.products ?? m).length / 10));')"
          if [[ "$batch_count" -lt 1 ]]; then
            echo "No products in the live catalog snapshot." >&2
            exit 1
          fi
          daily_capacity=4
          cycle_days=$(((batch_count + daily_capacity - 1) / daily_capacity))
          day_slot=$(((GITHUB_RUN_NUMBER + 1) % cycle_days))
          start=$((day_slot * daily_capacity))
          batch_total=$((batch_count - start))
          if [[ "$batch_total" -gt "$daily_capacity" ]]; then batch_total="$daily_capacity"; fi
          batches=()
          for ((offset=0; offset<batch_total; offset++)); do
            batches+=("$((start + offset))")
          done
          batches_json="$(printf '"%s",' "${batches[@]}")"
          batches_json="[ ${batches_json%,} ]"
          printf 'batches=%s\n' "$batches_json" >> "$GITHUB_OUTPUT"
          echo "Catalog has $batch_count batches; researching $batch_total batches: ${batches[*]}."

  research:
    needs: choose-batches
    name: Research demo sources batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.choose-batches.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Search product-specific demo sources
        env:
          BATCH_INDEX: ${{ matrix.batch }}
          HABITAT_BASE_URL: https://habitat-1-szzd.onrender.com
        run: node scripts/research-droppilot-demo-batch.mjs
      - name: Save research evidence for rights review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DropPilot-Daily-Demo-Research-Batch-${{ matrix.batch }}
          path: dist/droppilot-demo-research-batch.json
          if-no-files-found: warn
          retention-days: 30
