name: Habitat v0.3.1 Ax Edition

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract base project
        shell: bash
        run: |
          set -e
          rm -rf HabitatBuild
          mkdir HabitatBuild
          unzip -q Habitat-Android-v0.3.0-Ax-Edition.zip -d HabitatBuild
          echo "PROJECT=$(find HabitatBuild -type f -name settings.gradle.kts -print -quit | xargs dirname)" >> "$GITHUB_ENV"
      - name: Replace Habitat home with 3D Neural Galaxy
        shell: bash
        run: |
          set -e
          CORE="$PROJECT/app/src/main/java/com/habitat/core"
          mkdir -p "$CORE"
          cat > "$CORE/MainActivity.kt" <<'KT'
package com.habitat.core
import android.app.Activity
import android.os.Bundle
import android.graphics.Color
import android.view.Window
import android.view.WindowManager
class MainActivity:Activity(){
 override fun onCreate(b:Bundle?){super.onCreate(b);requestWindowFeature(Window.FEATURE_NO_TITLE);window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);window.statusBarColor=Color.BLACK;window.navigationBarColor=Color.BLACK;setContentView(GalaxyHabitatView(this))}
}
KT
          cat > "$CORE/GalaxyHabitatView.kt" <<'KT'
package com.habitat.core
import android.content.Context
import android.graphics.*
import android.view.View
import kotlin.math.*
import kotlin.random.Random

class GalaxyHabitatView(c:Context):View(c){
 private val p=Paint(3); private val tx=Paint(3); private val pts=ArrayList<FloatArray>(); private var t=0f
 init{setLayerType(View.LAYER_TYPE_SOFTWARE,null);repeat(420){pts.add(floatArrayOf(Random.nextFloat()*2f-1f,Random.nextFloat()*2f-1f,Random.nextFloat()*2f-1f,Random.nextFloat()))}}
 override fun onDraw(c:Canvas){
  val w=width.toFloat();val h=height.toFloat();val cx=w/2;val cy=h*.5f;val R=min(w,h)*.30f
  p.shader=RadialGradient(cx,cy,R*2.2f,intArrayOf(Color.rgb(38,8,75),Color.rgb(7,13,35),Color.BLACK),floatArrayOf(0f,.45f,1f),Shader.TileMode.CLAMP);c.drawRect(0f,0f,w,h,p);p.shader=null
  galaxy(c,w,h,cx,cy); brain(c,cx,cy,R); labels(c,w,h); t+=.018f;postInvalidateDelayed(30)
 }
 private fun galaxy(c:Canvas,w:Float,h:Float,cx:Float,cy:Float){
  for(i in 0..1100){val a=i*.47f;val r=(i%220)/220f*max(w,h)*.72f;val x=cx+cos(a)*r;val y=cy+sin(a)*r*.38f; p.color=Color.argb((25+70*sin(i*.13+t)).toInt().coerceIn(10,100),120+(i%90),150+(i%80),255);c.drawCircle(x,y,(i%4)*.45f+.4f,p)}
  p.color=Color.argb(100,110,150,255);c.drawCircle(cx,cy,max(w,h)*.46f,p)
 }
 private fun brain(c:Canvas,cx:Float,cy:Float,r:Float){
  val rot=t*.9f
  p.style=Paint.Style.STROKE;p.strokeWidth=2.2f;p.color=Color.rgb(105,220,255);p.setShadowLayer(28f,0f,0f,Color.rgb(35,170,255))
  for(k in 0..9){
   val z=(k-5)/5f;val ww=r*sqrt(max(0f,1-z*z));val yy=cy+z*r*.72f
   c.drawOval(cx-ww,yy-r*.38f,cx+ww,yy+r*.38f,p)
  }
  for(side in -1..1 step 2){for(k in 0..7){
   val path=Path();var first=true
   for(q in 0..40){val u=q/40f;val yy=cy-r*.75f+u*r*1.5f;val wave=sin(u*PI*5+k*.75+rot)*r*.10f;val xx=cx+side*(r*.08f+wave+(1f-abs(u-.5f)*1.55f)*r*.55f)
    if(first){path.moveTo(xx,yy);first=false}else path.lineTo(xx,yy)}
   c.drawPath(path,p)
  }}
  p.clearShadowLayer();p.style=Paint.Style.FILL
  for(i in 0..45){val a=i*.78f+rot;val rr=r*(.35f+.38f*((sin(i*4.1f)+1f)/2f));val x=cx+cos(a)*rr;val y=cy+sin(a)*rr*.75f;p.color=Color.argb(190,90+(i%80),205+(i%40),255);c.drawCircle(x,y,2.2f+(i%3),p)}
  p.style=Paint.Style.STROKE;p.strokeWidth=1f;p.color=Color.argb(100,100,230,255);c.drawCircle(cx,cy,r*1.12f,p)
  c.drawArc(cx-r*1.18f,cy-r*1.18f,cx+r*1.18f,cy+r*1.18f,rot*57f,150f,false,p)
  c.drawArc(cx-r*1.28f,cy-r*1.28f,cx+r*1.28f,cy+r*1.28f,180f+rot*43f,120f,false,p)
  p.style=Paint.Style.FILL
 }
 private fun labels(c:Canvas,w:Float,h:Float){
  tx.textAlign=Paint.Align.CENTER;tx.typeface=Typeface.DEFAULT_BOLD;tx.textSize=26f;tx.color=Color.WHITE;c.drawText("HABITAT",w/2,55f,tx)
  tx.textSize=11f;tx.typeface=Typeface.DEFAULT;tx.color=Color.rgb(115,205,255);c.drawText("AX  •  NEURAL CORE",w/2,75f,tx)
  tx.textSize=10f;tx.color=Color.argb(180,170,205,240);c.drawText("A LIVING DIGITAL MIND",w/2,h*.88f,tx)
  tx.textSize=9f;tx.color=Color.argb(140,120,165,210);c.drawText("GALAXY HABITAT  •  v0.3.3",w/2,h*.97f,tx)
 }
}
KT
          python3 - "$PROJECT/app/build.gradle.kts" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1]);s=p.read_text()
import re
s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 8', s, count=1)
s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.3.3"', s, count=1)
p.write_text(s)
PY
      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: gradle clean assembleDebug --no-daemon --stacktrace
      - name: Package APK
        run: |
          set -e
          mkdir -p artifact
          APK="$(find "$PROJECT" -type f -name '*.apk' -path '*/build/outputs/apk/*' | head -n1)"
          test -n "$APK"
          cp "$APK" artifact/Habitat-v0.3.2-Ax-Galaxy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.2-Ax-Galaxy-apk
          path: artifact/Habitat-v0.3.2-Ax-Galaxy.apk
          if-no-files-found: error
