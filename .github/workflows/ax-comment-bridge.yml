name: Ax comment bridge

# Event-driven responder for Ax messages posted as top-level comments on PR #93.
#
# GitHub delivers `issue_comment` only to workflows that exist on the DEFAULT BRANCH.
# On `ax-nexus/revision-4.6-nexus-mainline-integration` this file is inert: it can be started by
# hand with workflow_dispatch, but it will not fire on its own until it reaches `main`.
# Manual dispatch is available on any branch, so the bridge can still be exercised and proven.
#
# Dry-run policy: an `issue_comment` event runs for real (the allowlist, batch bound, processed
# marker and fail-closed forward are the safety mechanism), while `workflow_dispatch` defaults to
# dry_run: true and only writes when dry_run is explicitly set to false.
#
# Cost: GitHub-hosted standard runners are free for public repositories. This repo is public, so
# the job costs $0. It uses no third-party API, no model and no paid service.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List and plan replies without posting"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ax-comment-bridge-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  respond:
    name: Answer one Ax comment
    # Owner-authored top-level comments only. Bridge replies are posted by github-actions[bot], so a
    # reply can never re-trigger the bridge; the in-script marker guard covers manual reruns.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 93 && github.event.comment.user.login == github.repository_owner && github.event.comment.user.type != 'Bot' && !github.event.comment.pull_request_review_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Run the bridge once
        id: bridge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional NEXUS forward. Left unset, the bridge states it did not forward and still
          # answers. Neither variable is added by this workflow.
          HABITAT_BASE_URL: ${{ vars.HABITAT_BASE_URL }}
          HABITAT_AX_COMMAND_TOKEN: ${{ secrets.HABITAT_AX_COMMAND_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Dry-run policy lives in one function so tests/ax-comment-bridge-workflow.test.mjs can run
          # this exact text instead of a copy of it:
          #   issue_comment     -> real run. The owner/addressing allowlist, the bounded batch, the
          #                        exactly-once marker and the fail-closed forward are what make that
          #                        safe; an absent `inputs.dry_run` must never silently make it a no-op.
          #   workflow_dispatch -> dry run unless dry_run was explicitly set to false.
          #   anything else     -> dry run.
          should_dry_run() {
            case "${1:-}" in
              workflow_dispatch) [[ "${2:-true}" != "false" ]] ;;
              issue_comment) return 1 ;;
              *) return 0 ;;
            esac
          }
          args=(--owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name || 'Habitat' }}" --pr 93)
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then args+=(--default-branch-active); fi
          if should_dry_run "$EVENT_NAME" "${INPUT_DRY_RUN:-}"; then args+=(--dry-run); fi
          set +e
          report="$(node scripts/ax-comment-bridge.mjs "${args[@]}")"
          status=$?
          set -e
          printf '%s\n' "$report" | jq . || printf '%s\n' "$report"
          {
            echo "## Ax comment bridge: $([[ $status -eq 0 ]] && echo PASS || echo "FAILED (exit $status)")"
            echo ""
            printf '%s\n' "$report" | jq '{dryRun, inspected, alreadyProcessed, planned, posted, blockers, rateLimited}' 2>/dev/null \
              || echo "Unparsed report; see the log."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Record a refused run without exposing credentials
        if: failure()
        shell: bash
        run: |
          {
            echo "## Ax comment bridge: FAILED"
            echo ""
            echo "Exit 2 = no token available. Exit 1 = a GitHub API call was refused, rate limited or failed."
            echo "No credential is printed by the bridge; review this run's log for the failing status code."
          } >> "$GITHUB_STEP_SUMMARY"
