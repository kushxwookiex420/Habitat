name: Staging escalation check

# One controlled failure, one durable Ax message, then a retry that must not duplicate it.
# Dispatch-only: it creates real task rows and a real message on staging.
on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "How long to wait for the probe task to reach a terminal state"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: staging-escalation
  cancel-in-progress: false

jobs:
  escalation:
    name: controlled failure escalation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Controlled failure escalation
        env:
          HABITAT_AX_COMMAND_TOKEN: ${{ secrets.HABITAT_AX_COMMAND_TOKEN }}
          STAGING_BASE_URL: ${{ vars.HABITAT_BASE_URL }}
          ESCALATION_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: node scripts/staging-escalation-check.mjs | tee staging-escalation.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-escalation
          path: staging-escalation.json
          if-no-files-found: warn
          retention-days: 14
