name: Artifact 004 execution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifact_004.yml'
      - 'scripts/render-artifact-004.sh'
      - 'artifacts/artifact-004-content.json'
  workflow_dispatch:
jobs:
  execute-artifact-004:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Habitat source
        uses: actions/checkout@v4
      - name: Install FFmpeg and TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu espeak-ng
      - name: Source-locked fact gate
        run: |
          python - <<'PY'
          import json
          m=json.load(open("artifacts/artifact-004-content.json"))
          assert m["approvalRequired"] is True
          assert m["publishingStatus"]=="blocked_pending_approval"
          assert m["sourcePolicy"]=="official-Rockstar-only"
          assert len(m["sources"]) >= 2
          assert len(m["approvedClaims"]) >= 5
          print("FACT GATE: PASS")
          PY
      - name: Render Artifact 004
        run: |
          chmod +x scripts/render-artifact-004.sh
          ./scripts/render-artifact-004.sh habitat-artifact-004.mp4
      - name: Verify Artifact 004
        run: |
          python - <<'PY'
          import json, subprocess, os
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height,r_frame_rate,codec_name,channels","-of","json","habitat-artifact-004.mp4"]))
          v=next(s for s in p["streams"] if s["codec_type"]=="video"); a=next(s for s in p["streams"] if s["codec_type"]=="audio")
          d=float(p["format"]["duration"]); b=os.path.getsize("habitat-artifact-004.mp4")
          assert b>0 and d>=44 and int(v["width"])==1080 and int(v["height"])==1920 and v["r_frame_rate"]=="15/1"
          assert a["codec_name"]=="aac" and int(a.get("channels",0))==2
          print(json.dumps({"verified":True,"bytes":b,"durationSeconds":d,"width":1080,"height":1920,"fps":"15/1","renderer":"github-actions-ffmpeg-cinematic-engine-v4","audio":"real-local-espeak-ng-voiceover","audioCodec":"aac","channels":2,"scenes":6,"sourcePolicy":"official-Rockstar-only","publishingStatus":"blocked_pending_approval"}))
          PY
      - name: Upload Artifact 004
        uses: actions/upload-artifact@v4
        with:
          name: habitat-artifact-004
          path: habitat-artifact-004.mp4
          retention-days: 7
