name: Habitat Autonomous Content Scheduler

on:
  # Keep this separate from deploy-triggered checks: video rendering belongs on
  # GitHub's runner, not a detached task on a sleeping/restarting Render instance.
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-autonomous-content-v11
  cancel-in-progress: false

jobs:
  render:
    name: Create and QA one autonomous Vice City Files short
    uses: ./.github/workflows/artifact_001.yml
    with:
      objective: "Create a fresh Vice City Files short about one distinct Rockstar-confirmed GTA VI detail. Choose a different angle, hook, and scene sequence rather than repeating the previous video. Keep every claim limited to verified official information; omit rumors and anything not established by the supplied research. Use six distinct scene beats, readable labels, natural 45-60 second narration, a complete opening and closing, and stop before publishing for human approval."
    secrets: inherit
