name: Habitat Autonomous Content Scheduler

on:
  # Keep this separate from deploy-triggered checks: video rendering belongs on
  # GitHub's runner, not a detached task on a sleeping/restarting Render instance.
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitat-autonomous-content-v11
  cancel-in-progress: false

jobs:
  render:
    name: Create and QA one autonomous Vice City Files short
    uses: ./.github/workflows/artifact_001.yml
    with:
      objective: "Create the next best factual, source-checked Vice City Files short. Use a complete opening and closing, readable text, varied scenes, no unsupported claims, and stop before publishing for human approval."
    secrets: inherit
