name: Habitat Autonomous Content Scheduler

# Keep heavy FFmpeg rendering on GitHub's runner, not the small Render web
# process. The called workflow researches, scripts, renders, assembles, runs QA,
# and uploads a review artifact. It never publishes externally.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/habitat-autonomous-scheduler.yml"

permissions:
  contents: read

concurrency:
  group: habitat-autonomous-content-external-render-v1
  cancel-in-progress: false

jobs:
  produce-review-ready-content:
    name: Research, render, and QA content outside the Render web process
    uses: ./.github/workflows/artifact_001.yml
