name: DropPilot first product video
on:
  push:
    branches: [main]
    paths:
      - "scripts/render-dropilot-product-video.sh"
      - ".github/workflows/dropilot-product-video.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render first DropPilot product video
        run: bash scripts/render-dropilot-product-video.sh dist/dropilot-hoto-first-look.mp4
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: DropPilot-HOTO-First-Product-Video
          path: |
            dist/dropilot-hoto-first-look.mp4
            dist/dropilot-hoto-first-look-probe.json
          if-no-files-found: error
          retention-days: 14
