name: Habitat D1 Repository Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "d1-task-repository.mjs"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/d1-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "d1-task-repository.mjs"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/d1-tests.yml"
  workflow_dispatch:

jobs:
  d1-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check D1 repository syntax
        run: node --check d1-task-repository.mjs
      - name: Run complete test suite
        run: npm test
