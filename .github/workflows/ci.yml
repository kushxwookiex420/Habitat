name: Habitat CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run the same full syntax gate used by production startup
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Verify required modules and profit-gate regression tests
        run: |
          test -f content-engine.mjs
          test -f visual-qa.mjs
          test -f product-demo-research.mjs
          test -f product-demo-renderer.mjs
          test -f product-image-video.mjs
          test -f tests/product-image-video.test.mjs
          test -f scripts/render-droppilot-product-picture-videos.mjs
          test -f scripts/rank-droppilot-products.mjs
          test -f tests/rank-droppilot-products.test.mjs
