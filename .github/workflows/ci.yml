name: Habitat CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check content-engine.mjs
          node --check visual-qa.mjs
      - name: Run regression tests
        run: npm test
      - name: Verify required modules
        run: |
          test -f content-engine.mjs
          test -f visual-qa.mjs
          test -f product-demo-research.mjs
          test -f product-demo-renderer.mjs
