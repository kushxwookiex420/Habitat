      - name: Build Habitat APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi


      # ============================================================
      # LOCATE APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -Ei "debug" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced."
            exit 1
          fi

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-1.0-Ax-Core-debug.apk

          echo "APK=$APK"


      # ============================================================
      # PACKAGE MODIFIED SOURCE
      # ============================================================

      - name: Package modified Habitat source
        shell: bash
        run: |
          set -e

          rm -rf artifact/source

          mkdir -p artifact/source

          cp -R "$PROJECT_DIR"/. \
            artifact/source/

          echo "Modified Habitat source packaged."


