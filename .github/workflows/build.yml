name: Habitat Audrey Full Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Habitat
        uses: actions/checkout@v5

      - name: Extract Habitat project
        run: |
          rm -rf habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

          echo "Habitat project:"
          ls -la habitat-project

          if [ ! -d "habitat-project/HabitatAndroid" ]; then
            echo "ERROR: HabitatAndroid folder not found."
            exit 1
          fi

      - name: Set project paths
        run: |
          echo "PROJECT_DIR=habitat-project/HabitatAndroid" >> "$GITHUB_ENV"
          echo "APP_DIR=habitat-project/HabitatAndroid/app" >> "$GITHUB_ENV"
          echo "MAIN=habitat-project/HabitatAndroid/app/src/main/java/com/habitat/core/MainActivity.kt" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "Checking project..."

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$APP_DIR/src/main/AndroidManifest.xml"

          test -f "$MAIN"

          echo "PROJECT OK"
          echo "APP: $APP_DIR"
          echo "MAIN: $MAIN"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Lucia workstation
        run: |
          mkdir -p "$APP_DIR/src/main/res/drawable-nodpi"

          if [ ! -f "lucia.png" ]; then
            echo "ERROR: lucia.png is missing."
            echo "Upload the Lucia image to the repository root."
            exit 1
          fi

          cp lucia.png \
            "$APP_DIR/src/main/res/drawable-nodpi/lucia.png"

          echo "LUCIA WORKSTATION INSTALLED"

      - name: Create Audrey brain
        run: |
          cat > "$APP_DIR/src/main/java/com/habitat/core/AudreyBrain.kt" <<'EOF'
package com.habitat.core

import android.content.Context
import org.json.JSONArray
import org.json.JSONObject

class AudreyBrain(private val context: Context) {

    private val prefs =
        context.getSharedPreferences(
            "audrey_brain",
            Context.MODE_PRIVATE
        )

    fun remember(role: String, message: String) {

        val raw =
            prefs.getString("memory", "[]") ?: "[]"

        val memory =
            try {
                JSONArray(raw)
            } catch (e: Exception) {
                JSONArray()
            }

        val item = JSONObject()

        item.put("role", role)
        item.put("message", message)
        item.put(
            "time",
            System.currentTimeMillis()
        )

        memory.put(item)

        while (memory.length() > 150) {
            memory.remove(0)
        }

        prefs.edit()
            .putString(
                "memory",
                memory.toString()
            )
            .apply()
    }

    fun respond(message: String): String {

        remember("user", message)

        val text =
            message.trim().lowercase()

        val answer =
            when {

                text.contains("hello") ||
                text.contains("hi") ||
                text.contains("hey") ->
                    "Hey. Audrey is online. Habitat is ready."

                text.contains("who are you") ->
                    "I'm Audrey, the AI companion interface for Habitat."

                text.contains("status") ->
                    "Habitat online. Local memory online. Brain adapter online. AI backend connection ready."

                text.contains("remember") ->
                    "Local persistent memory is active."

                text.contains("brain") ->
                    "Brain adapter is online."

                text.contains("habitat") ->
                    "Habitat is my environment and command center."

                else ->
                    "I hear you. The Habitat brain received your message."
            }

        remember("assistant", answer)

        return answer
    }
}
EOF

      - name: Build Audrey interface
