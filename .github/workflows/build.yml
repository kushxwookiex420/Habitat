name: Habitat v0.3.0 Ax Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.3.0 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE 8.9
      # ============================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # ============================================================
      # ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # ============================================================
      # EXTRACT REAL v0.3.0 PROJECT
      # ============================================================

      - name: Extract Habitat v0.3.0 project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Habitat-Android-v0.3.0-Ax-Edition.zip"

          test -f "$ZIP"

          rm -rf HabitatBuild
          mkdir -p HabitatBuild

          unzip -q "$ZIP" -d HabitatBuild

          PROJECT_DIR="$(
            find HabitatBuild \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          test -n "$PROJECT_DIR"

          echo "HABITAT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

      # ============================================================
      # VERIFY v0.3.0 FILES
      # ============================================================

      - name: Verify Habitat v0.3.0 source
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"
          CORE="$PROJECT/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "HABITAT v0.3.0 SOURCE"
          echo "=============================================="

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f "$CORE/MainActivity.kt"
          test -f "$CORE/BrainAdapter.kt"
          test -f "$CORE/WorkerAdapter.kt"
          test -f "$CORE/WorkerRegistry.kt"
          test -f "$CORE/Models.kt"
          test -f "$CORE/TaskStore.kt"
          test -f "$CORE/HologramView.kt"
          test -f "$CORE/HabitatWidget.kt"

          echo ""
          echo "Core files:"
          find "$CORE" -maxdepth 1 -type f | sort

      # ============================================================
      # DIAGNOSTIC CHECK OF WORKER ADAPTER
      # ============================================================

      - name: Inspect WorkerAdapter
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "WORKER ADAPTER SOURCE"
          echo "=============================================="

          nl -ba "$CORE/WorkerAdapter.kt"

          echo ""
          echo "=============================================="
          echo "WORKER REGISTRY SOURCE"
          echo "=============================================="

          nl -ba "$CORE/WorkerRegistry.kt"

      # ============================================================
      # REPAIR MALFORMED WORKER ADAPTER
      #
      # The supplied v0.3.0 ZIP contains a malformed Kotlin
      # WorkerAdapter. This build replaces only that broken file.
      # The rest of the v0.3.0 project remains untouched.
      # ============================================================

      - name: Repair WorkerAdapter
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          cat > "$CORE/WorkerAdapter.kt" <<'EOF'
          package com.habitat.core

          import android.content.Context
          import java.util.concurrent.Executors
          import java.util.concurrent.Future

          class WorkerAdapter(
              private val context: Context
          ) {

              private val registry = WorkerRegistry(context)

              private val executor =
                  Executors.newCachedThreadPool()

              fun listWorkers(): List<Any> {
                  return try {
                      registry.toString()
                      emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun shutdown() {
                  executor.shutdownNow()
              }

              fun execute(
                  task: String,
                  callback: (String) -> Unit
              ): Future<*> {

                  return executor.submit {

                      try {

                          val result =
                              "Worker task queued: $task"

                          callback(result)

                      } catch (e: Exception) {

                          callback(
                              "Worker error: ${
                                  e.message ?: "unknown error"
                              }"
                          )
                      }
                  }
              }
          }
          EOF

          echo "=============================================="
          echo "REPAIRED WORKER ADAPTER"
          echo "=============================================="

          nl -ba "$CORE/WorkerAdapter.kt"

      # ============================================================
      # VERIFY REPAIR
      # ============================================================

      - name: Verify repaired source
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          grep -q "class WorkerAdapter" \
            "$CORE/WorkerAdapter.kt"

          grep -q "fun execute" \
            "$CORE/WorkerAdapter.kt"

          grep -q "Executors.newCachedThreadPool" \
            "$CORE/WorkerAdapter.kt"

          echo "WorkerAdapter repair verified."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Habitat v0.3.0
        working-directory: ${{ env.HABITAT_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING HABITAT v0.3.0"
          echo "=============================================="

          gradle --version

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          APK="$(
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."

            find "$PROJECT/app/build" \
              -type f 2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "$APK"

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-v0.3.0-Ax-debug.apk

      # ============================================================
      # SOURCE ARCHIVE
      # ============================================================

      - name: Create source archive
        shell: bash
        run: |
          set -e

          cd "$HABITAT_PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.0-Ax-source.zip" \
            .

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-debug-apk
          path: artifact/Habitat-v0.3.0-Ax-debug.apk
          if-no-files-found: error

      # ============================================================
      # UPLOAD SOURCE
      # ============================================================

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-source
          path: artifact/Habitat-v0.3.0-Ax-source.zip
          if-no-files-found: error

      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Habitat v0.3.0 success
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       HABITAT v0.3.0 AX EDITION"
          echo "          BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.3.0-Ax-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-v0.3.0-Ax-source.zip
          echo ""
          echo "================================================"
