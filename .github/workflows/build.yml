name: Habitat 1.0 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat 1.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Habitat project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "*0.2.2*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Habitat project ZIP not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Habitat project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted."
          find extracted -maxdepth 6 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Habitat project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle"

          echo "Habitat Android project verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null | sort -V | tail -n 1)

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          if ! command -v gradle >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gradle
          fi

          gradle --version

      - name: Build Habitat
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== HABITAT 1.0 BUILD ==="

          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "Habitat APK generated."

      - name: Package extracted source
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp -r "$PROJECT_DIR" artifacts/Habitat-Android-Source

          cd artifacts
          zip -qr Habitat-Android-Source.zip Habitat-Android-Source

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-1.0-Ax-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Habitat source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-1.0-Android-Source
          path: artifacts/Habitat-Android-Source.zip
          if-no-files-found: error
