name: Habitat v0.2.2 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.2.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Habitat v0.2.2 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*0.2.2*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Habitat v0.2.2 ZIP not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Habitat v0.2.2
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted successfully."
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Habitat project
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: Gradle build file missing."
            exit 1
          fi

          echo "Habitat v0.2.2 project verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -type f -name "sdkmanager" 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "sdkmanager: $SDKMANAGER"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK configured."

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager unavailable."
            exit 1
          fi

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK components installed."

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          if command -v gradle >/dev/null 2>&1; then
            echo "Gradle already available."
          else
            echo "Installing Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle
          fi

          gradle --version

      - name: Build Habitat v0.2.2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building Habitat v0.2.2..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Habitat v0.2.2 APK generated successfully."

      - name: Upload Habitat v0.2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.2-Ax-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
