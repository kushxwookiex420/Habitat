name: Habitat APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat project
        run: |
          unzip -q Habitat-Android-Project.zip -d habitat-project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix MainActivity
        run: |
          FILE="habitat-project/HabitatAndroid/app/src/main/java/com/habitat/core/MainActivity.kt"
          echo "=== BEFORE FIX ==="
          grep -n "now" "$FILE" || true
          perl -pi -e 's/\.now(?!\s*\()/\.now()/g' "$FILE"
          echo "=== AFTER FIX ==="
          grep -n "now" "$FILE" || true

      - name: Build Habitat APK
        working-directory: habitat-project/HabitatAndroid
        run: |
          gradle assembleDebug

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-debug-apk
          path: habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk
