name: Habitat v0.2.1 Ax Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Habitat-Android-v0.2.1-Ax-Edition.zip"
      - ".github/workflows/**"

jobs:
  build:
    name: Build Habitat v0.2.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Verify v0.2.1 ZIP
        run: |
          echo "Checking Habitat v0.2.1 ZIP..."
          test -f Habitat-Android-v0.2.1-Ax-Edition.zip
          ls -lh Habitat-Android-v0.2.1-Ax-Edition.zip

      - name: Extract Habitat v0.2.1
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Habitat-Android-v0.2.1-Ax-Edition.zip -d extracted

          echo "Habitat project:"
          find extracted/HabitatAndroid -maxdepth 3 -type f | sort

      - name: Verify Android project
        run: |
          test -f extracted/HabitatAndroid/settings.gradle.kts
          test -f extracted/HabitatAndroid/build.gradle.kts
          test -f extracted/HabitatAndroid/app/build.gradle.kts
          test -f extracted/HabitatAndroid/app/src/main/AndroidManifest.xml

          echo "Android project verified."

      - name: Build Habitat debug APK
        run: |
          cd extracted/HabitatAndroid

          echo "Starting Habitat v0.2.1 debug build..."

          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."

          find extracted/HabitatAndroid -type f -name "*.apk" -print

      - name: Verify APK
        run: |
          APK=$(find extracted/HabitatAndroid -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            exit 1
          fi

          echo "SUCCESS!"
          echo "Habitat v0.2.1 APK:"
          echo "$APK"

      - name: Upload Habitat v0.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.1-Ax-debug-apk
          path: extracted/HabitatAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
