name: Habitat APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat project
        run: |
          unzip -q Habitat-Android-Project.zip -d habitat-project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix MainActivity
        run: |
          FILE="habitat-project/HabitatAndroid/app/src/main/java/com/habitat/core/MainActivity.kt"
          sed -i 's/\$now()/\${now()}/g' "$FILE"

      - name: Bump app version
        run: |
          FILE="habitat-project/HabitatAndroid/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/versionCode[[:space:]]*[0-9]*/versionCode 2/' "$FILE"
            sed -i 's/versionName[[:space:]]*"[^"]*"/versionName "0.2.0"/' "$FILE"
          fi

      - name: Build Habitat APK
        working-directory: habitat-project/HabitatAndroid
        run: |
          gradle assembleDebug

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-debug-apk
          path: habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk
