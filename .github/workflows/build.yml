package com.habitat.core

enum class HabitatState {
    IDLE,
    THINKING,
    PLANNING,
    ACTING,
    OBSERVING,
    VERIFYING,
    COMPLETE,
    FAILED
}

data class HabitatAction(
    val id: String,
    val name: String,
    val description: String,
    val requiresConfirmation: Boolean
)

data class HabitatPlan(
    val objective: String,
    val actions: List<HabitatAction>
)

class HabitatEngine {

    var state: HabitatState =
        HabitatState.IDLE
        private set

    fun begin(
        objective: String
    ): HabitatPlan {

        state =
            HabitatState.THINKING

        state =
            HabitatState.PLANNING

        return HabitatPlan(
            objective = objective,
            actions = listOf(
                HabitatAction(
                    id = "research",
                    name = "Research",
                    description =
                        "Gather information required by the objective.",
                    requiresConfirmation = false
                ),
                HabitatAction(
                    id = "verify",
                    name = "Verify",
                    description =
                        "Verify the result before claiming completion.",
                    requiresConfirmation = false
                )
            )
        )
    }

    fun acting() {
        state =
            HabitatState.ACTING
    }

    fun observing() {
        state =
            HabitatState.OBSERVING
    }

    fun verifying() {
        state =
            HabitatState.VERIFYING
    }

    fun complete() {
        state =
            HabitatState.COMPLETE
    }

    fun fail() {
        state =
            HabitatState.FAILED
    }
}

