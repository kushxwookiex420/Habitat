name: Habitat Audrey Update Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Habitat
        run: |
          rm -rf habitat-project
          mkdir -p habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

      - name: Find Android project
        run: |
          GRADLEW=$(find habitat-project -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Project contents:"
            find habitat-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Habitat Audrey
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Update
          path: ${{ env.APK_PATH }}
