name: Habitat v0.2.1 Ax Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Habitat-Android-v0.2.1-Ax-Edition.zip"
      - ".github/workflows/**"

jobs:
  build:
    name: Build Habitat v0.2.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify v0.2.1 ZIP exists
        run: |
          test -f Habitat-Android-v0.2.1-Ax-Edition.zip
          echo "v0.2.1 ZIP found."

      - name: Extract Habitat v0.2.1
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Habitat-Android-v0.2.1-Ax-Edition.zip -d extracted

      - name: Locate Android project
        run: |
          echo "Searching for Gradle project..."
          find extracted -name gradlew -type f -print

      - name: Prepare Gradle wrapper
        run: |
          chmod +x "$(find extracted -name gradlew -type f | head -n 1)"

      - name: Build Habitat debug APK
        run: |
          GRADLEW="$(find extracted -name gradlew -type f | head -n 1)"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for APK..."
          find extracted -type f -name "*.apk" -print

      - name: Verify APK was created
        run: |
          APK="$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

      - name: Upload Habitat v0.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.1-Ax-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
