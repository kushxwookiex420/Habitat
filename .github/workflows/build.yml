name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Habitat Android project
        run: |
          rm -rf habitat-project

          mkdir -p habitat-project/HabitatAndroid/app/src/main/java/com/habitat
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/values

          cat > habitat-project/HabitatAndroid/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HabitatAndroid"
          include(":app")
          EOF

          cat > habitat-project/HabitatAndroid/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > habitat-project/HabitatAndroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > habitat-project/HabitatAndroid/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.habitat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.habitat"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 504
                  versionName = "0.5.4"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="Habitat"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05070A</item>
                  <item name="android:navigationBarColor">#05070A</item>
                  <item name="android:windowBackground">#05070A</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > habitat-project/HabitatAndroid/app/src/main/java/com/habitat/MainActivity.kt <<'EOF'
          package com.habitat

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup.LayoutParams
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private val BACKEND_URL =
                  "https://habitat-cr46.onrender.com/chat"

              private lateinit var chatBox: LinearLayout
              private lateinit var input: EditText
              private lateinit var sendButton: Button
              private lateinit var statusText: TextView
              private lateinit var scrollView: ScrollView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, true)

                  buildInterface()
              }

              private fun buildInterface() {

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.rgb(4, 7, 11))

                  val background = CommandCenterView(this)

                  root.addView(
                      background,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  val main = LinearLayout(this)
                  main.orientation = LinearLayout.VERTICAL
                  main.setPadding(18, 18, 18, 12)

                  root.addView(
                      main,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL

                  main.addView(
                      header,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val title = TextView(this)
                  title.text = "HABITAT"
                  title.textSize = 25f
                  title.setTextColor(Color.WHITE)
                  title.typeface = Typeface.create(
                      Typeface.MONOSPACE,
                      Typeface.BOLD
                  )

                  header.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  statusText = TextView(this)
                  statusText.text = "● AUDREY ONLINE"
                  statusText.textSize = 12f
                  statusText.setTextColor(Color.rgb(80, 255, 180))
                  statusText.typeface = Typeface.MONOSPACE

                  header.addView(
                      statusText,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val subtitle = TextView(this)
                  subtitle.text =
                      "PERSONAL AI OPERATING ENVIRONMENT  •  BRAIN LINK"
                  subtitle.textSize = 10f
                  subtitle.setTextColor(Color.rgb(130, 150, 170))
                  subtitle.typeface = Typeface.MONOSPACE

                  val subtitleParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  subtitleParams.topMargin = 5
                  main.addView(subtitle, subtitleParams)

                  val core = TextView(this)

                  core.text =
                      "\n                 ◉\n" +
                      "             AUDREY CORE\n" +
                      "          INTELLIGENCE ACTIVE\n"

                  core.gravity = Gravity.CENTER
                  core.textSize = 15f
                  core.setTextColor(Color.rgb(100, 230, 255))
                  core.typeface = Typeface.create(
                      Typeface.MONOSPACE,
                      Typeface.BOLD
                  )

                  val coreParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      170
                  )

                  coreParams.topMargin = 8
                  main.addView(core, coreParams)

                  val chatTitle = TextView(this)
                  chatTitle.text = "▣  CONVERSATION"
                  chatTitle.textSize = 12f
                  chatTitle.setTextColor(Color.rgb(100, 230, 255))
                  chatTitle.typeface = Typeface.MONOSPACE

                  val chatTitleParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  chatTitleParams.bottomMargin = 6

                  main.addView(
                      chatTitle,
                      chatTitleParams
                  )

                  scrollView = ScrollView(this)
                  scrollView.isFillViewport = true
                  scrollView.setBackgroundColor(
                      Color.argb(150, 5, 10, 16)
                  )

                  chatBox = LinearLayout(this)
                  chatBox.orientation = LinearLayout.VERTICAL
                  chatBox.setPadding(12, 12, 12, 12)

                  scrollView.addView(
                      chatBox,
                      LayoutParams(
                          LayoutParams.MATCH_PARENT,
                          LayoutParams.WRAP_CONTENT
                      )
                  )

                  val scrollParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1f
                  )

                  main.addView(
                      scrollView,
                      scrollParams
                  )

                  addMessage(
                      "AUDREY",
                      "Habitat loaded. Local memory ready. Brain adapter ready. AI backend ready for connection."
                  )

                  val talkLabel = TextView(this)
                  talkLabel.text = "▸  TALK TO AUDREY"
                  talkLabel.textSize = 11f
                  talkLabel.setTextColor(Color.rgb(100, 230, 255))
                  talkLabel.typeface = Typeface.MONOSPACE

                  val talkLabelParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  talkLabelParams.topMargin = 8
                  talkLabelParams.bottomMargin = 4

                  main.addView(
                      talkLabel,
                      talkLabelParams
                  )

                  val inputPanel = LinearLayout(this)
                  inputPanel.orientation = LinearLayout.HORIZONTAL
                  inputPanel.gravity = Gravity.CENTER_VERTICAL

                  val inputPanelParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  main.addView(
                      inputPanel,
                      inputPanelParams
                  )

                  input = EditText(this)

                  input.setSingleLine(true)

                  input.imeOptions =
                      EditorInfo.IME_ACTION_SEND

                  input.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES

                  input.hint = "Type a message..."
                  input.textSize = 16f

                  input.setTextColor(Color.WHITE)
                  input.setHintTextColor(
                      Color.rgb(110, 125, 140)
                  )

                  input.setPadding(
                      14,
                      12,
                      14,
                      12
                  )

                  input.setBackgroundColor(
                      Color.rgb(15, 22, 30)
                  )

                  val inputParams = LinearLayout.LayoutParams(
                      0,
                      58,
                      1f
                  )

                  inputPanel.addView(
                      input,
                      inputParams
                  )

                  sendButton = Button(this)

                  sendButton.text = "SEND"
                  sendButton.textSize = 12f
                  sendButton.setTextColor(Color.WHITE)
                  sendButton.isAllCaps = false

                  val sendParams = LinearLayout.LayoutParams(
                      95,
                      58
                  )

                  sendParams.leftMargin = 8

                  inputPanel.addView(
                      sendButton,
                      sendParams
                  )

                  val enterHint = TextView(this)

                  enterHint.text = "ENTER = SEND"
                  enterHint.textSize = 9f
                  enterHint.setTextColor(
                      Color.rgb(90, 110, 125)
                  )

                  enterHint.typeface = Typeface.MONOSPACE

                  val enterHintParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  enterHintParams.topMargin = 3

                  main.addView(
                      enterHint,
                      enterHintParams
                  )

                  sendButton.setOnClickListener {
                      sendMessage()
                  }

                  input.setOnEditorActionListener { _, actionId, event ->

                      if (
                          actionId == EditorInfo.IME_ACTION_SEND ||
                          (
                              event != null &&
                              event.keyCode == KeyEvent.KEYCODE_ENTER &&
                              event.action == KeyEvent.ACTION_DOWN
                          )
                      ) {

                          sendMessage()
                          true

                      } else {

                          false
                      }
                  }

                  input.setOnKeyListener { _, keyCode, event ->

                      if (
                          keyCode == KeyEvent.KEYCODE_ENTER &&
                          event.action == KeyEvent.ACTION_DOWN
                      ) {

                          sendMessage()
                          true

                      } else {

                          false
                      }
                  }

                  setContentView(root)

                  input.requestFocus()

                  input.postDelayed({

                      val imm =
                          getSystemService(
                              Context.INPUT_METHOD_SERVICE
                          ) as InputMethodManager

                      imm.showSoftInput(
                          input,
                          InputMethodManager.SHOW_IMPLICIT
                      )

                  }, 500)
              }

              private fun addMessage(
                  speaker: String,
                  message: String
              ) {

                  val text = TextView(this)

                  text.text =
                      "$speaker  ›  $message"

                  text.textSize = 14f
                  text.setTextColor(Color.WHITE)
                  text.typeface = Typeface.MONOSPACE

                  text.setPadding(
                      8,
                      8,
                      8,
                      8
                  )

                  val params = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )

                  params.bottomMargin = 4

                  chatBox.addView(
                      text,
                      params
                  )

                  scrollView.post {
                      scrollView.fullScroll(
                          View.FOCUS_DOWN
                      )
                  }
              }

              private fun sendMessage() {

                  val message =
                      input.text.toString().trim()

                  if (message.isEmpty()) {
                      return
                  }

                  input.setText("")

                  addMessage(
                      "YOU",
                      message
                  )

                  statusText.text =
                      "● AUDREY THINKING..."

                  statusText.setTextColor(
                      Color.rgb(255, 210, 80)
                  )

                  sendButton.isEnabled = false
                  input.isEnabled = false

                  thread {

                      try {

                          val url =
                              URL(BACKEND_URL)

                          val connection =
                              url.openConnection()
                                  as HttpURLConnection

                          connection.requestMethod = "POST"

                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          )

                          connection.setRequestProperty(
                              "Accept",
                              "application/json"
                          )

                          connection.connectTimeout = 15000
                          connection.readTimeout = 30000
                          connection.doOutput = true

                          val json = JSONObject()

                          json.put(
                              "message",
                              message
                          )

                          connection.outputStream.use { output ->

                              output.write(
                                  json.toString()
                                      .toByteArray(
                                          Charsets.UTF_8
                                      )
                              )
                          }

                          val responseCode =
                              connection.responseCode

                          val stream =
                              if (
                                  responseCode in 200..299
                              ) {

                                  connection.inputStream

                              } else {

                                  connection.errorStream
                              }

                          val responseText =
                              if (stream != null) {

                                  BufferedReader(
                                      InputStreamReader(
                                          stream
                                      )
                                  ).use { reader ->
                                      reader.readText()
                                  }

                              } else {

                                  ""
                              }

                          connection.disconnect()

                          runOnUiThread {

                              sendButton.isEnabled = true
                              input.isEnabled = true

                              statusText.text =
                                  "● AUDREY ONLINE"

                              statusText.setTextColor(
                                  Color.rgb(
                                      80,
                                      255,
                                      180
                                  )
                              )

                              if (
                                  responseCode in 200..299
                              ) {

                                  try {

                                      val response =
                                          JSONObject(
                                              responseText
                                          )

                                      val reply =
                                          response.optString(
                                              "reply",
                                              response.optString(
                                                  "message",
                                                  responseText
                                              )
                                          )

                                      addMessage(
                                          "AUDREY",
                                          if (
                                              reply.isBlank()
                                          ) {

                                              "I received that, but the backend returned an empty response."

                                          } else {

                                              reply
                                          }
                                      )

                                  } catch (
                                      e: Exception
                                  ) {

                                      addMessage(
                                          "AUDREY",
                                          responseText.ifBlank {
                                              "Backend responded successfully, but the response format was unexpected."
                                          }
                                      )
                                  }

                              } else {

                                  addMessage(
                                      "SYSTEM",
                                      "Backend error $responseCode: $responseText"
                                  )
                              }
                          }

                      } catch (
                          e: Exception
                      ) {

                          runOnUiThread {

                              sendButton.isEnabled = true
                              input.isEnabled = true

                              statusText.text =
                                  "● BACKEND ERROR"

                              statusText.setTextColor(
                                  Color.rgb(
                                      255,
                                      90,
                                      90
                                  )
                              )

                              addMessage(
                                  "SYSTEM",
                                  "Connection error: ${e.message ?: "Unknown error"}"
                              )
                          }
                      }
                  }
              }

              private inner class CommandCenterView(
                  context: Context
              ) : View(context) {

                  private val paint =
                      Paint(Paint.ANTI_ALIAS_FLAG)

                  override fun onDraw(
                      canvas: Canvas
                  ) {

                      super.onDraw(canvas)

                      val width =
                          width.toFloat()

                      val height =
                          height.toFloat()

                      paint.style =
                          Paint.Style.STROKE

                      paint.strokeWidth = 1f

                      paint.color =
                          Color.rgb(
                              15,
                              45,
                              60
                          )

                      val spacing = 45f

                      var x = 0f

                      while (x < width) {

                          canvas.drawLine(
                              x,
                              0f,
                              x,
                              height,
                              paint
                          )

                          x += spacing
                      }

                      var y = 0f

                      while (y < height) {

                          canvas.drawLine(
                              0f,
                              y,
                              width,
                              y,
                              paint
                          )

                          y += spacing
                      }

                      paint.style =
                          Paint.Style.STROKE

                      paint.strokeWidth = 3f

                      paint.color =
                          Color.rgb(
                              20,
                              120,
                              150
                          )

                      val centerX =
                          width / 2f

                      val centerY =
                          height * 0.32f

                      canvas.drawCircle(
                          centerX,
                          centerY,
                          65f,
                          paint
                      )

                      canvas.drawCircle(
                          centerX,
                          centerY,
                          42f,
                          paint
                      )

                      paint.style =
                          Paint.Style.FILL

                      paint.color =
                          Color.rgb(
                              70,
                              220,
                              255
                          )

                      canvas.drawCircle(
                          centerX,
                          centerY,
                          7f,
                          paint
                      )

                      paint.style =
                          Paint.Style.STROKE

                      paint.strokeWidth = 2f

                      canvas.drawLine(
                          centerX - 120,
                          centerY,
                          centerX + 120,
                          centerY,
                          paint
                      )

                      canvas.drawLine(
                          centerX,
                          centerY - 120,
                          centerX,
                          centerY + 120,
                          paint
                      )

                      paint.color =
                          Color.rgb(
                              10,
                              65,
                              85
                          )

                      paint.strokeWidth = 1f

                      canvas.drawRect(
                          18f,
                          height - 185f,
                          width - 18f,
                          height - 25f,
                          paint
                      )
                  }
              }
          }
          EOF

      - name: Verify no unresolved bare LayoutParams
        working-directory: habitat-project/HabitatAndroid
        run: |
          grep -n "LayoutParams" app/src/main/java/com/habitat/MainActivity.kt || true

      - name: Build APK
        working-directory: habitat-project/HabitatAndroid
        run: gradle assembleDebug

      - name: Upload Habitat Audrey APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-v0.5.4
          path: habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk
