name: Habitat v0.2.2 Ax Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.2.2 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager could not be located."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # ============================================================
      # CREATE BUILD PROJECT
      #
      # IMPORTANT:
      # We create only the Gradle shell here.
      # MainActivity.kt and BrainAdapter.kt come DIRECTLY
      # from the GitHub repository.
      # ============================================================

      - name: Create clean Habitat build project
        shell: bash
        run: |
          set -e

          rm -rf HabitatBuild

          mkdir -p HabitatBuild/app/src/main/java/com/habitat/core
          mkdir -p HabitatBuild/app/src/main/res/values

      # ============================================================
      # GRADLE SETTINGS
      # ============================================================

      - name: Write Gradle settings
        shell: bash
        run: |
          cat > HabitatBuild/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Habitat"

          include(":app")
          EOF

      # ============================================================
      # ROOT GRADLE
      # ============================================================

      - name: Write root Gradle build
        shell: bash
        run: |
          cat > HabitatBuild/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================

      - name: Write Gradle properties
        shell: bash
        run: |
          cat > HabitatBuild/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ============================================================
      # APP GRADLE
      # ============================================================

      - name: Write Android app build
        shell: bash
        run: |
          cat > HabitatBuild/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.habitat.core"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.habitat.core"

                  minSdk = 24
                  targetSdk = 35

                  versionCode = 202
                  versionName = "0.2.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Write Android manifest
        shell: bash
        run: |
          cat > HabitatBuild/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Habitat"
                  android:supportsRtl="true"
                  android:theme="@style/HabitatTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # THEME
      # ============================================================

      - name: Write Android theme
        shell: bash
        run: |
          cat > HabitatBuild/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="HabitatTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05080D</item>
                  <item name="android:navigationBarColor">#05080D</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

      # ============================================================
      # COPY THE REAL HABITAT BRAIN ADAPTER
      #
      # DO NOT WRITE A REPLACEMENT HERE.
      # This is the verified aa624822... BrainAdapter.kt.
      # ============================================================

      - name: Copy repository BrainAdapter
        shell: bash
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/BrainAdapter.kt"

          cp "$GITHUB_WORKSPACE/BrainAdapter.kt" \
            HabitatBuild/app/src/main/java/com/habitat/core/BrainAdapter.kt

          echo "======================================"
          echo "BRAIN ADAPTER SOURCE"
          echo "======================================"

          sha256sum "$GITHUB_WORKSPACE/BrainAdapter.kt"
          sha256sum \
            "HabitatBuild/app/src/main/java/com/habitat/core/BrainAdapter.kt"

      # ============================================================
      # COPY THE REAL HABITAT MAIN ACTIVITY
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # The APK now uses the MainActivity.kt that you committed
      # to the repository.
      # ============================================================

      - name: Copy repository MainActivity
        shell: bash
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/MainActivity.kt"

          cp "$GITHUB_WORKSPACE/MainActivity.kt" \
            HabitatBuild/app/src/main/java/com/habitat/core/MainActivity.kt

          echo "======================================"
          echo "MAIN ACTIVITY SOURCE"
          echo "======================================"

          sha256sum "$GITHUB_WORKSPACE/MainActivity.kt"
          sha256sum \
            "HabitatBuild/app/src/main/java/com/habitat/core/MainActivity.kt"

      # ============================================================
      # VERIFY WE ARE BUILDING THE REAL FILES
      # ============================================================

      - name: Verify Habitat source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "HABITAT SOURCE VERIFICATION"
          echo "======================================"

          echo ""
          echo "Repository files:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            | sort

          echo ""
          echo "Build project files:"
          find HabitatBuild \
            -type f \
            | sort

          echo ""
          echo "MainActivity.kt:"
          test -f \
            HabitatBuild/app/src/main/java/com/habitat/core/MainActivity.kt

          echo ""
          echo "BrainAdapter.kt:"
          test -f \
            HabitatBuild/app/src/main/java/com/habitat/core/BrainAdapter.kt

          echo ""
          echo "Checking package declarations:"

          grep -n \
            "package com.habitat.core" \
            HabitatBuild/app/src/main/java/com/habitat/core/MainActivity.kt

          grep -n \
            "package com.habitat.core" \
            HabitatBuild/app/src/main/java/com/habitat/core/BrainAdapter.kt

          echo ""
          echo "Checking live Brain endpoint:"

          grep -n \
            "habitat-1-szzd.onrender.com/chat" \
            HabitatBuild/app/src/main/java/com/habitat/core/BrainAdapter.kt

          echo ""
          echo "======================================"
          echo "SOURCE VERIFICATION PASSED"
          echo "======================================"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build debug APK
        working-directory: HabitatBuild
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING HABITAT v0.2.2"
          echo "======================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(
            find HabitatBuild \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/apk/*' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not produced."

            find HabitatBuild/app/build \
              -type f 2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK"

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-v0.2.2-Ax-debug.apk

      # ============================================================
      # SOURCE ARCHIVE
      # ============================================================

      - name: Create source archive
        shell: bash
        run: |
          set -e

          cd HabitatBuild

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.2.2-Ax-source.zip" \
            .

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.2-Ax-debug-apk
          path: artifact/Habitat-v0.2.2-Ax-debug.apk
          if-no-files-found: error

      # ============================================================
      # UPLOAD SOURCE
      # ============================================================

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.2-Ax-source
          path: artifact/Habitat-v0.2.2-Ax-source.zip
          if-no-files-found: error

      # ============================================================
      # SUCCESS REPORT
      # ============================================================

      - name: Build success report
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "          HABITAT v0.2.2 AX CORE"
          echo "             BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "SOURCE:"
          echo "Repository MainActivity.kt"
          echo "Repository BrainAdapter.kt"
          echo ""
          echo "LIVE BRAIN:"
          echo "https://habitat-1-szzd.onrender.com/chat"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.2.2-Ax-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-v0.2.2-Ax-source.zip
          echo ""
          echo "=============================================="
