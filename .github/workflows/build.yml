name: Habitat Audrey Brain Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install Audrey Android brain
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          cat > "$MAIN_FILE" <<'KOTLIN'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var log: TextView
              private val history = mutableListOf<Pair<String, String>>()

              private fun now() =
                  SimpleDateFormat(
                      "yyyy-MM-dd HH:mm:ss",
                      Locale.US
                  ).format(Date())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 32, 32, 24)
                      setBackgroundColor(Color.rgb(9, 10, 15))
                  }

                  val title = TextView(this).apply {
                      text = "HABITAT"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 12, 0, 6)
                  }

                  status = TextView(this).apply {
                      text = "● AUDREY BRAIN ONLINE"
                      textSize = 15f
                      setTextColor(Color.rgb(100, 220, 150))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }

                  val input = EditText(this).apply {
                      hint = "Talk to Audrey..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setSingleLine(false)
                      imeOptions = EditorInfo.IME_ACTION_SEND
                      inputType =
                          android.text.InputType.TYPE_CLASS_TEXT or
                          android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES or
                          android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE
                      setBackgroundColor(Color.rgb(25, 27, 35))
                      setPadding(20, 18, 20, 18)
                  }

                  val send = Button(this).apply {
                      text = "SEND"
                  }

                  val sendMessage = {
                      val msg = input.text.toString().trim()

                      if (msg.isNotEmpty()) {
                          input.text.clear()
                          send.isEnabled = false
                          status.text = "● AUDREY THINKING..."
                          status.setTextColor(
                              Color.rgb(255, 210, 90)
                          )

                          log.text =
                              "${log.text}\n[${now()}] YOU: $msg\nAudrey: Thinking..."

                          thread {
                              val result = askAudrey(msg)

                              runOnUiThread {
                                  send.isEnabled = true

                                  if (result.startsWith("ERROR:")) {
                                      status.text =
                                          "● BRAIN CONNECTION ERROR"

                                      status.setTextColor(
                                          Color.rgb(255, 100, 100)
                                      )

                                      log.text =
                                          "${log.text}\nAudrey: $result\n"
                                  } else {
                                      status.text =
                                          "● AUDREY BRAIN ONLINE"

                                      status.setTextColor(
                                          Color.rgb(100, 220, 150)
                                      )

                                      history.add(msg to result)

                                      log.text =
                                          "${log.text}\nAudrey: $result\n"
                                  }

                                  val imm =
                                      getSystemService(
                                          Context.INPUT_METHOD_SERVICE
                                      ) as InputMethodManager

                                  imm.hideSoftInputFromWindow(
                                      input.windowToken,
                                      0
                                  )
                              }
                          }
                      }
                  }

                  send.setOnClickListener {
                      sendMessage()
                  }

                  input.setOnEditorActionListener {
                      _,
                      actionId,
                      event ->

                      val enterPressed =
                          event != null &&
                          event.keyCode == KeyEvent.KEYCODE_ENTER &&
                          event.action == KeyEvent.ACTION_DOWN

                      if (
                          actionId == EditorInfo.IME_ACTION_SEND ||
                          enterPressed
                      ) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }

                  log = TextView(this).apply {
                      text =
                          "Ready. Human authority: ACTIVE\n"

                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 24, 0, 0)
                  }

                  val row =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.HORIZONTAL
                  }

                  row.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          120,
                          1f
                      )
                  )

                  row.addView(
                      send,
                      LinearLayout.LayoutParams(
                          130,
                          120
                      )
                  )

                  root.addView(title)
                  root.addView(status)
                  root.addView(row)
                  root.addView(log)

                  setContentView(root)
              }

              private fun askAudrey(
                  message: String
              ): String {

                  return try {

                      val url =
                          URL(
                              "https://habitat-cr46.onrender.com/chat"
                          )

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod = "POST"
                      connection.connectTimeout = 20000
                      connection.readTimeout = 60000
                      connection.doOutput = true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.setRequestProperty(
                          "Accept",
                          "application/json"
                      )

                      val historyJson =
                          JSONArray()

                      history.takeLast(20).forEach { pair ->

                          val item = JSONObject()

                          item.put(
                              "user",
                              pair.first
                          )

                          item.put(
                              "assistant",
                              pair.second
                          )

                          historyJson.put(item)
                      }

                      val body =
                          JSONObject()

                      body.put(
                          "message",
                          message
                      )

                      body.put(
                          "history",
                          historyJson
                      )

                      connection.outputStream.use { output ->

                          output.write(
                              body.toString()
                                  .toByteArray(
                                      Charsets.UTF_8
                                  )
                          )
                      }

                      val responseCode =
                          connection.responseCode

                      val stream =
                          if (
                              responseCode in 200..299
                          ) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                      val responseText =
                          stream
                              ?.bufferedReader()
                              ?.use {
                                  it.readText()
                              }
                              ?: ""

                      connection.disconnect()

                      if (
                          responseCode !in 200..299
                      ) {
                          return "ERROR: Brain returned HTTP $responseCode"
                      }

                      val json =
                          JSONObject(responseText)

                      json.optString(
                          "response",
                          "ERROR: Audrey returned no response."
                      )

                  } catch (e: Exception) {

                      "ERROR: ${
                          e.message
                              ?: "Unable to reach Habitat brain."
                      }"
                  }
              }
          }
          KOTLIN

          python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = '<application'

              if marker in text:
                  text = text.replace(
                      marker,
                      permission + '\n\n    ' + marker,
                      1
                  )
              else:
                  text = text.replace(
                      '<manifest',
                      '<manifest\n    ' + permission,
                      1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("SUCCESS: Internet permission enabled.")
          PY

      - name: Build Habitat
        run: |
          cd "$PROJECT_DIR"
          echo "Building Habitat..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Enter-Send
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
