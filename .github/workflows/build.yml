name: Habitat Audrey AI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Habitat
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        shell: bash
        run: |
          set -e

          rm -rf habitat-project
          mkdir -p habitat-project

          unzip -q Habitat-Android-Project.zip -d habitat-project

          PROJECT_DIR="habitat-project/HabitatAndroid"
          APP_DIR="$PROJECT_DIR/app"
          MAIN_DIR="$APP_DIR/src/main"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$MAIN_DIR/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MAIN_DIR=$MAIN_DIR" >> "$GITHUB_ENV"

      - name: Detect Android package
        shell: bash
        run: |
          set -e

          MAIN=$(find "$MAIN_DIR" -type f -name "MainActivity.kt" -print -quit)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //')
          PACKAGE_DIR=$(dirname "$MAIN")

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

          echo "Android package: $PACKAGE"

      - name: Add Internet permission
        shell: bash
        run: |
          set -e

          MANIFEST="$MAIN_DIR/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\
            <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Create Audrey brain
        shell: bash
        run: |
          set -e

          cat > "$PACKAGE_DIR/AudreyBrain.kt" <<'EOF'
          __PACKAGE__

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class AudreyBrain(private val context: Context) {

              private val prefs =
                  context.getSharedPreferences(
                      "habitat_memory",
                      Context.MODE_PRIVATE
                  )

              fun status(): String {
                  return "LOCAL MEMORY: READY\n" +
                         "BRAIN ADAPTER: READY\n" +
                         "AI BACKEND: CONNECTED"
              }

              fun remember(user: String, assistant: String) {

                  val history = JSONArray(
                      prefs.getString(
                          "history",
                          "[]"
                      )
                  )

                  val item = JSONObject()

                  item.put("user", user)
                  item.put("assistant", assistant)
                  item.put(
                      "time",
                      System.currentTimeMillis()
                  )

                  history.put(item)

                  while (history.length() > 100) {
                      history.remove(0)
                  }

                  prefs.edit()
                      .putString(
                          "history",
                          history.toString()
                      )
                      .apply()
              }

              fun getHistory(): JSONArray {
                  return JSONArray(
                      prefs.getString(
                          "history",
                          "[]"
                      )
                  )
              }

              fun localResponse(message: String): String {

                  val text = message.lowercase()

                  return when {

                      text.contains("hello") ||
                      text.contains("hi") ||
                      text.contains("hey") ->
                          "I'm here. Habitat is online."

                      text.contains("status") ->
                          status()

                      text.contains("remember") ->
                          "I'll keep that in Habitat's local memory."

                      text.contains("who are you") ->
                          "I'm Audrey — the companion interface for Habitat."

                      else ->
                          "The AI backend didn't respond, so I'm using Habitat's local brain."
                  }
              }
          }
          EOF

          sed -i "s#__PACKAGE__#package $PACKAGE#" \
            "$PACKAGE_DIR/AudreyBrain.kt"

      - name: Create Audrey interface
        shell: bash
        run: |
          set -e

          cat > "$MAIN" <<'EOF'
          __PACKAGE__

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class HabitatScene(context: android.content.Context) :
              View(context) {

              private val paint =
                  Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(canvas: Canvas) {

                  super.onDraw(canvas)

                  val w = width.toFloat()
                  val h = height.toFloat()

                  canvas.drawColor(
                      Color.rgb(4, 6, 16)
                  )

                  /*
                   * Futuristic room
                   */

                  paint.color =
                      Color.rgb(12, 24, 48)

                  canvas.drawRect(
                      0f,
                      0f,
                      w,
                      h * .55f,
                      paint
                  )

                  paint.color =
                      Color.rgb(6, 12, 25)

                  canvas.drawRect(
                      0f,
                      h * .55f,
                      w,
                      h,
                      paint
                  )

                  /*
                   * Skyline
                   */

                  paint.color =
                      Color.rgb(25, 70, 110)

                  var x = 10f

                  while (x < w) {

                      val buildingWidth = 42f

                      val buildingHeight =
                          70f +
                          ((x * 7f) % 210f)

                      canvas.drawRect(
                          x,
                          h * .50f -
                              buildingHeight,
                          x + buildingWidth,
                          h * .50f,
                          paint
                      )

                      x += 55f
                  }

                  /*
                   * Horizon
                   */

                  paint.color =
                      Color.rgb(50, 190, 240)

                  canvas.drawRect(
                      0f,
                      h * .50f,
                      w,
                      h * .505f,
                      paint
                  )

                  /*
                   * Desk
                   */

                  paint.color =
                      Color.rgb(22, 24, 34)

                  canvas.drawRect(
                      w * .07f,
                      h * .69f,
                      w * .93f,
                      h * .735f,
                      paint
                  )

                  paint.color =
                      Color.rgb(12, 14, 22)

                  canvas.drawRect(
                      w * .12f,
                      h * .735f,
                      w * .18f,
                      h,
                      paint
                  )

                  canvas.drawRect(
                      w * .82f,
                      h * .735f,
                      w * .88f,
                      h,
                      paint
                  )

                  /*
                   * Holographic monitor
                   */

                  paint.color =
                      Color.argb(
                          70,
                          30,
                          190,
                          255
                      )

                  canvas.drawRect(
                      w * .22f,
                      h * .27f,
                      w * .78f,
                      h * .57f,
                      paint
                  )

                  paint.style =
                      Paint.Style.STROKE

                  paint.strokeWidth = 3f

                  paint.color =
                      Color.rgb(
                          70,
                          220,
                          255
                      )

                  canvas.drawRect(
                      w * .22f,
                      h * .27f,
                      w * .78f,
                      h * .57f,
                      paint
                  )

                  /*
                   * Temporary Audrey display
                   */

                  paint.style =
                      Paint.Style.FILL

                  paint.color =
                      Color.rgb(18, 20, 32)

                  canvas.drawCircle(
                      w * .50f,
                      h * .51f,
                      w * .075f,
                      paint
                  )

                  canvas.drawRoundRect(
                      w * .42f,
                      h * .56f,
                      w * .58f,
                      h * .71f,
                      35f,
                      35f,
                      paint
                  )

                  /*
                   * HUD elements
                   */

                  paint.color =
                      Color.rgb(
                          70,
                          220,
                          255
                      )

                  for (i in 0..5) {

                      val yy =
                          h * .12f +
                          i * 42f

                      canvas.drawRect(
                          w * .05f,
                          yy,
                          w * .05f + 130f,
                          yy + 3f,
                          paint
                      )
                  }

                  for (i in 0..4) {

                      val yy =
                          h * .18f +
                          i * 52f

                      canvas.drawRect(
                          w * .78f,
                          yy,
                          w * .94f,
                          yy + 3f,
                          paint
                      )
                  }

                  /*
                   * Labels
                   */

                  paint.color =
                      Color.WHITE

                  paint.textSize = 28f

                  paint.typeface =
                      Typeface.DEFAULT_BOLD

                  canvas.drawText(
                      "HABITAT",
                      w * .05f,
                      h * .09f,
                      paint
                  )

                  paint.textSize = 13f

                  paint.typeface =
                      Typeface.DEFAULT

                  canvas.drawText(
                      "AUDREY // COMMAND CENTER",
                      w * .05f,
                      h * .115f,
                      paint
                  )

                  paint.color =
                      Color.rgb(
                          70,
                          220,
                          255
                      )

                  canvas.drawText(
                      "BRAIN ONLINE",
                      w * .77f,
                      h * .09f,
                      paint
                  )

                  canvas.drawText(
                      "MEMORY ONLINE",
                      w * .77f,
                      h * .115f,
                      paint
                  )

                  canvas.drawText(
                      "AI LINK ONLINE",
                      w * .77f,
                      h * .14f,
                      paint
                  )

                  paint.style =
                      Paint.Style.FILL
              }
          }

          class MainActivity : Activity() {

              private lateinit var brain: AudreyBrain

              private lateinit var chat: TextView

              private lateinit var input: EditText

              private lateinit var sendButton: Button

              private val BACKEND_URL =
                  "https://habitat-cr46.onrender.com/chat"

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(
                      savedInstanceState
                  )

                  brain =
                      AudreyBrain(this)

                  hideSystemUI()

                  val root =
                      FrameLayout(this)

                  root.addView(
                      HabitatScene(this),
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  val panel =
                      LinearLayout(this)

                  panel.orientation =
                      LinearLayout.VERTICAL

                  panel.setPadding(
                      28,
                      20,
                      28,
                      22
                  )

                  panel.setBackgroundColor(
                      Color.argb(
                          205,
                          4,
                          7,
                          18
                      )
                  )

                  val title =
                      TextView(this)

                  title.text =
                      "AUDREY"

                  title.textSize = 24f

                  title.typeface =
                      Typeface.DEFAULT_BOLD

                  title.setTextColor(
                      Color.WHITE
                  )

                  val status =
                      TextView(this)

                  status.text =
                      "HABITAT • AI COMPANION"

                  status.textSize = 11f

                  status.setTextColor(
                      Color.rgb(
                          90,
                          220,
                          255
                      )
                  )

                  chat =
                      TextView(this)

                  chat.text =
                      "Habitat online.\n\n" +
                      brain.status()

                  chat.textSize = 15f

                  chat.setTextColor(
                      Color.WHITE
                  )

                  chat.setPadding(
                      12,
                      18,
                      12,
                      18
                  )

                  input =
                      EditText(this)

                  input.hint =
                      "Talk to Audrey..."

                  input.textSize = 16f

                  input.setSingleLine(true)

                  input.imeOptions =
                      EditorInfo.IME_ACTION_SEND

                  input.setTextColor(
                      Color.WHITE
                  )

                  input.setHintTextColor(
                      Color.LTGRAY
                  )

                  input.setPadding(
                      20,
                      0,
                      20,
                      0
                  )

                  sendButton =
                      Button(this)

                  sendButton.text =
                      "SEND"

                  sendButton.textSize =
                      13f

                  sendButton.setTextColor(
                      Color.WHITE
                  )

                  sendButton.setBackgroundColor(
                      Color.rgb(
                          20,
                          100,
                          140
                      )
                  )

                  sendButton.setOnClickListener {
                      sendMessage()
                  }

                  /*
                   * Samsung keyboard SEND action.
                   */

                  input.setOnEditorActionListener {
                      _, actionId, _ ->

                      if (
                          actionId ==
                          EditorInfo.IME_ACTION_SEND
                      ) {

                          sendMessage()

                          true

                      } else {

                          false
                      }
                  }

                  /*
                   * Physical/keyboard ENTER key.
                   */

                  input.setOnKeyListener {
                      _, keyCode, event ->

                      if (
                          keyCode ==
                          KeyEvent.KEYCODE_ENTER &&
                          event.action ==
                          KeyEvent.ACTION_DOWN
                      ) {

                          sendMessage()

                          true

                      } else {

                          false
                      }
                  }

                  panel.addView(
                      title
                  )

                  panel.addView(
                      status
                  )

                  panel.addView(
                      chat
                  )

                  val inputRow =
                      LinearLayout(this)

                  inputRow.orientation =
                      LinearLayout.HORIZONTAL

                  inputRow.gravity =
                      Gravity.CENTER_VERTICAL

                  val inputParams =
                      LinearLayout.LayoutParams(
                          0,
                          70,
                          1f
                      )

                  inputRow.addView(
                      input,
                      inputParams
                  )

                  val buttonParams =
                      LinearLayout.LayoutParams(
                          120,
                          70
                      )

                  buttonParams.leftMargin =
                      12

                  inputRow.addView(
                      sendButton,
                      buttonParams
                  )

                  panel.addView(
                      inputRow
                  )

                  val params =
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          460
                      )

                  params.gravity =
                      Gravity.BOTTOM

                  root.addView(
                      panel,
                      params
                  )

                  setContentView(
                      root
                  )
              }

              private fun sendMessage() {

                  val message =
                      input.text
                          .toString()
                          .trim()

                  if (
                      message.isEmpty()
                  ) {
                      return
                  }

                  input.text.clear()

                  chat.text =
                      "YOU:\n$message\n\n" +
                      "AUDREY:\nThinking..."

                  thread {

                      var connection:
                          HttpURLConnection? = null

                      try {

                          connection =
                              URL(
                                  BACKEND_URL
                              ).openConnection()
                                  as HttpURLConnection

                          connection.requestMethod =
                              "POST"

                          connection.connectTimeout =
                              15000

                          connection.readTimeout =
                              30000

                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          )

                          connection.setRequestProperty(
                              "Accept",
                              "application/json"
                          )

                          connection.doOutput =
                              true

                          val body =
                              JSONObject()

                          body.put(
                              "message",
                              message
                          )

                          body.put(
                              "history",
                              brain.getHistory()
                          )

                          connection.outputStream
                              .use {
                                  it.write(
                                      body.toString()
                                          .toByteArray(
                                              Charsets.UTF_8
                                          )
                                  )
                              }

                          val responseCode =
                              connection.responseCode

                          val stream =
                              if (
                                  responseCode in 200..299
                              ) {
                                  connection.inputStream
                              } else {
                                  connection.errorStream
                              }

                          val responseText =
                              stream
                                  ?.bufferedReader()
                                  ?.use {
                                      it.readText()
                                  }
                                  ?: ""

                          if (
                              responseCode !in 200..299
                          ) {

                              throw Exception(
                                  "Server HTTP $responseCode: $responseText"
                              )
                          }

                          val json =
                              JSONObject(
                                  responseText
                              )

                          val answer =
                              json.optString(
                                  "response",
                                  ""
                              )

                          if (
                              answer.isBlank()
                          ) {

                              throw Exception(
                                  "Server returned no response."
                              )
                          }

                          brain.remember(
                              message,
                              answer
                          )

                          runOnUiThread {

                              chat.text =
                                  "YOU:\n$message\n\n" +
                                  "AUDREY:\n$answer"
                          }

                      } catch (
                          error: Exception
                      ) {

                          val fallback =
                              brain.localResponse(
                                  message
                              )

                          brain.remember(
                              message,
                              fallback
                          )

                          runOnUiThread {

                              chat.text =
                                  "YOU:\n$message\n\n" +
                                  "AUDREY:\n$fallback\n\n" +
                                  "CONNECTION ERROR:\n" +
                                  (
                                      error.message
                                          ?: "Unknown error"
                                  )
                          }

                      } finally {

                          connection?.disconnect()
                      }
                  }
              }

              private fun hideSystemUI() {

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }
          }
          EOF

          sed -i "s#__PACKAGE__#package $PACKAGE#" "$MAIN"

      - name: Create backend source
        shell: bash
        run: |
          set -e

          mkdir -p habitat-backend

          cat > habitat-backend/package.json <<'EOF'
          {
            "name": "habitat-audrey-backend",
            "version": "0.5.2",
            "private": true,
            "type": "module",
            "scripts": {
              "start": "node server.mjs"
            },
            "dependencies": {
              "express": "^5.1.0",
              "openai": "^5.20.0"
            }
          }
          EOF

          cat > habitat-backend/server.mjs <<'EOF'
          import express from "express";
          import OpenAI from "openai";

          const app = express();

          app.use(
            express.json({
              limit: "1mb"
            })
          );

          const port =
            process.env.PORT || 8080;

          const model =
            process.env.OPENAI_MODEL ||
            "gpt-5.6-luna";

          const apiKey =
            process.env.OPENAI_API_KEY;

          const client =
            new OpenAI({
              apiKey
            });

          app.get(
            "/",
            (req, res) => {

              res.json({
                habitat: "online",
                service: "Audrey AI backend",
                brain: "ready",
                backend: "ready"
              });

            }
          );

          app.get(
            "/health",
            (req, res) => {

              res.json({
                habitat: "online",
                brain: "ready",
                backend: "ready",
                apiKeyConfigured:
                  Boolean(apiKey),
                model
              });

            }
          );

          app.post(
            "/chat",
            async (req, res) => {

              console.log(
                "CHAT REQUEST RECEIVED"
              );

              try {

                if (!apiKey) {

                  console.error(
                    "OPENAI_API_KEY missing"
                  );

                  return res.status(500).json({
                    error:
                      "OPENAI_API_KEY is not configured."
                  });

                }

                const message =
                  String(
                    req.body?.message || ""
                  ).trim();

                if (!message) {

                  return res.status(400).json({
                    error:
                      "message required"
                  });

                }

                console.log(
                  "User message:",
                  message
                );

                const history =
                  Array.isArray(
                    req.body?.history
                  )
                    ? req.body.history
                    : [];

                const recentHistory =
                  history.slice(-20);

                const memory =
                  recentHistory
                    .map(
                      item =>
                        `USER: ${item.user}\nAUDREY: ${item.assistant}`
                    )
                    .join("\n\n");

                const input =
                  memory
                    ? `Habitat memory:\n${memory}\n\nUSER:\n${message}`
                    : message;

                const response =
                  await client.responses.create({

                    model,

                    instructions:
                      "You are Audrey, the AI companion and intelligence layer for Habitat. Be helpful, direct, natural, and conversational. Habitat is the user's personal AI environment.",

                    input
                  });

                const answer =
                  response.output_text;

                console.log(
                  "AI RESPONSE RECEIVED"
                );

                res.json({
                  response: answer
                });

              } catch (error) {

                console.error(
                  "AI ERROR:",
                  error
                );

                res.status(500).json({
                  error:
                    error?.message ||
                    "AI backend error"
                });

              }
            }
          );

          app.listen(
            port,
            "0.0.0.0",
            () => {

              console.log(
                `Habitat backend listening on ${port}`
              );

            }
          );
          EOF

      - name: Build Habitat Audrey
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "====================================="
          echo " HABITAT / AUDREY"
          echo "====================================="
          echo "Local memory: READY"
          echo "Brain adapter: READY"
          echo "AI backend URL: CONFIGURED"
          echo "Send button: READY"
          echo "Keyboard Enter: READY"
          echo "Command center: READY"
          echo "====================================="

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not created."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK CREATED:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-v0.5.2
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
