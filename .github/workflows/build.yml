package com.habitat.core

import android.app.Activity
import android.content.Context
import android.graphics.Color
import android.graphics.drawable.GradientDrawable
import android.os.Bundle
import android.view.Gravity
import android.view.View
import android.view.animation.AlphaAnimation
import android.widget.*
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.launch
import kotlinx.coroutines.withContext
import java.text.SimpleDateFormat
import java.util.*

class MainActivity : Activity() {

    private lateinit var content: LinearLayout
    private lateinit var status: TextView
    private lateinit var axImage: ImageView
    private lateinit var message: TextView

    private val prefs by lazy {
        getSharedPreferences("habitat", Context.MODE_PRIVATE)
    }

    private val brainAdapter by lazy {
        BrainAdapter(this)
    }

    private val accent = Color.rgb(82, 188, 255)
    private val bg = Color.rgb(7, 9, 15)
    private val card = Color.rgb(17, 21, 31)
    private val text = Color.WHITE
    private val muted = Color.rgb(150, 162, 180)

    private fun dp(v: Int) =
        (v * resources.displayMetrics.density).toInt()

    private fun now() =
        SimpleDateFormat("h:mm a", Locale.US).format(Date())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        showHome()
    }

    private fun base(): LinearLayout =
        LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(bg)
            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(10)
            )
        }

    private fun label(
        value: String,
        size: Float = 14f,
        color: Int = text
    ) =
        TextView(this).apply {
            text = value
            textSize = size
            setTextColor(color)
        }

    private fun button(
        value: String,
        onClick: () -> Unit
    ) =
        Button(this).apply {
            text = value
            textSize = 12f
            setTextColor(text)

            setOnClickListener {
                onClick()
            }

            background = rounded(
                Color.rgb(27, 34, 48),
                dp(12)
            )

            minHeight = dp(44)
        }

    private fun rounded(
        color: Int,
        radius: Int
    ): GradientDrawable =
        GradientDrawable().apply {
            setColor(color)
            cornerRadius = radius.toFloat()
            setStroke(
                dp(1),
                Color.rgb(42, 55, 75)
            )
        }

    private fun header(
        title: String,
        subtitle: String
    ): LinearLayout =
        LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL

            addView(
                label(title, 27f)
            )

            addView(
                label(
                    subtitle,
                    12f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(2)
                }
            )
        }

    private fun install(root: LinearLayout) {

        val nav =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.HORIZONTAL

                gravity = Gravity.CENTER
            }

        listOf(
            "Home",
            "Projects",
            "Brain",
            "Scenes",
            "More"
        ).forEach { item ->

            nav.addView(
                button(item) {

                    when (item) {

                        "Home" ->
                            showHome()

                        "Projects" ->
                            showProjects()

                        "Brain" ->
                            showBrain()

                        "Scenes" ->
                            showScenes()

                        else ->
                            showMore()
                    }
                },
                LinearLayout.LayoutParams(
                    0,
                    dp(52),
                    1f
                )
            )
        }

        root.addView(
            nav,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            )
        )

        setContentView(root)
    }

    private fun showHome() {

        val root = base()

        root.addView(
            header(
                "HABITAT",
                "Your AI companion • Your mission • Your habitat"
            )
        )

        status =
            label(
                "● BRAIN ADAPTER: NOT CONNECTED",
                13f,
                Color.rgb(255, 190, 90)
            )

        root.addView(
            status,
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(7)
            }
        )

        val art =
            FrameLayout(this).apply {
                background =
                    rounded(
                        Color.rgb(12, 15, 23),
                        dp(18)
                    )
            }

        axImage =
            ImageView(this).apply {

                setImageResource(
                    com.habitat.core.R.drawable.ax_portrait
                )

                scaleType =
                    ImageView.ScaleType.CENTER_CROP

                alpha = .98f

                contentDescription =
                    "Ax companion"
            }

        art.addView(
            axImage,
            FrameLayout.LayoutParams(
                -1,
                dp(310)
            )
        )

        val overlay =
            label(
                "AX  •  ONLINE\n\"I'm here. What's the mission?\"",
                16f
            )

        overlay.setPadding(
            dp(14),
            dp(12),
            dp(14),
            dp(12)
        )

        overlay.background =
            rounded(
                Color.argb(
                    215,
                    7,
                    9,
                    15
                ),
                dp(14)
            )

        val op =
            FrameLayout.LayoutParams(
                -1,
                dp(76),
                Gravity.BOTTOM
            )

        op.setMargins(
            dp(10),
            0,
            dp(10),
            dp(10)
        )

        art.addView(
            overlay,
            op
        )

        root.addView(
            art,
            LinearLayout.LayoutParams(
                -1,
                dp(310)
            ).apply {
                topMargin = dp(12)
            }
        )

        val row =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.HORIZONTAL
            }

        row.addView(
            button("TALK TO AX") {
                showChat()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            )
        )

        row.addView(
            button("SCENES") {
                showScenes()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            ).apply {
                leftMargin = dp(8)
            }
        )

        root.addView(
            row,
            LinearLayout.LayoutParams(
                -1,
                dp(60)
            ).apply {
                topMargin = dp(8)
            }
        )

        val grid =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL
            }

        grid.addView(
            infoRow(
                "DropPilot AI",
                prefs.getInt("drop", 67)
                    .toString() + "%",
                "TikTok Shop / Shopify"
            )
        )

        grid.addView(
            infoRow(
                "GTA 6 Channel",
                "42%",
                "Video / editing / upload"
            )
        )

        grid.addView(
            infoRow(
                "Habitat Development",
                "25%",
                "UI / brain / testing"
            )
        )

        root.addView(
            grid,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            ).apply {
                topMargin = dp(8)
            }
        )

        install(root)
    }

    private fun infoRow(
        title: String,
        progress: String,
        sub: String
    ): View =
        LinearLayout(this).apply {

            orientation =
                LinearLayout.HORIZONTAL

            gravity =
                Gravity.CENTER_VERTICAL

            background =
                rounded(
                    card,
                    dp(14)
                )

            setPadding(
                dp(12),
                dp(9),
                dp(12),
                dp(9)
            )

            addView(
                LinearLayout(
                    this@MainActivity
                ).apply {

                    orientation =
                        LinearLayout.VERTICAL

                    addView(
                        label(title, 14f)
                    )

                    addView(
                        label(
                            sub,
                            11f,
                            muted
                        )
                    )
                },
                LinearLayout.LayoutParams(
                    0,
                    -2,
                    1f
                )
            )

            addView(
                label(
                    progress,
                    16f,
                    accent
                )
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    dp(66)
                ).apply {
                    bottomMargin = dp(7)
                }
        }

    private fun showChat() {

        val root = base()

        root.addView(
            header(
                "Chat",
                "Talk with Ax • Habitat brain connection"
            )
        )

        val scroll =
            ScrollView(this)

        val log =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL

                setPadding(
                    0,
                    dp(12),
                    0,
                    dp(8)
                )
            }

        log.addView(
            bubble(
                "Ax",
                "Hey. I'm here. What are we working on?",
                false
            )
        )

        val old =
            prefs.getString(
                "last_message",
                ""
            )

        if (!old.isNullOrBlank()) {

            log.addView(
                bubble(
                    "You",
                    old,
                    true
                )
            )
        }

        scroll.addView(log)

        root.addView(
            scroll,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val input =
            EditText(this).apply {

                hint = "Message Ax..."

                setHintTextColor(muted)

                setTextColor(text)

                background =
                    rounded(
                        card,
                        dp(12)
                    )

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )

                minHeight = dp(54)
            }

        val send =
            button("SEND") {

                val m =
                    input.text
                        .toString()
                        .trim()

                if (m.isEmpty()) {
                    return@button
                }

                prefs.edit()
                    .putString(
                        "last_message",
                        m
                    )
                    .apply()

                HabitatWidget.refresh(this)

                log.addView(
                    bubble(
                        "You",
                        m,
                        true
                    )
                )

                input.text.clear()

                status =
                    label(
                        "● BRAIN ADAPTER: CONNECTING...",
                        13f,
                        Color.rgb(
                            255,
                            190,
                            90
                        )
                    )

                Toast.makeText(
                    this,
                    "Ax is thinking...",
                    Toast.LENGTH_SHORT
                ).show()

                CoroutineScope(
                    Dispatchers.Main
                ).launch {

                    val result =
                        brainAdapter.send(m)

                    when (result.state) {

                        BrainAdapter.State.CONNECTED -> {

                            status =
                                label(
                                    "● BRAIN ADAPTER: CONNECTED",
                                    13f,
                                    Color.rgb(
                                        100,
                                        220,
                                        130
                                    )
                                )

                            log.addView(
                                bubble(
                                    "Ax",
                                    result.reply,
                                    false
                                )
                            )
                        }

                        BrainAdapter.State.DISCONNECTED -> {

                            status =
                                label(
                                    "● BRAIN ADAPTER: NOT CONNECTED",
                                    13f,
                                    Color.rgb(
                                        255,
                                        190,
                                        90
                                    )
                                )

                            log.addView(
                                bubble(
                                    "Ax",
                                    "I received your message, but my brain connection isn't configured yet.",
                                    false
                                )
                            )
                        }

                        BrainAdapter.State.ERROR -> {

                            status =
                                label(
                                    "● BRAIN ADAPTER: CONNECTION ERROR",
                                    13f,
                                    Color.rgb(
                                        255,
                                        110,
                                        110
                                    )
                                )

                            log.addView(
                                bubble(
                                    "Ax",
                                    "The brain connection returned an error: ${
                                        result.error
                                            ?: "Unknown error"
                                    }",
                                    false
                                )
                            )
                        }

                        BrainAdapter.State.CONNECTING -> {
                            // Connection state is handled above.
                        }
                    }

                    scroll.post {
                        scroll.fullScroll(
                            View.FOCUS_DOWN
                        )
                    }
                }
            }

        root.addView(
            input,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            ).apply {
                bottomMargin = dp(6)
            }
        )

        root.addView(
            send,
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            )
        )

        install(root)
    }

    private fun bubble(
        who: String,
        body: String,
        user: Boolean
    ): TextView =
        label(
            "$who\n$body",
            14f
        ).apply {

            setTextColor(text)

            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            background =
                rounded(
                    if (user)
                        Color.rgb(
                            28,
                            48,
                            68
                        )
                    else
                        card,
                    dp(14)
                )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(6)
                    bottomMargin = dp(6)
                }
        }

    private fun showProjects() {

        val root = base()

        root.addView(
            header(
                "Projects",
                "Your active work in one place"
            )
        )

        root.addView(
            projectCard(
                "DropPilot AI",
                "67%",
                "Product research • TikTok Shop • Shopify"
            )
        )

        root.addView(
            projectCard(
                "GTA 6 Channel",
                "42%",
                "Scripts • images • editing • upload"
            )
        )

        root.addView(
            projectCard(
                "Habitat Development",
                "25%",
                "Android UI • brain • scenes • widgets"
            )
        )

        root.addView(
            button("+ NEW PROJECT") {
                Toast.makeText(
                    this,
                    "Project creation is ready for the next data layer",
                    Toast.LENGTH_SHORT
                ).show()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(8)
            }
        )

        install(root)
    }

    private fun projectCard(
        name: String,
        progress: String,
        sub: String
    ): View =
        LinearLayout(this).apply {

            orientation =
                LinearLayout.VERTICAL

            background =
                rounded(
                    card,
                    dp(15)
                )

            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            addView(
                LinearLayout(
                    this@MainActivity
                ).apply {

                    orientation =
                        LinearLayout.HORIZONTAL

                    addView(
                        label(name, 16f),
                        LinearLayout.LayoutParams(
                            0,
                            -2,
                            1f
                        )
                    )

                    addView(
                        label(
                            progress,
                            16f,
                            accent
                        )
                    )
                }
            )

            addView(
                label(
                    sub,
                    12f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(4)
                }
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    dp(78)
                ).apply {
                    bottomMargin = dp(8)
                }
        }

    private fun showBrain() {

        val root = base()

        root.addView(
            header(
                "Brain",
                "The control room for Habitat's intelligence layer"
            )
        )

        val items =
            listOf(
                "Brain Adapter" to
                        "NOT CONNECTED",

                "Memory / Context" to
                        "LOCAL SHELL READY",

                "Projects" to
                        "3 ACTIVE",

                "Automations" to
                        "FOUNDATION READY",

                "System Health" to
                        "GOOD"
            )

        items.forEach { (a, b) ->

            root.addView(
                infoRow(
                    a,
                    b,
                    "Habitat core"
                )
            )
        }

        root.addView(
            button(
                "TEST BRAIN CONNECTION"
            ) {

                status =
                    label(
                        "● BRAIN ADAPTER: TESTING...",
                        13f,
                        Color.rgb(
                            255,
                            190,
                            90
                        )
                    )

                CoroutineScope(
                    Dispatchers.Main
                ).launch {

                    val result =
                        brainAdapter.send(
                            "Habitat connection test"
                        )

                    when (result.state) {

                        BrainAdapter.State.CONNECTED -> {

                            Toast.makeText(
                                this@MainActivity,
                                "Brain connection successful",
                                Toast.LENGTH_SHORT
                            ).show()

                            showBrain()
                        }

                        BrainAdapter.State.DISCONNECTED -> {

                            Toast.makeText(
                                this@MainActivity,
                                "Brain endpoint is not configured yet",
                                Toast.LENGTH_SHORT
                            ).show()

                            showBrain()
                        }

                        else -> {

                            Toast.makeText(
                                this@MainActivity,
                                result.error
                                    ?: "Brain connection failed",
                                Toast.LENGTH_LONG
                            ).show()

                            showBrain()
                        }
                    }
                }
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(8)
            }
        )

        root.addView(
            label(
                "The adapter is now real. Habitat will not pretend the brain is connected. The next layer connects this adapter to the actual intelligence service.",
                12f,
                muted
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(12)
            }
        )

        install(root)
    }

    private fun showScenes() {

        val root = base()

        root.addView(
            header(
                "Scenes",
                "Switch Ax's environment without changing the brain"
            )
        )

        val scenes =
            listOf(
                "Desk" to "Command center",
                "Chat" to "Just you and Ax",
                "Planning" to "Ideas → action",
                "Relax" to "Unwind and reset",
                "Night City" to "Same Ax, different atmosphere"
            )

        scenes.forEach { (name, desc) ->

            val b =
                button(
                    "${sceneIcon(name)}  $name\n$desc"
                ) {

                    prefs.edit()
                        .putString(
                            "scene",
                            name
                        )
                        .apply()

                    HabitatWidget.refresh(this)

                    Toast.makeText(
                        this,
                        "Scene: $name",
                        Toast.LENGTH_SHORT
                    ).show()

                    animateAx()
                }

            b.gravity =
                Gravity.CENTER_VERTICAL or
                        Gravity.START

            root.addView(
                b,
                LinearLayout.LayoutParams(
                    -1,
                    dp(64)
                ).apply {
                    bottomMargin = dp(8)
                }
            )
        }

        install(root)
    }

    private fun sceneIcon(
        name: String
    ) =
        when (name) {

            "Desk" -> "🖥️"

            "Chat" -> "💬"

            "Planning" -> "🧠"

            "Relax" -> "🌙"

            else -> "🌃"
        }

    private fun showMore() {

        val root = base()

        root.addView(
            header(
                "More",
                "Settings and quick controls"
            )
        )

        root.addView(
            button("AX APPEARANCE") {

                Toast.makeText(
                    this,
                    "2D Ax layer is installed in the core",
                    Toast.LENGTH_SHORT
                ).show()
            }
        )

        root.addView(
            button("NOTIFICATIONS") {

                Toast.makeText(
                    this,
                    "Notification foundation is ready for Android integration",
                    Toast.LENGTH_SHORT
                ).show()
            }
        )

        root.addView(
            button("WIDGETS") {

                Toast.makeText(
                    this,
                    "Widget foundation comes next in the Android layer",
                    Toast.LENGTH_SHORT
                ).show()
            }
        )

        root.addView(
            button("ABOUT HABITAT") {

                Toast.makeText(
                    this,
                    "Habitat v0.2.2 • Ax Edition",
                    Toast.LENGTH_LONG
                ).show()
            }
        )

        install(root)
    }

    private fun animateAx() {

        if (!::axImage.isInitialized)
            return

        val a =
            AlphaAnimation(
                .55f,
                1f
            )

        a.duration = 450

        axImage.startAnimation(a)
    }
}
