        )

        screen.addView(
            card(
                "MEMORY",
                "LOCAL",
                "Conversation and project memory foundation"
            )
        )

        screen.addView(
            card(
                "TASK ENGINE",
                "READY",
                "Tasks and execution state"
            )
        )

        screen.addView(
            card(
                "AGENT SYSTEM",
                "READY",
                "Specialized Habitat workers"
            )
        )

        screen.addView(
            text(
                "API credentials belong on the server/provider side, not inside the APK.",
                12f,
                muted
