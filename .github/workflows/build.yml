name: Habitat v0.2.2 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Habitat v0.2.2 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*0.2.2*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Habitat v0.2.2 ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Habitat v0.2.2
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Habitat v0.2.2
        run: |
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle.properties"

          echo "Habitat v0.2.2 Android project verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build Habitat v0.2.2
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Habitat v0.2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.2.2-Ax-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
