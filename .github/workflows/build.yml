name: Habitat Audrey Full Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat
        run: |
          rm -rf habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

      - name: Locate Android project
        run: |
          SETTINGS=$(find habitat-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Locate application
        run: |
          MANIFEST=$(find "$PROJECT_DIR" -name AndroidManifest.xml | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          APP_DIR=$(dirname "$MANIFEST")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Locate MainActivity
        run: |
          MAIN=$(find "$APP_DIR" -name MainActivity.kt | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Audrey Brain
        run: |
          MAIN_DIR=$(dirname "$MAIN")

          cat > "$MAIN_DIR/AudreyBrain.kt" <<'EOF'
          package com.habitat.core

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class AudreyBrain(private val context: Context) {

              private val prefs =
                  context.getSharedPreferences("audrey_brain", Context.MODE_PRIVATE)

              fun remember(role: String, message: String) {
                  val raw = prefs.getString("memory", "[]") ?: "[]"

                  val array = try {
                      JSONArray(raw)
                  } catch (e: Exception) {
                      JSONArray()
                  }

                  val item = JSONObject()
                  item.put("role", role)
                  item.put("message", message)
                  item.put("time", System.currentTimeMillis())

                  array.put(item)

                  while (array.length() > 100) {
                      array.remove(0)
                  }

                  prefs.edit()
                      .putString("memory", array.toString())
                      .apply()
              }

              fun respond(message: String): String {
                  remember("user", message)

                  val text = message.trim().lowercase()

                  val response = when {
                      text.contains("hello") ||
                      text.contains("hi") ||
                      text.contains("hey") ->
                          "Hello. I'm Audrey. Habitat is online."

                      text.contains("who are you") ->
                          "I'm Audrey, the companion interface for Habitat."

                      text.contains("status") ->
                          "Habitat online. Local memory online. Brain adapter online. AI backend ready for connection."

                      text.contains("remember") ->
                          "Local persistent memory is enabled."

                      text.contains("habitat") ->
                          "Habitat is my environment. I'm connected to its brain layer."

                      else ->
                          "I heard you. The AI backend connection point is ready."
                  }

                  remember("assistant", response)

                  return response
              }
          }
          EOF

      - name: Replace MainActivity
        run: |
          cat > "$MAIN" <<'EOF'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var brain: AudreyBrain
              private lateinit var conversation: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  brain = AudreyBrain(this)

                  enableImmersiveMode()
                  buildAudreyScreen()
              }

              private fun enableImmersiveMode() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)

                  if (hasFocus) {
                      enableImmersiveMode()
                  }
              }

              private fun buildAudreyScreen() {

                  val root = FrameLayout(this)

                  root.setBackgroundColor(
                      Color.rgb(5, 7, 15)
                  )

                  val environment = LinearLayout(this)

                  environment.orientation =
                      LinearLayout.VERTICAL

                  environment.gravity =
                      Gravity.CENTER

                  environment.setBackgroundColor(
                      Color.rgb(5, 7, 15)
                  )

                  val title = TextView(this)

                  title.text = "AUDREY"

                  title.textSize = 32f

                  title.typeface =
                      Typeface.DEFAULT_BOLD

                  title.setTextColor(
                      Color.WHITE
                  )

                  title.gravity =
                      Gravity.CENTER

                  val desk = TextView(this)

                  desk.text =
                      "\n\n\n\n\n\n\n" +
                      "AUDREY WORKSTATION\n\n" +
                      "[ AUDREY VISUAL LAYER ]"

                  desk.textSize = 20f

                  desk.setTextColor(
                      Color.WHITE
                  )

                  desk.gravity =
                      Gravity.CENTER

                  environment.addView(
                      title,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  environment.addView(
                      desk,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  root.addView(
                      environment,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  val top = LinearLayout(this)

                  top.orientation =
                      LinearLayout.VERTICAL

                  top.gravity =
                      Gravity.CENTER

                  top.setPadding(
                      24,
                      30,
                      24,
                      10
                  )

                  val online = TextView(this)

                  online.text =
                      "HABITAT • ONLINE"

                  online.textSize = 12f

                  online.setTextColor(
                      Color.rgb(70, 230, 160)
                  )

                  online.gravity =
                      Gravity.CENTER

                  top.addView(online)

                  val topParams =
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )

                  topParams.gravity = Gravity.TOP

                  root.addView(
                      top,
                      topParams
                  )

                  val panel = LinearLayout(this)

                  panel.orientation =
                      LinearLayout.VERTICAL

                  panel.setPadding(
                      20,
                      12,
                      20,
                      16
                  )

                  panel.setBackgroundColor(
                      Color.argb(220, 5, 8, 18)
                  )

                  conversation = TextView(this)

                  conversation.text =
                      "AUDREY\n\n" +
                      "I'm online.\n\n" +
                      "Local memory: READY\n" +
                      "Brain adapter: READY\n" +
                      "AI backend: READY FOR CONNECTION\n\n" +
                      "Talk to me."

                  conversation.textSize = 16f

                  conversation.setTextColor(
                      Color.WHITE
                  )

                  conversation.setPadding(
                      12,
                      12,
                      12,
                      12
                  )

                  val scroll = ScrollView(this)

                  scroll.addView(conversation)

                  panel.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  val inputRow = LinearLayout(this)

                  inputRow.orientation =
                      LinearLayout.HORIZONTAL

                  val input = EditText(this)

                  input.hint =
                      "Talk to Audrey..."

                  input.setHintTextColor(
                      Color.GRAY
                  )

                  input.setTextColor(
                      Color.WHITE
                  )

                  val send = Button(this)

                  send.text = "SEND"

                  send.setOnClickListener {

                      val message =
                          input.text.toString().trim()

                      if (message.isNotEmpty()) {

                          val response =
                              brain.respond(message)

                          conversation.append(
                              "\n\nYOU\n" +
                              message +
                              "\n\nAUDREY\n" +
                              response
                          )

                          input.text.clear()

                          scroll.post {
                              scroll.fullScroll(
                                  ScrollView.FOCUS_DOWN
                              )
                          }
                      }
                  }

                  inputRow.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  inputRow.addView(
                      send,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  panel.addView(inputRow)

                  val panelParams =
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          430
                      )

                  panelParams.gravity =
                      Gravity.BOTTOM

                  root.addView(
                      panel,
                      panelParams
                  )

                  setContentView(root)
              }
          }
          EOF

      - name: Add Internet permission
        run: |
          MANIFEST=$(find "$APP_DIR" -name AndroidManifest.xml | head -n 1)

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

      - name: Set version
        run: |
          GRADLE_FILE=$(find "$APP_DIR" -maxdepth 2 \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -f "$GRADLE_FILE" ]; then
            sed -i -E 's/versionCode[[:space:]]*[0-9]+/versionCode 4/' "$GRADLE_FILE" || true
            sed -i -E 's/versionName[[:space:]]*["'\''][^"'\'']+["'\'']/versionName "0.4.0"/' "$GRADLE_FILE" || true
          fi

      - name: Build Habitat
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload Habitat Audrey APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-0.4.0
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
