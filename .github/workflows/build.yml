name: Habitat Audrey Full Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Habitat
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        shell: bash
        run: |
          set -e

          rm -rf habitat-project
          mkdir -p habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

          PROJECT_DIR="habitat-project/HabitatAndroid"
          APP_DIR="$PROJECT_DIR/app"
          MAIN_DIR="$APP_DIR/src/main"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$APP_DIR/build.gradle.kts"
          test -f "$MAIN_DIR/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MAIN_DIR=$MAIN_DIR" >> "$GITHUB_ENV"

      - name: Detect MainActivity
        shell: bash
        run: |
          set -e

          MAIN=$(find "$MAIN_DIR" -type f -name "MainActivity.kt" -print -quit)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          PACKAGE=$(grep -m1 '^package ' "$MAIN" | sed 's/^package //')
          PACKAGE_DIR=$(dirname "$MAIN")

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

          echo "Package: $PACKAGE"

      - name: Prepare Audrey artwork
        shell: bash
        run: |
          set -e

          DRAWABLE_DIR="$MAIN_DIR/res/drawable-nodpi"
          mkdir -p "$DRAWABLE_DIR"

          if [ -f "lucia.png" ]; then
            cp "lucia.png" "$DRAWABLE_DIR/lucia.png"
            echo "Audrey artwork installed."
          else
            echo "No lucia.png found. Creating fallback artwork."

            cat > "$DRAWABLE_DIR/lucia.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1080dp"
              android:height="1920dp"
              android:viewportWidth="1080"
              android:viewportHeight="1920">

              <path
                  android:fillColor="#090914"
                  android:pathData="M0,0 L1080,0 L1080,1920 L0,1920 Z"/>

              <path
                  android:fillColor="#24124A"
                  android:pathData="M0,300 L1080,0 L1080,850 L0,1150 Z"/>

              <path
                  android:fillColor="#083C52"
                  android:pathData="M0,1100 L1080,800 L1080,1920 L0,1920 Z"/>

          </vector>
          EOF
          fi

      - name: Create Audrey brain
        shell: bash
        run: |
          set -e

          cat > "$PACKAGE_DIR/AudreyBrain.kt" <<EOF
          package $PACKAGE

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class AudreyBrain(private val context: Context) {

              private val prefs =
                  context.getSharedPreferences("habitat_memory", Context.MODE_PRIVATE)

              fun status(): String {
                  return "Local memory ready\\nBrain adapter ready\\nAI backend ready for connection"
              }

              fun remember(userMessage: String, assistantMessage: String) {
                  val history = JSONArray(
                      prefs.getString("conversation_history", "[]")
                  )

                  val item = JSONObject()
                  item.put("user", userMessage)
                  item.put("assistant", assistantMessage)
                  item.put("time", System.currentTimeMillis())

                  history.put(item)

                  while (history.length() > 50) {
                      val trimmed = JSONArray()

                      for (i in 1 until history.length()) {
                          trimmed.put(history.get(i))
                      }

                      prefs.edit()
                          .putString(
                              "conversation_history",
                              trimmed.toString()
                          )
                          .apply()

                      return
                  }

                  prefs.edit()
                      .putString(
                          "conversation_history",
                          history.toString()
                      )
                      .apply()
              }

              fun respond(message: String): String {
                  val text = message.lowercase()

                  return when {
                      text.contains("hello") ||
                      text.contains("hi") ||
                      text.contains("hey") ->
                          "I'm here. Habitat is online."

                      text.contains("status") ->
                          status()

                      text.contains("remember") ->
                          "Got it. I'll keep that in Habitat's local memory."

                      text.contains("who are you") ->
                          "I'm Audrey, the companion interface for Habitat."

                      else ->
                          "Habitat received your message. My local brain is connected and ready for the AI backend."
                  }
              }
          }
          EOF

      - name: Create Audrey interface
        shell: bash
        run: |
          set -e

          cat > "$MAIN" <<EOF
          package $PACKAGE

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var chat: TextView
              private lateinit var brain: AudreyBrain

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  brain = AudreyBrain(this)

                  hideSystemUI()

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  val artwork = ImageView(this)
                  artwork.setImageResource(R.drawable.lucia)
                  artwork.scaleType = ImageView.ScaleType.CENTER_CROP

                  root.addView(
                      artwork,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  val overlay = LinearLayout(this)
                  overlay.orientation = LinearLayout.VERTICAL
                  overlay.setPadding(32, 40, 32, 28)
                  overlay.gravity = Gravity.BOTTOM

                  val title = TextView(this)
                  title.text = "AUDREY"
                  title.textSize = 26f
                  title.typeface = Typeface.DEFAULT_BOLD
                  title.setTextColor(Color.WHITE)
                  title.setPadding(18, 10, 18, 2)

                  val subtitle = TextView(this)
                  subtitle.text = "HABITAT • PERSONAL AI ENVIRONMENT"
                  subtitle.textSize = 12f
                  subtitle.setTextColor(Color.LTGRAY)
                  subtitle.setPadding(18, 0, 18, 12)

                  chat = TextView(this)
                  chat.text = "Habitat online.\\n\\n" + brain.status()
                  chat.textSize = 16f
                  chat.setTextColor(Color.WHITE)
                  chat.setPadding(20, 18, 20, 18)

                  input = EditText(this)
                  input.hint = "Talk to Audrey..."
                  input.textSize = 16f
                  input.setSingleLine(true)
                  input.inputType = InputType.TYPE_CLASS_TEXT
                  input.imeOptions = EditorInfo.IME_ACTION_SEND
                  input.setTextColor(Color.WHITE)
                  input.setHintTextColor(Color.LTGRAY)
                  input.setPadding(22, 0, 22, 0)

                  input.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEND) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }

                  overlay.addView(title)
                  overlay.addView(subtitle)
                  overlay.addView(chat)

                  overlay.addView(
                      input,
                      LinearLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          64
                      )
                  )

                  root.addView(
                      overlay,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                      )
                  )

                  setContentView(root)
              }

              private fun sendMessage() {
                  val message = input.text.toString().trim()

                  if (message.isEmpty()) return

                  val response = brain.respond(message)

                  chat.text =
                      "YOU: \$message\\n\\nAUDREY: \$response"

                  brain.remember(message, response)

                  input.text.clear()
              }

              private fun hideSystemUI() {
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }
          }
          EOF

      - name: Add Internet permission
        shell: bash
        run: |
          set -e

          MANIFEST="$MAIN_DIR/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Build Habitat Audrey
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Habitat Audrey build..."

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK CREATED:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Habitat Audrey APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Full-Build
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
