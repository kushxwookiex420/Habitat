          cat > "$SOURCE_DIR/ExecutionEngine.kt" <<'KOTLIN'
package com.habitat.core

enum class ExecutionResult {
    NOT_STARTED,
    RUNNING,
    SUCCESS,
    FAILED,
    UNVERIFIED
}

data class ExecutionRecord(
    val actionId: String,
    val result: ExecutionResult,
    val message: String
)

class ExecutionEngine {

    private val records =
        mutableListOf<ExecutionRecord>()

    fun begin(
        actionId: String
    ): ExecutionRecord {

        val record =
            ExecutionRecord(
                actionId,
                ExecutionResult.RUNNING,
                "Execution started."
            )

        records.add(record)

        return record
    }

    fun verify(
        actionId: String,
        success: Boolean,
        message: String
    ): ExecutionRecord {

        val result =
            if (success)
                ExecutionResult.SUCCESS
            else
                ExecutionResult.FAILED

        val record =
            ExecutionRecord(
                actionId,
                result,
                message
            )

        records.add(record)

        return record
    }

    fun history(): List<ExecutionRecord> =
        records.toList()
}
