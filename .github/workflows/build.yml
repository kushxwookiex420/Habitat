name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Check MainActivity
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            find "$PROJECT_DIR/app/src/main/java" -type f -name "*.kt" -print
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          echo "Checking first 25 lines only:"
          sed -n '1,25p' "$MAIN_FILE"

      - name: Build Habitat
        run: |
          cd "$PROJECT_DIR"

          echo "Building Habitat..."
          echo "Project directory: $PWD"

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
