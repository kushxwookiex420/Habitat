                statusText =
                    statusTextOrCreate(
                        screen
                    )

                statusText.text =
                    brainStatus()

                statusText.setTextColor(
                    brainColor()
                )

                Toast.makeText(
                    this,
                    "Brain endpoint saved.",
                    Toast.LENGTH_SHORT
