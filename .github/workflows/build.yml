      - name: Install Audrey environment
        run: |
          RES_DIR="$APP_DIR/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "Android resources directory not found:"
            echo "$RES_DIR"
            exit 1
          fi

          mkdir -p "$RES_DIR/drawable-nodpi"

          if [ ! -f "lucia.png" ]; then
            echo "ERROR: lucia.png is missing from repository root."
            exit 1
          fi

          cp lucia.png "$RES_DIR/drawable-nodpi/lucia.png"

          echo "================================"
          echo "AUDREY ENVIRONMENT INSTALLED"
          echo "Lucia workstation image loaded."
          echo "================================"
