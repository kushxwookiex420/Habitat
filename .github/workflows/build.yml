name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Fix exact Kotlin timestamp syntax
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "Checking source..."

          grep -n '\[\$now()\]' "$MAIN_FILE" || true

          python3 - "$MAIN_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          old = '[$now()]'
          new = '[${now()}]'

          if old not in text:
              print("ERROR: Expected [$now()] pattern was not found.")
              sys.exit(1)

          text = text.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("SUCCESS: Changed [$now()] to [${now()}].")
          PY

          echo "Verified source:"
          nl -ba "$MAIN_FILE" | sed -n '24,29p'

      - name: Build Habitat
        run: |
          cd "$PROJECT_DIR"
          echo "Building Habitat..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
