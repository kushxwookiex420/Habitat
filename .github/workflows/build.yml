package com.habitat.core

enum class ExecutionResult {
    NOT_STARTED,
    RUNNING,
    SUCCESS,
    FAILED,
    UNVERIFIED
}

data class ExecutionRecord(
    val actionId: String,
    val result: ExecutionResult,
    val message: String
)

class ExecutionEngine {

    private val history =
        mutableListOf<ExecutionRecord>()

    fun begin(
        actionId: String
    ): ExecutionRecord {

        val record =
            ExecutionRecord(
                actionId,
                ExecutionResult.RUNNING,
                "Execution started."
            )

        history.add(record)

        return record
    }

    fun verify(
        actionId: String,
        success: Boolean,
        message: String
    ): ExecutionRecord {

        val result =
            if (success)
                ExecutionResult.SUCCESS
            else
                ExecutionResult.FAILED

        val record =
            ExecutionRecord(
                actionId,
                result,
                message
            )

        history.add(record)

        return record
    }

    fun history():
        List<ExecutionRecord> =
        history.toList()
}

