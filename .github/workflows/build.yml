name: Habitat Audrey — Full Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. GET HABITAT
      # --------------------------------------------------
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat
        run: |
          rm -rf habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

      # --------------------------------------------------
      # 2. FIND ANDROID PROJECT
      # --------------------------------------------------
      - name: Locate Android project
        run: |
          SETTINGS=$(find habitat-project \
            -name settings.gradle \
            -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Locate application
        run: |
          MANIFEST=$(find "$PROJECT_DIR" \
            -name AndroidManifest.xml | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          APP_DIR=$(dirname "$MANIFEST")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Locate MainActivity
        run: |
          MAIN=$(find "$APP_DIR" \
            -name MainActivity.kt | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. JAVA + GRADLE
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # --------------------------------------------------
      # 4. INSTALL LUCIA / AUDREY ENVIRONMENT
      # --------------------------------------------------
      - name: Install Audrey environment
        run: |
          RES_DIR=$(find "$APP_DIR/src/main" \
            -maxdepth 1 \
            -type d \
            -name res | head -n 1)

          if [ -z "$RES_DIR" ]; then
            echo "Android resources directory not found"
            exit 1
          fi

          mkdir -p "$RES_DIR/drawable-nodpi"

          if [ ! -f "lucia.png" ]; then
            echo "ERROR: lucia.png is missing from repository root."
            echo "Upload the Lucia image to the repository root and name it lucia.png."
            exit 1
          fi

          cp lucia.png "$RES_DIR/drawable-nodpi/lucia.png"

          echo "Lucia/Audrey environment installed."

      # --------------------------------------------------
      # 5. AUDREY BRAIN
      # --------------------------------------------------
      - name: Create Audrey Brain
        run: |
          MAIN_DIR=$(dirname "$MAIN")

          cat > "$MAIN_DIR/AudreyBrain.kt" <<'EOF'
          package com.habitat.core

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class AudreyBrain(private val context: Context) {

              private val prefs =
                  context.getSharedPreferences(
                      "audrey_brain",
                      Context.MODE_PRIVATE
                  )

              fun remember(role: String, message: String) {

                  val raw =
                      prefs.getString("memory", "[]") ?: "[]"

                  val array =
                      try {
                          JSONArray(raw)
                      } catch (e: Exception) {
                          JSONArray()
                      }

                  val item = JSONObject()

                  item.put("role", role)
                  item.put("message", message)
                  item.put(
                      "time",
                      System.currentTimeMillis()
                  )

                  array.put(item)

                  while (array.length() > 150) {
                      array.remove(0)
                  }

                  prefs.edit()
                      .putString(
                          "memory",
                          array.toString()
                      )
                      .apply()
              }

              fun memoryCount(): Int {

                  val raw =
                      prefs.getString("memory", "[]")
                          ?: "[]"

                  return try {
                      JSONArray(raw).length()
                  } catch (e: Exception) {
                      0
                  }
              }

              fun respond(message: String): String {

                  remember("user", message)

                  val text =
                      message.trim().lowercase()

                  val response = when {

                      text.contains("hello") ||
                      text.contains("hi") ||
                      text.contains("hey") ->
                          "Hey. Audrey is online. Habitat is ready."

                      text.contains("who are you") ->
                          "I'm Audrey — the companion interface living inside Habitat."

                      text.contains("status") ->
                          "Habitat online. Memory online. Brain adapter online. AI backend connection ready."

                      text.contains("remember") ->
                          "I can store our local conversation memory inside Habitat."

                      text.contains("brain") ->
                          "Brain adapter online. The local memory layer is active."

                      text.contains("habitat") ->
                          "Habitat is my environment. This workstation is my interface."

                      text.contains("audrey") ->
                          "I'm here."

                      else ->
                          "I'm listening. The local brain received that message. The AI backend connection point is ready for the next layer."
                  }

                  remember(
                      "assistant",
                      response
                  )

                  return response
              }
          }
          EOF

      # --------------------------------------------------
      # 6. AUDREY FULLSCREEN WORKSTATION
      # --------------------------------------------------
      - name: Create Audrey Interface
        run: |
          cat > "$MAIN" <<'EOF'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var brain: AudreyBrain
              private lateinit var conversation: TextView
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  brain = AudreyBrain(this)

                  enableImmersiveMode()
                  buildAudreyEnvironment()
              }

              private fun enableImmersiveMode() {

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }

              override fun onWindowFocusChanged(
                  hasFocus: Boolean
              ) {
                  super.onWindowFocusChanged(hasFocus)

                  if (hasFocus) {
                      enableImmersiveMode()
                  }
              }

              private fun panelBackground(
                  alpha: Int = 215
              ): GradientDrawable {

                  return GradientDrawable().apply {

                      setColor(
                          Color.argb(
                              alpha,
                              4,
                              8,
                              18
                          )
                      )

                      cornerRadius = 28f

                      setStroke(
                          1,
                          Color.argb(
                              110,
                              80,
                              180,
                              255
                          )
                      )
                  }
              }

              private fun buildAudreyEnvironment() {

                  val root =
                      FrameLayout(this)

                  root.setBackgroundColor(
                      Color.BLACK
                  )

                  // ----------------------------------------
                  // LUCIA / AUDREY ENVIRONMENT
                  // ----------------------------------------

                  val background =
                      ImageView(this)

                  background.setImageResource(
                      R.drawable.lucia
                  )

                  background.scaleType =
                      ImageView.ScaleType.CENTER_CROP

                  root.addView(
                      background,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  // Dark cinematic overlay
                  val cinematic =
                      View(this)

                  cinematic.setBackgroundColor(
                      Color.argb(
                          55,
                          0,
                          0,
                          10
                      )
                  )

                  root.addView(
                      cinematic,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  // ----------------------------------------
                  // TOP HUD
                  // ----------------------------------------

                  val hud =
                      LinearLayout(this)

                  hud.orientation =
                      LinearLayout.VERTICAL

                  hud.gravity =
                      Gravity.CENTER

                  hud.setPadding(
                      22,
                      22,
                      22,
                      12
                  )

                  val status =
                      TextView(this)

                  status.text =
                      "● HABITAT ONLINE"

                  status.textSize = 12f

                  status.setTextColor(
                      Color.rgb(
                          80,
                          255,
                          180
                      )
                  )

                  status.typeface =
                      Typeface.DEFAULT_BOLD

                  status.gravity =
                      Gravity.CENTER

                  hud.addView(status)

                  val name =
                      TextView(this)

                  name.text =
                      "AUDREY"

                  name.textSize = 28f

                  name.setTextColor(
                      Color.WHITE
                  )

                  name.typeface =
                      Typeface.DEFAULT_BOLD

                  name.gravity =
                      Gravity.CENTER

                  hud.addView(name)

                  val subtitle =
                      TextView(this)

                  subtitle.text =
                      "PERSONAL AI COMP
