name: Habitat v0.3.3 Ax Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.3.3 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Extract Habitat v0.3.3 project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Habitat-Android-v0.3.0-Ax-Edition.zip"

          test -f "$ZIP"

          rm -rf HabitatBuild
          mkdir -p HabitatBuild

          unzip -q "$ZIP" -d HabitatBuild

          PROJECT_DIR="$(
            find HabitatBuild \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          test -n "$PROJECT_DIR"

          echo "HABITAT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "HABITAT PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"

      - name: Verify Habitat v0.3.3 source
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"
          CORE="$PROJECT/app/src/main/java/com/habitat/core"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f "$CORE/MainActivity.kt"
          test -f "$CORE/BrainAdapter.kt"
          test -f "$CORE/WorkerAdapter.kt"
          test -f "$CORE/WorkerRegistry.kt"
          test -f "$CORE/Models.kt"
          test -f "$CORE/TaskStore.kt"
          test -f "$CORE/HologramView.kt"
          test -f "$CORE/HabitatWidget.kt"

          echo "Habitat v0.3.3 source verified."

      - name: Inspect MainActivity worker call
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "MAIN ACTIVITY WORKER CALL"
          echo "=============================================="

          grep -n -C 12 "adapter.run" "$CORE/MainActivity.kt" || true

      - name: Repair MainActivity worker callback
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()

          callback_patterns = [
              "){res->",
              "){ res ->",
              ") {res->",
              ") { res ->",
          ]

          replacement = "){ok, text, detail ->"

          matched = None

          for pattern in callback_patterns:
              if pattern in source:
                  source = source.replace(
                      pattern,
                      replacement,
                      1
                  )
                  matched = pattern
                  break

          if matched is None:
              print("ERROR: Exact WorkerAdapter callback was not found.")

              worker_pos = source.find("adapter.run")

              if worker_pos < 0:
                  worker_pos = source.find("workerAdapter.run")

              if worker_pos < 0:
                  print("ERROR: WorkerAdapter run call was not found either.")
              else:
                  print("")
                  print("Relevant MainActivity source:")
                  print(
                      source[
                          max(0, worker_pos - 500):
                          min(len(source), worker_pos + 3000)
                      ]
                  )

              sys.exit(1)

          source = source.replace("res.ok", "ok")
          source = source.replace("res.text", "text")
          source = source.replace("res.detail", "detail")

          path.write_text(source)

          check = path.read_text()

          if "ok, text, detail ->" not in check:
              print("ERROR: Correct worker callback was not installed.")
              sys.exit(1)

          if "res.ok" in check:
              print("ERROR: res.ok still exists.")
              sys.exit(1)

          if "res.text" in check:
              print("ERROR: res.text still exists.")
              sys.exit(1)

          if "res.detail" in check:
              print("ERROR: res.detail still exists.")
              sys.exit(1)

          print("==============================================")
          print("MAIN ACTIVITY CALLBACK REPAIRED")
          print("==============================================")
          print(f"Matched pattern: {matched}")
          print("Callback: ok, text, detail")

          PY

      - name: Verify MainActivity repair
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "=============================================="
          echo "VERIFYING MAIN ACTIVITY"
          echo "=============================================="

          grep -n -C 8 "adapter.run" "$FILE" || true

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()

          worker_pos = source.find("adapter.run")

          if worker_pos < 0:
              worker_pos = source.find("workerAdapter.run")

          if worker_pos < 0:
              print("ERROR: WorkerAdapter run call was not found.")
              sys.exit(1)

          callback_pos = source.find(
              "ok, text, detail ->",
              worker_pos
          )

          if callback_pos < 0:
              print("ERROR: Correct worker callback was not found.")
              sys.exit(1)

          if "res.ok" in source:
              print("ERROR: res.ok remains.")
              sys.exit(1)

          if "res.text" in source:
              print("ERROR: res.text remains.")
              sys.exit(1)

          if "res.detail" in source:
              print("ERROR: res.detail remains.")
              sys.exit(1)

          print("MainActivity callback repair VERIFIED.")

          PY

      - name: Wire live Claude worker
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"
          MANIFEST="$HABITAT_PROJECT_DIR/app/src/main/AndroidManifest.xml"

          python3 - "$CORE/WorkerAdapter.kt" "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          worker_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])

          worker = r'''package com.habitat.core

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import java.util.concurrent.Future

          class WorkerAdapter(
              private val context: Context
          ) {

              private val registry = WorkerRegistry(context)
              private val executor = Executors.newCachedThreadPool()

              fun listWorkers(): List<Any> {
                  return try {
                      registry.toString()
                      emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun run(
                  worker: Worker,
                  task: String,
                  callback: (Boolean, String, String) -> Unit
              ): Future<*> {
                  return executor.submit {
                      try {
                          val url = URL("https://habitat-1-szzd.onrender.com/worker/claude")
                          val connection = url.openConnection() as HttpURLConnection
                          connection.requestMethod = "POST"
                          connection.connectTimeout = 15000
                          connection.readTimeout = 120000
                          connection.doOutput = true
                          connection.setRequestProperty("Content-Type", "application/json")

                          val payload = JSONObject().apply {
                              put("worker", worker.id)
                              put("task", task)
                          }.toString()

                          connection.outputStream.use { output ->
                              output.write(payload.toByteArray(Charsets.UTF_8))
                          }

                          val code = connection.responseCode
                          val stream = if (code in 200..299) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                          val body = stream?.bufferedReader()?.use { it.readText() } ?: ""
                          connection.disconnect()

                          val json = try { JSONObject(body) } catch (_: Exception) {
                              JSONObject()
                          }

                          if (code in 200..299 && json.optBoolean("ok", false)) {
                              val report = json.optString("response", "Claude returned an empty report.")
                              callback(true, report, "Claude worker completed the delegated mission.")
                          } else {
                              val error = json.optString("error", "Claude worker request failed.")
                              val detail = json.optString("details", "HTTP $code")
                              callback(false, error, detail)
                          }
                      } catch (e: Exception) {
                          callback(false, "Claude worker connection failed.", e.message ?: "Unknown worker error")
                      }
                  }
              }

              fun shutdown() {
                  executor.shutdownNow()
              }
          }
          '''

          worker_path.write_text(worker)

          manifest = manifest_path.read_text()
          if "android.permission.INTERNET" not in manifest:
              marker = "<manifest"
              start = manifest.find(marker)
              close = manifest.find(">", start)
              if start < 0 or close < 0:
                  print("ERROR: AndroidManifest.xml manifest tag not found.")
                  sys.exit(1)
              manifest = manifest[:close+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + manifest[close+1:]
              manifest_path.write_text(manifest)

          print("Live Claude worker wired.")
          PY

          grep -q 'https://habitat-1-szzd.onrender.com/worker/claude' "$CORE/WorkerAdapter.kt"
          grep -q 'android.permission.INTERNET' "$MANIFEST"

          echo "Claude worker endpoint: /worker/claude"

      - name: Verify repaired WorkerAdapter
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          grep -q "class WorkerAdapter" \
            "$CORE/WorkerAdapter.kt"

          grep -q "fun run" \
            "$CORE/WorkerAdapter.kt"

          grep -q "worker: Worker" \
            "$CORE/WorkerAdapter.kt"

          grep -q "task: String" \
            "$CORE/WorkerAdapter.kt"

          grep -q "(Boolean, String, String)" \
            "$CORE/WorkerAdapter.kt"

          grep -q "Executors.newCachedThreadPool" \
            "$CORE/WorkerAdapter.kt"

          echo "WorkerAdapter repair verified."

      - name: Repair Habitat v0.3.3 hologram and navigation UI
        shell: bash
        run: |
          set -e
          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"
          python3 - "$CORE/MainActivity.kt" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          NL=chr(10)
          if "import android.view.WindowInsets" not in s:
              s=s.replace("import android.view.View"+NL,"import android.view.View"+NL+"import android.view.WindowInsets"+NL)
          s=s.replace("override fun onCreate(b:Bundle?){super.onCreate(b);home()}", "override fun onCreate(b:Bundle?){" + NL + "  super.onCreate(b)" + NL + "  window.navigationBarColor=bg" + NL + "  window.statusBarColor=bg" + NL + "  home()" + NL + "}")
          s=s.replace("root.setPadding(dp(12),dp(12),dp(12),dp(8));", "root.setPadding(dp(12),dp(12),dp(12),dp(8))" + NL + "  root.setOnApplyWindowInsetsListener { v, insets ->" + NL + "   val navBottom = if(android.os.Build.VERSION.SDK_INT >= 30) insets.getInsets(WindowInsets.Type.navigationBars()).bottom else insets.systemWindowInsetBottom" + NL + "   v.setPadding(dp(12),dp(12),dp(12),dp(8)+navBottom)" + NL + "   insets" + NL + "  }" + NL + "  root.requestApplyInsets();")
          s=s.replace("v0.3.2","v0.3.2")
          p.write_text(s)
          gradle=Path(sys.argv[1]).parents[5] / "app" / "build.gradle.kts"
          if gradle.exists():
              g=gradle.read_text().replace('versionCode = 5, versionName = "0.3.0"','versionCode = 8, versionName = "0.3.3"')
              gradle.write_text(g)
          PY
          cat > "$CORE/HologramView.kt" <<'KT'
          package com.habitat.core
          
          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*
          
          class HologramView(context: Context): View(context) {
              private val p=Paint(Paint.ANTI_ALIAS_FLAG)
              private val holo=Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val glow=Paint(Paint.ANTI_ALIAS_FLAG)
              private val starPaint=Paint(Paint.ANTI_ALIAS_FLAG)
              private var phase=0f
              private var yaw=0f
              private var targetYaw=0f
              private var touchDown=false
              private val audrey: Bitmap = BitmapFactory.decodeResource(resources,R.drawable.ax_portrait)
          
              init {
                  setLayerType(View.LAYER_TYPE_SOFTWARE,null)
                  isClickable=true
                  holo.alpha=145
                  holo.xfermode=PorterDuffXfermode(PorterDuff.Mode.SCREEN)
              }
          
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when(e.actionMasked){
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                          touchDown=true
                          targetYaw=((e.x/width.toFloat())-.5f)*1.5f
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          touchDown=false
                          targetYaw=0f
                          performClick()
                          return true
                      }
                  }
                  return true
              }
              override fun performClick(): Boolean { super.performClick(); return true }
          
              private fun galaxy(c:Canvas,w:Float,h:Float) {
                  val bg=LinearGradient(0f,0f,w,h,Color.rgb(2,3,16),Color.rgb(7,2,25),Shader.TileMode.CLAMP)
                  p.shader=bg; c.drawRect(0f,0f,w,h,p); p.shader=null
          
                  // Soft nebula clouds.
                  val neb=RadialGradient(w*.22f,h*.25f,w*.48f,
                      intArrayOf(Color.argb(75,75,25,180),Color.argb(20,25,70,160),Color.TRANSPARENT),
                      floatArrayOf(0f,.48f,1f),Shader.TileMode.CLAMP)
                  p.shader=neb; c.drawCircle(w*.22f,h*.25f,w*.48f,p); p.shader=null
                  val neb2=RadialGradient(w*.78f,h*.68f,w*.52f,
                      intArrayOf(Color.argb(55,15,100,190),Color.argb(15,90,20,170),Color.TRANSPARENT),
                      floatArrayOf(0f,.5f,1f),Shader.TileMode.CLAMP)
                  p.shader=neb2; c.drawCircle(w*.78f,h*.68f,w*.52f,p); p.shader=null
          
                  // Deep-space stars.
                  starPaint.style=Paint.Style.FILL
                  for(i in 0..95){
                      val x=(sin(i*91.7f+1.3f)*.5f+.5f)*w
                      val y=(sin(i*47.3f+4.2f)*.5f+.5f)*h
                      val tw=.55f+abs(sin(phase*.018f+i))*1.35f
                      starPaint.color=Color.argb((70+abs(sin(i*2.1f))*150).toInt(),180,215,255)
                      c.drawCircle(x,y,tw,starPaint)
                  }
              }
          
              private fun brain(c:Canvas,cx:Float,cy:Float,r:Float) {
                  c.save()
                  c.translate(cx,cy)
                  val spin=phase*.022f
                  c.rotate(sin(spin)*8f)
                  val sx=.72f+.28f*abs(cos(spin))
                  c.scale(sx,1f)
          
                  // Glowing brain silhouette made from two lobes.
                  glow.style=Paint.Style.STROKE
                  glow.strokeWidth=2.4f
                  glow.color=Color.argb(190,110,220,255)
                  glow.setShadowLayer(22f,0f,0f,Color.rgb(70,190,255))
                  val left=Path(); val right=Path()
                  left.moveTo(-8f,-r*.78f)
                  left.cubicTo(-r*.48f,-r*.92f,-r*.92f,-r*.38f,-r*.76f,.05f)
                  left.cubicTo(-r*.94f,r*.52f,-r*.42f,r*.78f,-8f,r*.68f)
                  right.moveTo(8f,-r*.78f)
                  right.cubicTo(r*.48f,-r*.92f,r*.92f,-r*.38f,r*.76f,.05f)
                  right.cubicTo(r*.94f,r*.52f,r*.42f,r*.78f,8f,r*.68f)
                  c.drawPath(left,glow); c.drawPath(right,glow)
                  glow.clearShadowLayer()
          
                  // Rotating neural network arcs.
                  p.style=Paint.Style.STROKE
                  p.strokeWidth=1.15f
                  p.color=Color.argb(125,125,235,255)
                  for(i in 0..12){
                      val yy=-r*.65f+i*r*.105f
                      val bend=sin(spin+i*.7f)*r*.12f
                      val path=Path()
                      path.moveTo(-r*.62f,yy)
                      path.cubicTo(-r*.28f,yy-bend,r*.28f,yy+bend,r*.62f,yy)
                      c.drawPath(path,p)
                  }
                  // Central corpus callosum.
                  p.color=Color.argb(170,170,245,255)
                  c.drawLine(0f,-r*.67f,0f,r*.62f,p)
          
                  // Neural nodes.
                  p.style=Paint.Style.FILL
                  for(i in 0..25){
                      val a=i*1.93f+spin
                      val rr=r*(.22f+(i%5)*.095f)
                      val x=cos(a)*rr
                      val y=sin(a)*rr*.82f
                      c.drawCircle(x,y,2f+abs(sin(phase*.04f+i))*1.4f,p)
                  }
                  c.restore()
              }
          
              private fun drawAudrey(c:Canvas,w:Float,h:Float) {
                  if(audrey.isRecycled) return
                  val src=Rect((audrey.width*.31f).toInt(),(audrey.height*.035f).toInt(),
                      (audrey.width*.99f).toInt(),(audrey.height*.875f).toInt())
                  val scale=minOf((w*.43f)/src.width(),(h*.55f)/src.height())
                  val dw=src.width()*scale
                  val dh=src.height()*scale
                  val cx=w*.50f
                  val top=h*.38f-dh*.42f
                  c.save()
                  c.scale(.76f+.24f*abs(cos(yaw)),1f,cx,h*.52f)
                  // No frame, box, oval or border: only the translucent character.
                  holo.alpha=35
                  c.drawBitmap(audrey,src,RectF(cx-dw/2f,top,cx+dw/2f,top+dh),holo)
                  holo.alpha=105
                  c.drawBitmap(audrey,src,RectF(cx-dw/2f+sin(phase*.05f)*2f,top,cx+dw/2f+sin(phase*.05f)*2f,top+dh),holo)
                  c.restore()
          
                  // Fine hologram scan breaks only over the character area.
                  p.style=Paint.Style.FILL
                  p.color=Color.argb(55,145,225,255)
                  for(i in 0..15){
                      val yy=top+i/15f*dh
                      c.drawRect(cx-dw*.49f,yy,cx+dw*.49f,yy+1f,p)
                  }
              }
          
              override fun onDraw(c:Canvas) {
                  super.onDraw(c)
                  val w=width.toFloat(); val h=height.toFloat()
                  galaxy(c,w,h)
          
                  yaw+=(targetYaw-yaw)*.10f
                  if(!touchDown) targetYaw*=.94f
          
                  // Central floating brain replaces the old blue projection cage.
                  brain(c,w*.50f,h*.29f,min(w,h)*.105f)
          
                  // Audrey is a ghostly companion below the brain, without any blue frame.
                  drawAudrey(c,w,h)
          
                  // Subtle orbit trails around the brain, not around Audrey.
                  p.style=Paint.Style.STROKE
                  p.strokeWidth=1.2f
                  p.color=Color.argb(70,100,205,255)
                  c.save(); c.rotate(phase*.45f,w*.5f,h*.29f)
                  c.drawOval(w*.34f,h*.17f,w*.66f,h*.41f,p)
                  c.restore()
          
                  p.style=Paint.Style.FILL
                  p.textAlign=Paint.Align.CENTER
                  p.textSize=12f
                  p.color=Color.argb(190,170,225,255)
                  c.drawText(if(touchDown) "AX • LINK ACTIVE" else "AX • NEURAL CORE ONLINE",w*.5f,h*.93f,p)
          
                  phase+=1f
                  postInvalidateDelayed(32)
              }
          }
          KT
      - name: FORCE PURE GALAXY UI — remove companion
        shell: bash
        run: |
          set -e
          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"
          RES="$HABITAT_PROJECT_DIR/app/src/main/res/drawable"
          rm -f "$CORE/HologramView.kt" "$RES/ax_portrait.png" "$RES/desk_scene.png"
          cat > "$CORE/MainActivity.kt" <<'KT'
package com.habitat.core

import android.app.Activity
import android.os.Bundle
import android.graphics.Color
import android.view.Window
import android.view.WindowManager

class MainActivity: Activity() {
  override fun onCreate(b: Bundle?) {
    super.onCreate(b)
    requestWindowFeature(Window.FEATURE_NO_TITLE)
    window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
    window.statusBarColor = Color.BLACK
    window.navigationBarColor = Color.BLACK
    setContentView(GalaxyHabitatView(this))
  }
}
KT
          cat > "$CORE/GalaxyHabitatView.kt" <<'KT'
package com.habitat.core

import android.content.Context
import android.graphics.*
import android.view.View
import kotlin.math.*
import kotlin.random.Random

class GalaxyHabitatView(c: Context): View(c) {
  private val p = Paint(Paint.ANTI_ALIAS_FLAG)
  private val tx = Paint(Paint.ANTI_ALIAS_FLAG)
  private val stars = ArrayList<FloatArray>()
  private var t = 0f

  init {
    setLayerType(View.LAYER_TYPE_SOFTWARE, null)
    repeat(520) { stars.add(floatArrayOf(Random.nextFloat(), Random.nextFloat(), Random.nextFloat())) }
  }

  override fun onDraw(c: Canvas) {
    val w=width.toFloat(); val h=height.toFloat(); val cx=w/2f; val cy=h*.47f
    p.shader=RadialGradient(cx,cy,max(w,h)*.9f,
      intArrayOf(Color.rgb(35,8,75),Color.rgb(5,12,34),Color.BLACK),floatArrayOf(0f,.42f,1f),Shader.TileMode.CLAMP)
    c.drawRect(0f,0f,w,h,p); p.shader=null
    drawMilkyWay(c,w,h,cx,cy)
    drawBrain(c,cx,cy,min(w,h)*.245f)
    tx.textAlign=Paint.Align.CENTER; tx.typeface=Typeface.DEFAULT_BOLD; tx.color=Color.WHITE; tx.textSize=28f
    c.drawText("HABITAT",cx,55f,tx)
    tx.typeface=Typeface.DEFAULT; tx.textSize=11f; tx.color=Color.rgb(120,215,255)
    c.drawText("AX  •  NEURAL CORE",cx,76f,tx)
    tx.textSize=10f; tx.color=Color.argb(180,175,210,240)
    c.drawText("A LIVING DIGITAL MIND",cx,h*.91f,tx)
    t+=.02f; postInvalidateDelayed(30)
  }

  private fun drawMilkyWay(c:Canvas,w:Float,h:Float,cx:Float,cy:Float) {
    for(i in stars.indices) {
      val s=stars[i]; val a=(s[0]*7f+t*.18f); val r=(s[1]-.5f)*max(w,h)*1.25f
      val x=cx+cos(a)*r; val y=cy+sin(a)*r*.36f
      p.color=Color.argb((45+s[2]*150).toInt(),170,205,255)
      c.drawCircle(x,y,.5f+s[2]*1.8f,p)
    }
    p.shader=RadialGradient(cx,cy,max(w,h)*.58f,
      intArrayOf(Color.argb(55,150,70,255),Color.argb(18,40,120,220),Color.TRANSPARENT),floatArrayOf(0f,.42f,1f),Shader.TileMode.CLAMP)
    c.drawOval(cx-max(w,h)*.62f,cy-h*.16f,cx+max(w,h)*.62f,cy+h*.16f,p); p.shader=null
  }

  private fun drawBrain(c:Canvas,cx:Float,cy:Float,r:Float) {
    val spin=t*.75f
    c.save(); c.rotate(sin(spin)*7f,cx,cy)
    p.style=Paint.Style.STROKE; p.strokeWidth=2.4f; p.color=Color.rgb(105,225,255)
    p.setShadowLayer(28f,0f,0f,Color.rgb(45,180,255))
    val left=Path(); val right=Path()
    left.moveTo(cx-6,cy-r*.78f); left.cubicTo(cx-r*.55f,cy-r,cx-r,cy-r*.42f,cx-r*.78f,cy)
    left.cubicTo(cx-r,cy+r*.48f,cx-r*.48f,cy+r*.82f,cx-6,cy+r*.68f)
    right.moveTo(cx+6,cy-r*.78f); right.cubicTo(cx+r*.55f,cy-r,cx+r,cy-r*.42f,cx+r*.78f,cy)
    right.cubicTo(cx+r,cy+r*.48f,cx+r*.48f,cy+r*.82f,cx+6,cy+r*.68f)
    c.drawPath(left,p); c.drawPath(right,p); p.clearShadowLayer()
    p.strokeWidth=1.1f; p.color=Color.argb(160,140,240,255)
    for(i in 0..14) {
      val yy=cy-r*.65f+i*r*.095f; val path=Path(); path.moveTo(cx-r*.62f,yy)
      path.cubicTo(cx-r*.25f,yy+sin(spin+i)*r*.12f,cx+r*.25f,yy-sin(spin+i)*r*.12f,cx+r*.62f,yy)
      c.drawPath(path,p)
    }
    c.drawLine(cx,cy-r*.68f,cx,cy+r*.64f,p)
    p.style=Paint.Style.FILL
    for(i in 0..34) {
      val a=i*1.83f+spin; val rr=r*(.18f+(i%7)*.09f)
      p.color=Color.argb(210,100+(i%70),205+(i%45),255)
      c.drawCircle(cx+cos(a)*rr,cy+sin(a)*rr*.82f,2f+(i%3),p)
    }
    p.style=Paint.Style.STROKE; p.strokeWidth=1f; p.color=Color.argb(110,100,220,255)
    c.drawOval(cx-r*1.18f,cy-r*.9f,cx+r*1.18f,cy+r*.9f,p)
    c.restore(); p.style=Paint.Style.FILL
  }
}
KT
          grep -q 'GalaxyHabitatView(this)' "$CORE/MainActivity.kt"
          test ! -f "$CORE/HologramView.kt"
          test ! -f "$RES/ax_portrait.png"
          test ! -f "$RES/desk_scene.png"

      - name: Pre-build Kotlin sanity check
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "KOTLIN SOURCE SANITY CHECK"
          echo "=============================================="

          for file in \
            MainActivity.kt \
            BrainAdapter.kt \
            WorkerAdapter.kt \
            WorkerRegistry.kt \
            Models.kt \
            TaskStore.kt \
            HologramView.kt \
            HabitatWidget.kt
          do
            test -f "$CORE/$file"
            echo "OK: $file"
          done

          echo ""
          echo "Checking repaired worker callback..."

          python3 - "$CORE/MainActivity.kt" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()

          worker_pos = source.find("adapter.run")

          if worker_pos < 0:
              worker_pos = source.find("workerAdapter.run")

          if worker_pos < 0:
              print("ERROR: WorkerAdapter run call is missing.")
              sys.exit(1)

          callback_pos = source.find(
              "ok, text, detail ->",
              worker_pos
          )

          if callback_pos < 0:
              print("ERROR: Worker callback is missing.")
              sys.exit(1)

          print("Worker callback is structurally valid.")

          PY

      - name: Build Habitat v0.3.3
        working-directory: ${{ env.HABITAT_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING HABITAT v0.3.3"
          echo "=============================================="

          gradle --version

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          APK="$(
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "$APK"

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-v0.3.3-Ax-debug.apk

      - name: Create source archive
        shell: bash
        run: |
          set -e

          cd "$HABITAT_PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.3-Ax-source.zip" \
            .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.3-Ax-debug-apk
          path: artifact/Habitat-v0.3.3-Ax-debug.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.3-Ax-source
          path: artifact/Habitat-v0.3.3-Ax-source.zip
          if-no-files-found: error

      - name: Habitat v0.3.3 success
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       HABITAT v0.3.3 AX EDITION"
          echo "          BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.3.3-Ax-debug.apk
          echo ""
          echo "SOURCE:"
