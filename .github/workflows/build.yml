name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat Android project
        run: |
          unzip -o Habitat-Android-Project.zip
          echo "Habitat project extracted."
          find habitat-project/HabitatAndroid -maxdepth 5 -type f | sort

      - name: Configure Android project
        run: |
          cd habitat-project/HabitatAndroid

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Habitat"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          mkdir -p app/src/main/java/com/habitat
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.habitat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.habitat"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 505
                  versionName = "0.5.5"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="Habitat"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7C4DFF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/habitat/MainActivity.kt <<'EOF'
          package com.habitat

          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {

              private lateinit var chatScroll: ScrollView
              private lateinit var chatContainer: LinearLayout
              private lateinit var input: EditText
              private lateinit var sendButton: TextView

              private val executor = Executors.newSingleThreadExecutor()

              private val backendUrl =
                  "https://habitat-cr46.onrender.com/chat"

              private val bg = Color.rgb(7, 8, 14)
              private val panel = Color.rgb(14, 16, 26)
              private val panel2 = Color.rgb(20, 22, 35)

              private val textMain =
                  Color.rgb(240, 240, 248)

              private val textDim =
                  Color.rgb(145, 148, 165)

              private val accent =
                  Color.rgb(125, 92, 255)

              private val accent2 =
                  Color.rgb(65, 190, 255)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(
                      window,
                      false
                  )

                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.BLACK

                  buildInterface()
              }

              private fun dp(value: Int): Int {
                  return (
                      value *
                      resources.displayMetrics.density
                  ).toInt()
              }

              private fun rounded(
                  color: Int,
                  radius: Int
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius =
                          dp(radius).toFloat()
                  }
              }

              private fun buildInterface() {

                  val root = LinearLayout(this).apply {
                      orientation =
                          LinearLayout.VERTICAL

                      gravity =
                          Gravity.CENTER_HORIZONTAL

                      setBackgroundColor(bg)
                  }

                  ViewCompat.setOnApplyWindowInsetsListener(
                      root
                  ) { view, insets ->

                      val bars =
                          insets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                          )

                      view.setPadding(
                          dp(14),
                          bars.top + dp(8),
                          dp(14),
                          bars.bottom + dp(8)
                      )

                      insets
                  }

                  setContentView(root)

                  val header =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(8),
                              dp(4),
                              dp(8),
                              dp(10)
                          )
                      }

                  val title =
                      TextView(this).apply {

                          text = "HABITAT"
                          textSize = 22f

                          setTextColor(textMain)

                          typeface =
                              Typeface.DEFAULT_BOLD

                          letterSpacing = 0.12f
                      }

                  header.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          dp(46),
                          1f
                      )
                  )

                  val online =
                      TextView(this).apply {

                          text = "● ONLINE"
                          textSize = 12f

                          setTextColor(
                              Color.rgb(
                                  95,
                                  235,
                                  155
                              )
                          )

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              dp(12),
                              0,
                              dp(12),
                              0
                          )
                      }

                  header.addView(
                      online,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          dp(46)
                      )
                  )

                  root.addView(
                      header,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val hero =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              dp(10),
                              dp(10),
                              dp(10),
                              dp(10)
                          )

                          background =
                              rounded(
                                  panel,
                                  26
                              )
                      }

                  val avatar =
                      TextView(this).apply {

                          text = "◉"
                          textSize = 54f

                          gravity =
                              Gravity.CENTER

                          setTextColor(
                              accent2
                          )
                      }

                  hero.addView(
                      avatar,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(72)
                      )
                  )

                  val audrey =
                      TextView(this).apply {

                          text = "AUDREY"
                          textSize = 22f

                          gravity =
                              Gravity.CENTER

                          setTextColor(
                              textMain
                          )

                          typeface =
                              Typeface.DEFAULT_BOLD

                          letterSpacing = 0.16f
                      }

                  hero.addView(
                      audrey,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(38)
                      )
                  )

                  val intelligence =
                      TextView(this).apply {

                          text =
                              "HABITAT INTELLIGENCE"

                          textSize = 10f

                          gravity =
                              Gravity.CENTER

                          setTextColor(
                              textDim
                          )

                          letterSpacing = 0.18f
                      }

                  hero.addView(
                      intelligence,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(24)
                      )
                  )

                  root.addView(
                      hero,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(148)
                      ).apply {
                          bottomMargin = dp(10)
                      }
                  )

                  chatScroll =
                      ScrollView(this).apply {

                          isFillViewport = true

                          clipToPadding = false

                          setBackgroundColor(
                              Color.TRANSPARENT
                          )
                      }

                  chatContainer =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.BOTTOM

                          setPadding(
                              dp(2),
                              dp(4),
                              dp(2),
                              dp(8)
                          )
                      }

                  chatScroll.addView(
                      chatContainer,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      chatScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  addMessage(
                      "Audrey",
                      "Habitat is online. Ask me anything.",
                      false
                  )

                  val inputPanel =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          gravity =
                              Gravity.CENTER_VERTICAL

                          setPadding(
                              dp(8),
                              dp(8),
                              dp(8),
                              dp(8)
                          )

                          background =
                              rounded(
                                  panel2,
                                  22
                              )
                      }

                  input =
                      EditText(this).apply {

                          hint =
                              "Talk to Audrey..."

                          setHintTextColor(
                              textDim
                          )

                          setTextColor(
                              textMain
                          )

                          textSize = 16f

                          setSingleLine(true)

                          inputType =
                              InputType.TYPE_CLASS_TEXT or
                              InputType.TYPE_TEXT_FLAG_CAP_SENTENCES

                          setPadding(
                              dp(14),
                              0,
                              dp(14),
                              0
                          )

                          background =
                              rounded(
                                  bg,
                                  16
                              )

                          imeOptions =
                              android.view.inputmethod
                                  .EditorInfo
                                  .IME_ACTION_SEND
                      }

                  input.setOnEditorActionListener {
                      _, _, _ ->

                      sendMessage()

                      true
                  }

                  inputPanel.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          dp(54),
                          1f
                      ).apply {
                          rightMargin = dp(8)
                      }
                  )

                  sendButton =
                      TextView(this).apply {

                          text = "SEND"
                          textSize = 12f

                          gravity =
                              Gravity.CENTER

                          setTextColor(
                              Color.WHITE
                          )

                          typeface =
                              Typeface.DEFAULT_BOLD

                          background =
                              rounded(
                                  accent,
                                  16
                              )

                          setPadding(
                              dp(16),
                              0,
                              dp(16),
                              0
                          )

                          setOnClickListener {
                              sendMessage()
                          }
                      }

                  inputPanel.addView(
                      sendButton,
                      LinearLayout.LayoutParams(
                          dp(82),
                          dp(54)
                      )
                  )

                  root.addView(
                      inputPanel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(70)
                      ).apply {
                          topMargin = dp(6)
                      }
                  )
              }

              private fun addMessage(
                  name: String,
                  message: String,
                  fromUser: Boolean
              ) {

                  val row =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              if (fromUser)
                                  Gravity.END
                              else
                                  Gravity.START

                          setPadding(
                              dp(4),
                              dp(5),
                              dp(4),
                              dp(5)
                          )
                      }

                  val label =
                      TextView(this).apply {

                          text = name
                          textSize = 10f

                          setTextColor(
                              if (fromUser)
                                  accent
                              else
                                  accent2
                          )

                          setPadding(
                              dp(6),
                              0,
                              dp(6),
                              dp(3)
                          )
                      }

                  row.addView(
                      label,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val bubble =
                      TextView(this).apply {

                          text = message
                          textSize = 15f

                          setTextColor(
                              textMain
                          )

                          setPadding(
                              dp(14),
                              dp(10),
                              dp(14),
                              dp(10)
                          )

                          background =
                              rounded(
                                  if (fromUser)
                                      Color.rgb(
                                          43,
                                          34,
                                          74
                                      )
                                  else
                                      panel,
                                  18
                              )

                          setMaxWidth(
                              dp(310)
                          )
                      }

                  row.addView(
                      bubble,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  chatContainer.addView(row)

                  chatScroll.post {
                      chatScroll.fullScroll(
                          View.FOCUS_DOWN
                      )
                  }
              }

              private fun sendMessage() {

                  val message =
                      input.text.toString().trim()

                  if (message.isEmpty()) {
                      return
                  }

                  input.setText("")

                  addMessage(
                      "You",
                      message,
                      true
                  )

                  sendButton.isEnabled = false
                  sendButton.alpha = 0.5f

                  addMessage(
                      "Audrey",
                      "Thinking...",
                      false
                  )

                  executor.execute {

                      val response =
                          callBackend(message)

                      runOnUiThread {

                          if (
                              chatContainer.childCount > 0
                          ) {
                              chatContainer.removeViewAt(
                                  chatContainer.childCount - 1
                              )
                          }

                          addMessage(
                              "Audrey",
                              response,
                              false
                          )

                          sendButton.isEnabled =
                              true

                          sendButton.alpha = 1f
                      }
                  }
              }

              private fun callBackend(
                  message: String
              ): String {

                  return try {

                      val url =
                          URL(backendUrl)

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod =
                          "POST"

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.connectTimeout =
                          30000

                      connection.readTimeout =
                          60000

                      connection.doOutput = true

                      val body =
                          JSONObject()
                              .put(
                                  "message",
                                  message
                              )
                              .toString()

                      connection.outputStream.use {
                          output ->

                          output.write(
                              body.toByteArray(
                                  Charsets.UTF_8
                              )
                          )
                      }

                      val stream =
                          if (
                              connection.responseCode
                              in 200..299
                          ) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                      val response =
                          stream.bufferedReader()
                              .use {
                                  it.readText()
                              }

                      try {

                          val json =
                              JSONObject(response)

                          when {

                              json.has("reply") ->
                                  json.getString(
                                      "reply"
                                  )

                              json.has("output") ->
                                  json.getString(
                                      "output"
                                  )

                              json.has("message") ->
                                  json.getString(
                                      "message"
                                  )

                              json.has("text") ->
                                  json.getString(
                                      "text"
                                  )

                              else ->
                                  response
                          }

                      } catch (_: Exception) {
                          response
                      }

                  } catch (_: Exception) {

                      "I couldn't reach the Habitat brain right now. Check the connection and try again."
                  }
              }

              override fun onDestroy() {
                  executor.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: |
          cd habitat-project/HabitatAndroid
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk \
             output/Habitat-Audrey-v0.5.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-v0.5.5
          path: output/Habitat-Audrey-v0.5.5.apk
