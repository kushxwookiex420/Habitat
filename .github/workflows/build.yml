name: Habitat Audrey Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Habitat project
        run: |
          rm -rf habitat-project
          mkdir -p habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

      - name: Configure project
        run: |
          PROJECT_DIR="habitat-project/HabitatAndroid"
          APP_DIR="$PROJECT_DIR/app"
          MAIN_DIR="$APP_DIR/src/main"
          MAIN="$MAIN_DIR/java/com/habitat/core/MainActivity.kt"
          RES_DIR="$MAIN_DIR/res"

          mkdir -p "$RES_DIR/drawable-nodpi"

          if [ -f "lucia.png" ]; then
            cp lucia.png "$RES_DIR/drawable-nodpi/lucia.png"
          fi

          cat > "$APP_DIR/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:label="Habitat">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p "$(dirname "$MAIN")"

          cat > "$MAIN" <<'EOF'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.inputmethod.EditorInfo
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var chat: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.decorView.systemUiVisibility =
                      5894

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  val image = ImageView(this)
                  image.setImageResource(R.drawable.lucia)
                  image.scaleType = ImageView.ScaleType.CENTER_CROP
                  root.addView(
                      image,
                      FrameLayout.LayoutParams(-1, -1)
                  )

                  val panel = LinearLayout(this)
                  panel.orientation = LinearLayout.VERTICAL
                  panel.setPadding(32, 32, 32, 24)
                  panel.gravity = Gravity.BOTTOM

                  chat = TextView(this)
                  chat.text = "AUDREY\n\nHabitat online."
                  chat.setTextColor(Color.WHITE)
                  chat.textSize = 18f
                  chat.setPadding(20, 20, 20, 20)

                  input = EditText(this)
                  input.hint = "Talk to Audrey..."
                  input.setTextColor(Color.WHITE)
                  input.setHintTextColor(Color.LTGRAY)
                  input.singleLine = true
                  input.imeOptions = EditorInfo.IME_ACTION_SEND

                  input.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEND) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }

                  panel.addView(chat)
                  panel.addView(
                      input,
                      LinearLayout.LayoutParams(
                          -1,
                          60
                      )
                  )

                  root.addView(
                      panel,
                      FrameLayout.LayoutParams(
                          -1,
                          -2,
                          Gravity.BOTTOM
                      )
                  )

                  setContentView(root)
              }

              private fun sendMessage() {
                  val message = input.text.toString().trim()
                  if (message.isEmpty()) return

                  chat.text =
                      "YOU: $message\n\nAUDREY: I'm here. Habitat received your message."

                  input.text.clear()
              }
          }
          EOF

          if [ -f "$APP_DIR/build.gradle" ]; then
            sed -i "s/versionName.*/versionName \"0.5.0\"/" "$APP_DIR/build.gradle" || true
          fi

      - name: Build APK
        run: |
          cd habitat-project/HabitatAndroid
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-0.5.0
          path: habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk
