name: Habitat v0.3.0 Ax Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.3.0 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # ============================================================
      # ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager could not be located."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # ============================================================
      # EXTRACT THE REAL v0.3.0 PROJECT
      # ============================================================

      - name: Extract Habitat v0.3.0 project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Habitat-Android-v0.3.0-Ax-Edition.zip"

          test -f "$ZIP"

          rm -rf HabitatBuild
          mkdir -p HabitatBuild

          unzip -q "$ZIP" -d HabitatBuild

          PROJECT_DIR="$(
            find HabitatBuild \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: v0.3.0 Gradle project was not found."
            find HabitatBuild -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "HABITAT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY v0.3.0 PROJECT
      # ============================================================

      - name: Verify Habitat v0.3.0 source
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          echo "=============================================="
          echo "HABITAT v0.3.0 SOURCE VERIFICATION"
          echo "=============================================="

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT/app/src/main/java/com/habitat/core/MainActivity.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/BrainAdapter.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/WorkerAdapter.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/WorkerRegistry.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/Models.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/TaskStore.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/HologramView.kt"
          test -f "$PROJECT/app/src/main/java/com/habitat/core/HabitatWidget.kt"

          echo ""
          echo "Core v0.3.0 files verified:"
          find "$PROJECT/app/src/main/java/com/habitat/core" \
            -type f \
            -maxdepth 1 \
            | sort

          echo ""
          echo "Checking v0.3.0 architecture..."

          grep -R "WorkerAdapter" \
            "$PROJECT/app/src/main/java/com/habitat/core"

          grep -R "WorkerRegistry" \
            "$PROJECT/app/src/main/java/com/habitat/core"

          grep -R "TaskStore" \
            "$PROJECT/app/src/main/java/com/habitat/core"

          grep -R "HologramView" \
            "$PROJECT/app/src/main/java/com/habitat/core"

          echo ""
          echo "=============================================="
          echo "v0.3.0 SOURCE VERIFICATION PASSED"
          echo "=============================================="

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Habitat v0.3.0
        working-directory: ${{ env.HABITAT_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING HABITAT v0.3.0"
          echo "=============================================="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          APK="$(
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Habitat v0.3.0 APK was not produced."

            find "$PROJECT/app/build" \
              -type f 2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "=============================================="
          echo "HABITAT v0.3.0 APK FOUND"
          echo "=============================================="

          echo "$APK"

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-v0.3.0-Ax-debug.apk

      # ============================================================
      # SOURCE ARCHIVE
      # ============================================================

      - name: Create v0.3.0 source archive
        shell: bash
        run: |
          set -e

          cd "$HABITAT_PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.0-Ax-source.zip" \
            .

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Habitat v0.3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-debug-apk
          path: artifact/Habitat-v0.3.0-Ax-debug.apk
          if-no-files-found: error

      # ============================================================
      # UPLOAD SOURCE
      # ============================================================

      - name: Upload Habitat v0.3.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-source
          path: artifact/Habitat-v0.3.0-Ax-source.zip
          if-no-files-found: error

      # ============================================================
      # SUCCESS REPORT
      # ============================================================

      - name: Habitat v0.3.0 success report
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "          HABITAT v0.3.0 AX EDITION"
          echo "             BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "REAL v0.3.0 PROJECT:"
          echo "$HABITAT_PROJECT_DIR"
          echo ""
          echo "ARCHITECTURE:"
          echo "Ax / Habitat Orchestrator"
          echo "WorkerAdapter"
          echo "WorkerRegistry"
          echo "TaskStore"
          echo "HologramView"
          echo "HabitatWidget"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.3.0-Ax-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-v0.3.0-Ax-source.zip
          echo ""
          echo "================================================"
