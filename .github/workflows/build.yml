name: Habitat Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle.kts"
            exit 1
          fi

          echo "Found Android project at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin source
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found:"
            echo "$MAIN_FILE"
            exit 1
          fi

          echo "Fixing MainActivity.kt..."

          sed -i 's/\bnow\b/now()/g' "$MAIN_FILE"

          echo "MainActivity.kt fix applied."

      - name: Configure Android project
        run: |
          cd "$PROJECT_DIR"

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building Habitat..."
          echo "Project directory: $PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
