      - name: Remove old portrait references
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.kt" -o -name "*.xml" \) \
            -print0 \
            | xargs -0 -r sed -i \
              -e '/ax_portrait/d' \
              -e '/desk_scene/d' \
              -e '/Audrey/d'

      # ==========================================================
      # INTERNET PERMISSION
      # ==========================================================

      - name: Ensure internet permission
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" \
            -type f \
            -name "AndroidManifest.xml" \
            | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then

            sed -i \
              's#<manifest#<manifest\n    <uses-permission android:name="android.permission.INTERNET" />#' \
              "$MANIFEST"

          fi

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      # ==========================================================
      # FIND APK
      # ==========================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -Ei "debug" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-1.0-Ax-Core-debug.apk

          echo "APK created:"
          ls -lh artifact/Habitat-1.0-Ax-Core-debug.apk

      # ==========================================================
      # PACKAGE SOURCE
      # ==========================================================

      - name: Package modified source
        shell: bash
        run: |
          set -e

          mkdir -p artifact/source

          cp -R "$PROJECT_DIR"/. \
            artifact/source/

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-1.0-Ax-Core-debug-apk
          path: artifact/Habitat-1.0-Ax-Core-debug.apk
          if-no-files-found: error

