            )

            addView(
                text(
                    subtitle,
                    12f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(3)
                }
            )
        }
    }

    private fun card(
        title: String,
        value: String,
        description: String
    ): LinearLayout {

        return LinearLayout(this).apply {

            orientation = LinearLayout.VERTICAL

            background = rounded(panel)

            setPadding(
                dp(14),
                dp(13),
                dp(14),
                dp(13)
            )

            addView(
                LinearLayout(this@MainActivity).apply {

                    orientation = LinearLayout.HORIZONTAL

                    addView(
                        text(
                            title,
                            15f,
                            white,
                            true
                        ),
                        LinearLayout.LayoutParams(
                            0,
                            -2,
                            1f
                        )
                    )

                    addView(
                        text(
                            value,
                            15f,
                            accent,
                            true
                        )
                    )
                }
            )

            addView(
                text(
                    description,
                    11f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                }
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    dp(78)
                ).apply {
                    bottomMargin = dp(8)
                }
        }
    }

