name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Habitat Android project
        shell: bash
        run: |
          rm -rf habitat-project
          mkdir -p habitat-project/HabitatAndroid/app/src/main/java/com/habitat
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/drawable
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/mipmap-hdpi
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/mipmap-mdpi
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/mipmap-xhdpi
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/mipmap-xxhdpi
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/mipmap-xxxhdpi

          cat > habitat-project/HabitatAndroid/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Habitat"
          include(":app")
          EOF

          cat > habitat-project/HabitatAndroid/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              kotlin("android") version "2.0.21" apply false
          }
          EOF

          cat > habitat-project/HabitatAndroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > habitat-project/HabitatAndroid/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              kotlin("android")
          }

          android {
              namespace = "com.habitat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.habitat"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 503
                  versionName = "0.5.3"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="Habitat"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/values

          cat > habitat-project/HabitatAndroid/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#00E5FF</item>
                  <item name="android:navigationBarColor">#02040A</item>
                  <item name="android:statusBarColor">#02040A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

      - name: Create Habitat MainActivity
        shell: bash
        run: |
          cat > habitat-project/HabitatAndroid/app/src/main/java/com/habitat/MainActivity.kt <<'EOF'
          package com.habitat

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.view.*
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import java.net.HttpURLConnection
          import java.net.URL
          import org.json.JSONObject
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private val BACKEND_URL =
                  "https://habitat-cr46.onrender.com/chat"

              private lateinit var chatBox: TextView
              private lateinit var input: EditText
              private lateinit var sendButton: Button
              private lateinit var statusText: TextView
              private lateinit var scroll: ScrollView

              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.setSoftInputMode(
                      WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  )

                  buildInterface()
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              private fun rounded(
                  color: Int,
                  radius: Float,
                  strokeColor: Int? = null,
                  strokeWidth: Int = 0
              ): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radius.toInt()).toFloat()

                  if (strokeColor != null && strokeWidth > 0) {
                      d.setStroke(dp(strokeWidth), strokeColor)
                  }

                  return d
              }

              private fun buildInterface() {

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.rgb(2, 5, 12))

                  val commandCenter = CommandCenterView(this)
                  root.addView(
                      commandCenter,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  /*
                   * MAIN HUD
                   */

                  val hud = LinearLayout(this)
                  hud.orientation = LinearLayout.VERTICAL
                  hud.setPadding(dp(18), dp(24), dp(18), dp(12))

                  val hudParams = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  )

                  root.addView(hud, hudParams)

                  /*
                   * TOP BAR
                   */

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL

                  val title = TextView(this)
                  title.text = "HABITAT"
                  title.textSize = 25f
                  title.setTextColor(Color.WHITE)
                  title.typeface = Typeface.DEFAULT_BOLD

                  top.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  statusText = TextView(this)
                  statusText.text = "● SYSTEM ONLINE"
                  statusText.textSize = 11f
                  statusText.setTextColor(Color.rgb(70, 255, 180))

                  top.addView(statusText)

                  hud.addView(top)

                  val subtitle = TextView(this)
                  subtitle.text = "PERSONAL AI OPERATING ENVIRONMENT"
                  subtitle.textSize = 10f
                  subtitle.setTextColor(Color.rgb(100, 160, 190))
                  subtitle.setPadding(0, dp(2), 0, dp(8))

                  hud.addView(subtitle)

                  /*
                   * AUDREY STATUS
                   */

                  val audreyStatus = TextView(this)
                  audreyStatus.text =
                      "AUDREY  //  INTELLIGENCE CORE  //  READY"
                  audreyStatus.textSize = 11f
                  audreyStatus.setTextColor(Color.rgb(0, 229, 255))
                  audreyStatus.setPadding(dp(12), dp(9), dp(12), dp(9))
                  audreyStatus.background =
                      rounded(
                          Color.argb(150, 5, 20, 32),
                          12f,
                          Color.rgb(0, 100, 130),
                          1
                      )

                  hud.addView(audreyStatus)

                  /*
                   * CHAT AREA
                   */

                  scroll = ScrollView(this)
                  scroll.isFillViewport = true
                  scroll.setPadding(0, dp(10), 0, dp(5))

                  chatBox = TextView(this)
                  chatBox.text =
                      "AUDREY:\n\nI'm online.\n\nHabitat systems are standing by.\n\nType below and talk to me."
                  chatBox.textSize = 15f
                  chatBox.setTextColor(Color.WHITE)
                  chatBox.setPadding(dp(15), dp(15), dp(15), dp(15))
                  chatBox.gravity = Gravity.TOP
                  chatBox.setLineSpacing(0f, 1.15f)
                  chatBox.background =
                      rounded(
                          Color.argb(170, 3, 8, 17),
                          16f,
                          Color.rgb(0, 65, 90),
                          1
                      )

                  scroll.addView(
                      chatBox,
                      ScrollView.LayoutParams(
                          ScrollView.LayoutParams.MATCH_PARENT,
                          ScrollView.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val chatParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1f
                  )

                  chatParams.setMargins(0, dp(8), 0, dp(8))
                  hud.addView(scroll, chatParams)

                  /*
                   * INPUT PANEL
                   */

                  val inputPanel = LinearLayout(this)
                  inputPanel.orientation = LinearLayout.VERTICAL
                  inputPanel.setPadding(dp(10), dp(10), dp(10), dp(10))
                  inputPanel.background =
                      rounded(
                          Color.argb(235, 4, 12, 22),
                          18f,
                          Color.rgb(0, 120, 150),
                          1
                      )

                  val prompt = TextView(this)
                  prompt.text = "▸ TALK TO AUDREY"
                  prompt.textSize = 10f
                  prompt.typeface = Typeface.DEFAULT_BOLD
                  prompt.setTextColor(Color.rgb(0, 229, 255))
                  prompt.setPadding(dp(4), 0, 0, dp(6))

                  inputPanel.addView(prompt)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL

                  input = EditText(this)

                  input.hint = "Type a message..."
                  input.setHintTextColor(Color.rgb(115, 135, 150))
                  input.setTextColor(Color.WHITE)
                  input.textSize = 16f

                  input.setSingleLine(true)
                  input.imeOptions = EditorInfo.IME_ACTION_SEND
                  input.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES or
                      android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE

                  input.isFocusable = true
                  input.isFocusableInTouchMode = true

                  input.setPadding(
                      dp(14),
                      dp(8),
                      dp(14),
                      dp(8)
                  )

                  input.background =
                      rounded(
                          Color.rgb(9, 20, 31),
                          12f,
                          Color.rgb(0, 105, 135),
                          1
                      )

                  val inputParams = LinearLayout.LayoutParams(
                      0,
                      dp(56),
                      1f
                  )

                  row.addView(input, inputParams)

                  sendButton = Button(this)
                  sendButton.text = "SEND"
                  sendButton.textSize = 12f
                  sendButton.setTextColor(Color.WHITE)
                  sendButton.typeface = Typeface.DEFAULT_BOLD
                  sendButton.isAllCaps = false
                  sendButton.background =
                      rounded(
                          Color.rgb(0, 110, 145),
                          12f,
                          Color.rgb(0, 229, 255),
                          1
                      )

                  val sendParams = LinearLayout.LayoutParams(
                      dp(82),
                      dp(56)
                  )

                  sendParams.setMargins(dp(8), 0, 0, 0)

                  row.addView(sendButton, sendParams)

                  inputPanel.addView(row)

                  val hint = TextView(this)
                  hint.text =
                      "ENTER = SEND   •   Your conversation stays in Habitat memory"
                  hint.textSize = 9f
                  hint.setTextColor(Color.rgb(90, 115, 130))
                  hint.setPadding(dp(4), dp(6), dp(4), 0)

                  inputPanel.addView(hint)

                  hud.addView(
                      inputPanel,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  /*
                   * EVENTS
                   */

                  sendButton.setOnClickListener {
                      sendMessage()
                  }

                  input.setOnEditorActionListener { _, actionId, event ->

                      val enter =
                          event?.keyCode == KeyEvent.KEYCODE_ENTER &&
                          event.action == KeyEvent.ACTION_DOWN

                      if (
                          actionId == EditorInfo.IME_ACTION_SEND ||
                          enter
                      ) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }

                  input.setOnKeyListener { _, keyCode, event ->

                      if (
                          keyCode == KeyEvent.KEYCODE_ENTER &&
                          event.action == KeyEvent.ACTION_DOWN
                      ) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }

                  setContentView(root)

                  /*
                   * Make the typing box immediately obvious.
                   */
                  input.requestFocus()

                  handler.postDelayed({
                      input.clearFocus()
                  }, 300)

                  /*
                   * Keep keyboard interaction available when user taps the box.
                   */
                  input.setOnClickListener {
                      input.requestFocus()
                  }
              }

              private fun sendMessage() {

                  val message = input.text.toString().trim()

                  if (message.isEmpty()) {
                      return
                  }

                  input.text.clear()
                  sendButton.isEnabled = false
                  sendButton.alpha = 0.55f

                  chatBox.append(
                      "\n\nYOU:\n$message\n\nAUDREY:\nThinking..."
                  )

                  scroll.post {
                      scroll.fullScroll(View.FOCUS_DOWN)
                  }

                  thread {

                      try {

                          val connection =
                              URL(BACKEND_URL).openConnection()
                                  as HttpURLConnection

                          connection.requestMethod = "POST"
                          connection.connectTimeout = 15000
                          connection.readTimeout = 30000
                          connection.doOutput = true

                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          )

                          connection.setRequestProperty(
                              "Accept",
                              "application/json"
                          )

                          val payload = JSONObject()

                          payload.put(
                              "message",
                              message
                          )

                          val history = JSONObject()

                          history.put(
                              "source",
                              "Habitat Android"
                          )

                          history.put(
                              "session",
                              "local"
                          )

                          payload.put(
                              "history",
                              history
                          )

                          connection.outputStream.use {
                              it.write(
                                  payload.toString()
                                      .toByteArray(Charsets.UTF_8)
                              )
                          }

                          val code = connection.responseCode

                          val stream =
                              if (code in 200..299)
                                  connection.inputStream
                              else
                                  connection.errorStream

                          val responseText =
                              stream?.bufferedReader()?.use {
                                  it.readText()
                              } ?: ""

                          connection.disconnect()

                          handler.post {

                              sendButton.isEnabled = true
                              sendButton.alpha = 1f

                              if (code in 200..299) {

                                  try {

                                      val json =
                                          JSONObject(responseText)

                                      val response =
                                          json.optString(
                                              "response",
                                              responseText
                                          )

                                      replaceThinking(response)

                                      statusText.text =
                                          "● AUDREY ONLINE"

                                  } catch (e: Exception) {

                                      replaceThinking(
                                          responseText.ifBlank {
                                              "Habitat received the message, but Audrey returned no text."
                                          }
                                      )
                                  }

                              } else {

                                  replaceThinking(
                                      "I reached the Habitat backend, but it returned HTTP $code.\n\n$responseText"
                                  )

                                  statusText.text =
                                      "● BACKEND ERROR"
                              }
                          }

                      } catch (e: Exception) {

                          handler.post {

                              sendButton.isEnabled = true
                              sendButton.alpha = 1f

                              replaceThinking(
                                  "Connection error:\n${e.message}\n\nHabitat itself is still running."
                              )

                              statusText.text =
                                  "● CONNECTION ERROR"
                          }
                      }
                  }
              }

              private fun replaceThinking(response: String) {

                  val current = chatBox.text.toString()

                  val index =
                      current.lastIndexOf(
                          "AUDREY:\nThinking..."
                      )

                  if (index >= 0) {

                      val updated =
                          current.substring(0, index) +
                          "AUDREY:\n" +
                          response

                      chatBox.text = updated

                  } else {

                      chatBox.append(
                          "\n\nAUDREY:\n$response"
                      )
                  }

                  scroll.post {
                      scroll.fullScroll(View.FOCUS_DOWN)
                  }
              }

              /*
               * Futuristic Habitat command-center background.
               */
              private class CommandCenterView(
                  context: android.content.Context
              ) : View(context) {

                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG)

                  init {

                      gridPaint.strokeWidth = 1f
                      paint.typeface =
                          Typeface.create(
                              Typeface.MONOSPACE,
                              Typeface.NORMAL
                          )
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)

                      val w = width.toFloat()
                      val h = height.toFloat()

                      /*
                       * Deep-space background
                       */
                      canvas.drawColor(
                          Color.rgb(1, 4, 10)
                      )

                      /*
                       * Subtle command-center glow.
                       */
                      val glow =
                          RadialGradient(
                              w * 0.72f,
                              h * 0.40f,
                              w * 0.75f,
                              intArrayOf(
                                  Color.rgb(5, 34, 50),
                                  Color.rgb(2, 13, 23),
                                  Color.rgb(1, 4, 10)
                              ),
                              null,
                              Shader.TileMode.CLAMP
                          )

                      paint.shader = glow

                      canvas.drawRect(
                          0f,
                          0f,
                          w,
                          h,
                          paint
                      )

                      paint.shader = null

                      /*
                       * Floor perspective.
                       */
                      gridPaint.color =
                          Color.argb(55, 0, 190, 230)

                      val horizon =
                          h * 0.70f

                      var y = horizon

                      while (y < h) {

                          canvas.drawLine(
                              0f,
                              y,
                              w,
                              y,
                              gridPaint
                          )

                          y += dp(34).toFloat()
                      }

                      var x = -w

                      while (x < w * 2) {

                          canvas.drawLine(
                              w / 2f,
                              horizon,
                              x,
                              h,
                              gridPaint
                          )

                          x += dp(65).toFloat()
                      }

                      /*
                       * Main holographic core behind Audrey.
                       */
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2f
                      paint.color =
                          Color.argb(90, 0, 220, 255)

                      canvas.drawCircle(
                          w * 0.70f,
                          h * 0.38f,
                          dp(145).toFloat(),
                          paint
                      )

                      canvas.drawCircle(
                          w * 0.70f,
                          h * 0.38f,
                          dp(115).toFloat(),
                          paint
                      )

                      canvas.drawCircle(
                          w * 0.70f,
                          h * 0.38f,
                          dp(75).toFloat(),
                          paint
                      )

                      paint.style = Paint.Style.FILL

                      /*
                       * Generic Audrey placeholder silhouette.
                       *
                       * If audrey.png is later added to the drawable
                       * directory, this area can be replaced by the
                       * actual Audrey artwork.
                       */
                      paint.color =
                          Color.argb(125, 20, 90, 115)

                      canvas.drawOval(
                          w * 0.58f,
                          h * 0.25f,
                          w * 0.82f,
                          h * 0.64f,
                          paint
                      )

                      paint.color =
                          Color.argb(190, 0, 229, 255)

                      canvas.drawCircle(
                          w * 0.70f,
                          h * 0.29f,
                          dp(43).toFloat(),
                          paint
                      )

                      paint.color =
                          Color.argb(225, 2, 8, 15)

                      canvas.drawCircle(
                          w * 0.70f,
                          h * 0.29f,
                          dp(39).toFloat(),
                          paint
                      )

                      /*
                       * Holographic desk.
                       */
                      paint.color =
                          Color.argb(160, 0, 110, 145)

                      canvas.drawRoundRect(
                          w * 0.43f,
                          h * 0.57f,
                          w * 0.96f,
                          h * 0.67f,
                          dp(15).toFloat(),
                          dp(15).toFloat(),
                          paint
                      )

                      paint.color =
                          Color.argb(210, 3, 16, 25)

                      canvas.drawRoundRect(
                          w * 0.45f,
                          h * 0.575f,
                          w * 0.94f,
                          h * 0.65f,
                          dp(12).toFloat(),
                          dp(12).toFloat(),
                          paint
                      )

                      /*
                       * Holographic screens.
                       */
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2f
                      paint.color =
                          Color.argb(120, 0, 220, 255)

                      canvas.drawRoundRect(
                          w * 0.38f,
                          h * 0.40f,
                          w * 0.55f,
                          h * 0.55f,
                          dp(10).toFloat(),
                          dp(10).toFloat(),
                          paint
                      )

                      canvas.drawRoundRect(
                          w * 0.84f,
                          h * 0.34f,
                          w * 0.98f,
                          h * 0.51f,
                          dp(10).toFloat(),
                          dp(10).toFloat(),
                          paint
                      )

                      paint.style = Paint.Style.FILL

                      /*
                       * HUD labels.
                       */
                      paint.color =
                          Color.argb(120, 0, 229, 255)

                      paint.textSize =
                          dp(10).toFloat()

                      canvas.drawText(
                          "AUDREY // CORE",
                          w * 0.60f,
                          h * 0.20f,
                          paint
                      )

                      canvas.drawText(
                          "MEMORY",
                          w * 0.41f,
                          h * 0.46f,
                          paint
                      )

                      canvas.drawText(
                          "SYSTEM",
                          w * 0.86f,
                          h * 0.40f,
                          paint
                      )
                  }

                  private fun dp(v: Int): Int {
                      return (v * resources.displayMetrics.density).toInt()
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: habitat-project/HabitatAndroid
        run: gradle assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p habitat-apk
          cp habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk \
             habitat-apk/Habitat-Audrey-v0.5.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-v0.5.3
          path: habitat-apk/Habitat-Audrey-v0.5.3.apk
