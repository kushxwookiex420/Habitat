name: Habitat 1.0 - Ax Core Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat Android
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "===== REPOSITORY ====="
          find . -maxdepth 3 -type f | sort
          echo "======================"

      - name: Find Habitat ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "./Habitat-Android-v0.2.2-Ax-Edition-2.zip" ]; then
            ZIP_FILE="./Habitat-Android-v0.2.2-Ax-Edition-2.zip"
          elif [ -f "./Habitat-Android-v0.2.2-Ax-Edition.zip" ]; then
            ZIP_FILE="./Habitat-Android-v0.2.2-Ax-Edition.zip"
          elif [ -f "./Habitat-Android-Project.zip" ]; then
            ZIP_FILE="./Habitat-Android-Project.zip"
          else
            ZIP_FILE="$(find . -type f -name '*.zip' -not -path './extracted/*' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Habitat ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Habitat project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED PROJECT ====="
          find extracted -maxdepth 5 -type f | sort
          echo "============================="

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle.kts or settings.gradle"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Locate MainActivity
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -type f -name 'MainActivity.kt' | head -n 1)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"

      - name: Locate Android manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$(find "$PROJECT_DIR" -type f -name 'AndroidManifest.xml' | head -n 1)"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not found."
            exit 1
          fi

          echo "Manifest:"
          echo "$MANIFEST"

          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            ANDROID_SDK="/usr/local/lib/android/sdk"
          elif [ -d "$ANDROID_HOME" ]; then
            ANDROID_SDK="$ANDROID_HOME"
          else
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$ANDROID_SDK"

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Inspect Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== GRADLE PROJECT ====="
          find . -maxdepth 4 -type f | sort
          echo "=========================="

          echo "===== GRADLE VERSION ====="
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "No gradlew wrapper found."
          fi

      - name: Install Gradle wrapper if needed
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            exit 0
          fi

          echo "Gradle wrapper missing."

          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper
            chmod +x ./gradlew
          else
            echo "ERROR: No Gradle wrapper and no system Gradle available."
            exit 1
          fi

      - name: Replace Habitat MainActivity
        shell: bash
        run: |
          set -e

          cat > "$MAIN_ACTIVITY" <<'KOTLIN'
package com.habitat.core

import android.graphics.Color
import android.os.Bundle
import android.view.KeyEvent
import android.view.inputmethod.EditorInfo
import android.widget.Button
import android.widget.EditText
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {

    private lateinit var conversation: TextView
    private lateinit var input: EditText

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        window.statusBarColor = Color.BLACK
        window.navigationBarColor = Color.BLACK

        buildInterface()
    }

    private fun buildInterface() {

        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(Color.rgb(8, 12, 18))
            setPadding(24, 24, 24, 16)
        }

        val title = TextView(this).apply {
            text = "HABITAT"
            textSize = 28f
            setTextColor(Color.WHITE)
            setPadding(0, 8, 0, 4)
        }

        val subtitle = TextView(this).apply {
            text = "AX CORE • AI OPERATING ENVIRONMENT"
            textSize = 12f
            setTextColor(Color.LTGRAY)
            setPadding(0, 0, 0, 20)
        }

        val status = TextView(this).apply {
            text = "● HABITAT CORE ONLINE"
            textSize = 13f
            setTextColor(Color.GREEN)
            setPadding(0, 0, 0, 16)
        }

        val scroll = ScrollView(this)

        conversation = TextView(this).apply {
            text = """
WELCOME TO HABITAT

Ax Core is initialized.

CORE
• Memory
• Projects
• Agents
• Tasks
• Tools
• Execution
• Android control

ACTIVE PROJECTS
• DropPilot AI
• Vice City Files
• Habitat

SYSTEM LOOP
UNDERSTAND → PLAN → ACT → OBSERVE → VERIFY

Type a command below.
            """.trimIndent()

            textSize = 15f
            setTextColor(Color.WHITE)
            setPadding(0, 8, 0, 24)
        }

        scroll.addView(conversation)

        input = EditText(this).apply {
            hint = "Talk to Ax..."
            textSize = 15f
            setTextColor(Color.WHITE)
            setHintTextColor(Color.GRAY)
            singleLine = true
            imeOptions = EditorInfo.IME_ACTION_SEND
        }

        val send = Button(this).apply {
            text = "SEND TO AX"
            setOnClickListener {
                sendMessage()
            }
        }

        input.setOnEditorActionListener { _, actionId, event ->
            if (
                actionId == EditorInfo.IME_ACTION_SEND ||
                (event?.keyCode == KeyEvent.KEYCODE_ENTER &&
                 event.action == KeyEvent.ACTION_DOWN)
            ) {
                sendMessage()
                true
            } else {
                false
            }
        }

        root.addView(title)
        root.addView(subtitle)
        root.addView(status)

        root.addView(
            scroll,
            LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                0,
                1f
            )
        )

        root.addView(
            input,
            LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                LinearLayout.LayoutParams.WRAP_CONTENT
            )
        )

        root.addView(
            send,
            LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                LinearLayout.LayoutParams.WRAP_CONTENT
            )
        )

        setContentView(root)
    }

    private fun sendMessage() {
        val message = input.text.toString().trim()

        if (message.isEmpty()) {
            return
        }

        conversation.append(
            "\n\nYOU\n$message\n\nAX\nProcessing through Habitat Core..."
        )

        input.text.clear()
    }
}
KOTLIN

          echo "MainActivity replaced."

      - name: Add Habitat core files
        shell: bash
        run: |
          set -e

          PACKAGE_DIR="$(dirname "$MAIN_ACTIVITY")"

          cat > "$PACKAGE_DIR/HabitatStore.kt" <<'KOTLIN'
package com.habitat.core

import android.content.Context

object HabitatStore {

    private const val PREFS = "habitat_core"

    fun save(context: Context, key: String, value: String) {
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .edit()
            .putString(key, value)
            .apply()
    }

    fun load(context: Context, key: String, default: String = ""): String {
        return context
            .getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getString(key, default)
            ?: default
    }
}
KOTLIN

          cat > "$PACKAGE_DIR/BrainAdapter.kt" <<'KOTLIN'
package com.habitat.core

import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

object BrainAdapter {

    fun isConfigured(endpoint: String): Boolean {
        return endpoint.trim().startsWith("http")
    }

    fun request(
        endpoint: String,
        message: String
    ): String {

        val connection =
            URL(endpoint).openConnection() as HttpURLConnection

        connection.requestMethod = "POST"
        connection.connectTimeout = 10000
        connection.readTimeout = 30000
        connection.doOutput = true
        connection.setRequestProperty(
            "Content-Type",
            "application/json"
        )

        val body = JSONObject()
            .put("message", message)
            .toString()

        connection.outputStream.use {
            it.write(body.toByteArray())
        }

        val stream =
            if (connection.responseCode in 200..299) {
                connection.inputStream
            } else {
                connection.errorStream
            }

        return stream.bufferedReader().use {
            it.readText()
        }
    }
}
KOTLIN

          cat > "$PACKAGE_DIR/HabitatEngine.kt" <<'KOTLIN'
package com.habitat.core

object HabitatEngine {

    fun understand(input: String): String {
        return input.trim()
    }

    fun plan(input: String): List<String> {
        return listOf(
            "Understand request",
            "Check available tools",
            "Create execution plan",
            "Execute permitted actions",
            "Verify result"
        )
    }
}
KOTLIN

          cat > "$PACKAGE_DIR/AgentRegistry.kt" <<'KOTLIN'
