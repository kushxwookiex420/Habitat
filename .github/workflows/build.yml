name: Habitat Audrey Full Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. GET HABITAT
      # ------------------------------------------------------------
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat
        run: |
          rm -rf habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

      # ------------------------------------------------------------
      # 2. FIND ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Locate Android project
        run: |
          SETTINGS=$(find habitat-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Locate application
        run: |
          MANIFEST=$(find "$PROJECT_DIR" -name AndroidManifest.xml | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          APP_DIR=$(dirname "$MANIFEST")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Application:"
          echo "$APP_DIR"

      - name: Locate MainActivity
        run: |
          MAIN=$(find "$APP_DIR" -name MainActivity.kt | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"

          echo "MainActivity:"
          echo "$MAIN"

      # ------------------------------------------------------------
      # 3. JAVA / GRADLE
      # ------------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ------------------------------------------------------------
      # 4. CREATE AUDREY BRAIN ADAPTER
      # ------------------------------------------------------------
      - name: Create Audrey brain
        run: |
          MAIN_DIR=$(dirname "$MAIN")

          mkdir -p "$MAIN_DIR"

          cat > "$MAIN_DIR/AudreyBrain.kt" <<'EOF'
          package com.habitat.core

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class AudreyBrain(private val context: Context) {

              private val prefs =
                  context.getSharedPreferences(
                      "audrey_brain",
                      Context.MODE_PRIVATE
                  )

              private val endpointKey = "brain_endpoint"

              fun setEndpoint(endpoint: String) {
                  prefs.edit()
                      .putString(endpointKey, endpoint.trim())
                      .apply()
              }

              fun getEndpoint(): String {
                  return prefs.getString(endpointKey, "") ?: ""
              }

              fun remember(role: String, message: String) {

                  val old = prefs.getString(
                      "memory",
                      "[]"
                  ) ?: "[]"

                  val array = try {
                      JSONArray(old)
                  } catch (_: Exception) {
                      JSONArray()
                  }

                  val item = JSONObject()

                  item.put("role", role)
                  item.put("message", message)
                  item.put(
                      "time",
                      System.currentTimeMillis()
                  )

                  array.put(item)

                  while (array.length() > 100) {
                      array.remove(0)
                  }

                  prefs.edit()
                      .putString(
                          "memory",
                          array.toString()
                      )
                      .apply()
              }

              fun getMemory(): JSONArray {

                  val raw = prefs.getString(
                      "memory",
                      "[]"
                  ) ?: "[]"

                  return try {
                      JSONArray(raw)
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              fun demoResponse(message: String): String {

                  val text =
                      message.trim().lowercase()

                  remember(
                      "user",
                      message
                  )

                  val response =
                      when {

                          text.contains("hello") ||
                          text.contains("hi") ||
                          text.contains("hey") ->
                              "Hello. I'm Audrey. Habitat is online."

                          text.contains("who are you") ->
                              "I'm Audrey, the companion interface for Habitat."

                          text.contains("status") ->
                              "Habitat online. Local memory online. Brain adapter online. AI backend ready for connection."

                          text.contains("remember") ->
                              "I have local persistent memory enabled in this prototype."

                          text.contains("habitat") ->
                              "Habitat is my environment. I'm connected to its local brain layer."

                          else ->
                              "I heard you. The AI backend connection point is ready. Once connected, I'll be able to generate full AI responses."
                      }

                  remember(
                      "assistant",
                      response
                  )

                  return response
              }
          }
          EOF

      # ------------------------------------------------------------
      # 5. CREATE FULLSCREEN AUDREY INTERFACE
      # ------------------------------------------------------------
      - name: Replace MainActivity
        run: |

          cat > "$MAIN" <<'EOF'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var brain: AudreyBrain
              private lateinit var conversation: TextView

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  brain = AudreyBrain(this)

                  enableImmersiveMode()

                  buildAudreyScreen()
              }

              private fun enableImmersiveMode() {

                  window.decorView.systemUiVisibility =
                      (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
              }

              override fun onWindowFocusChanged(
                  hasFocus: Boolean
              ) {
                  super.onWindowFocusChanged(hasFocus)

                  if (hasFocus) {
                      enableImmersiveMode()
                  }
              }

              private fun buildAudreyScreen() {

                  /*
                   * HABITAT FULLSCREEN ENVIRONMENT
                   *
                   * The background is intentionally created
                   * as a dedicated layer so the final Audrey
                   * artwork can occupy the entire environment.
                   */

                  val root =
                      FrameLayout(this)

                  root.setBackgroundColor(
                      Color.rgb(5, 7, 15)
                  )

                  // ------------------------------------------------
                  // FUTURISTIC ENVIRONMENT LAYER
                  // ------------------------------------------------

                  val environment =
                      LinearLayout(this)

                  environment.orientation =
                      LinearLayout.VERTICAL

                  environment.gravity =
                      Gravity.CENTER

                  environment.setBackgroundColor(
                      Color.rgb(5, 7, 15)
                  )

                  val environmentTitle =
                      TextView(this)

                  environmentTitle.text =
                      "HABITAT"

                  environmentTitle.textSize =
                      12f

                  environmentTitle.setTextColor(
                      Color.rgb(70, 220, 180)
                  )

                  environmentTitle.gravity =
                      Gravity.CENTER

                  val desk =
                      TextView(this)

                  desk.text =
                      "\n\n\n\n\n\n\n\n\n" +
                      "        AUDREY WORKSTATION\n\n" +
                      "        [ AUDREY VISUAL LAYER ]"

                  desk.textSize =
                      20f

                  desk.setTextColor(
                      Color.WHITE
                  )

                  desk.gravity =
                      Gravity.CENTER

                  /*
                   * This area is the Audrey-at-the-desk
                   * artwork target.
                   *
                   * The actual generated artwork can be
                   * dropped into this layer later without
                   * changing the brain architecture.
                   */

                  environment.addView(
                      environmentTitle,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  environment.addView(
                      desk,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  root.addView(
                      environment,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  // ------------------------------------------------
                  // TOP STATUS
                  // ------------------------------------------------

                  val top =
                      LinearLayout(this)

                  top.orientation =
                      LinearLayout.VERTICAL

                  top.gravity =
                      Gravity.CENTER

                  top.setPadding(
                      24,
                      30,
                      24,
                      10
                  )

                  val name =
                      TextView(this)

                  name.text =
                      "AUDREY"

                  name.textSize =
                      30f

                  name.typeface =
                      Typeface.DEFAULT_BOLD

                  name.setTextColor(
                      Color.WHITE
                  )

                  name.gravity =
                      Gravity.CENTER

                  val online =
                      TextView(this)

                  online.text =
                      "HABITAT • ONLINE"

                  online.textSize =
                      12f

                  online.setTextColor(
                      Color.rgb(70, 230, 160)
                  )

                  online.gravity =
                      Gravity.CENTER

                  top.addView(name)

                  top.addView(online)

                  val topParams =
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )

                  topParams.gravity =
                      Gravity.TOP

                  root.addView(
                      top,
                      topParams
                  )

                  // ------------------------------------------------
                  // CHAT PANEL
                  // ------------------------------------------------

                  val panel =
                      LinearLayout(this)

                  panel.orientation =
                      LinearLayout.VERTICAL

                  panel.setPadding(
                      20,
                      12,
                      20,
                      16
                  )

                  panel.setBackgroundColor(
                      Color.argb(
                          210,
                          5,
                          8,
                          18
                      )
                  )

                  conversation =
                      TextView(this)

                  conversation.text =
                      "AUDREY\n\n" +
                      "I'm online.\n\n" +
                      "Local memory: READY\n" +
                      "Brain adapter: READY\n" +
                      "AI backend: READY FOR CONNECTION\n\n" +
                      "Talk to me."

                  conversation.textSize =
                      16f

                  conversation.setTextColor(
                      Color.WHITE
                  )

                  conversation.setPadding(
                      12,
                      12,
                      12,
                      12
                  )

                  val scroll =
                      ScrollView(this)

                  scroll.addView(
                      conversation
                  )

                  panel.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  val inputRow =
                      LinearLayout(this)

                  inputRow.orientation =
                      LinearLayout.HORIZONTAL

                  val input =
                      EditText(this)

                  input.hint =
                      "Talk to Audrey..."

                  input.setHintTextColor(
                      Color.GRAY
                  )

                  input.setTextColor(
                      Color.WHITE
                  )

                  input.setSingleLine(
                      false
                  )

                  val send =
                      Button(this)

                  send.text =
                      "SEND"

                  send.setOnClickListener {

                      val message =
                          input.text
                              .toString()
                              .trim()

                      if (
                          message.isNotEmpty()
                      ) {

                          val response =
                              brain.demoResponse(
                                  message
                              )

                          conversation.append(
                              "\n\nYOU\n" +
                              message +
                              "\n\nAUDREY\n" +
                              response
                          )

                          input.text.clear()

                          scroll.post {
                              scroll.fullScroll(
                                  ScrollView.FOCUS_DOWN
                              )
                          }
                      }
                  }

                  inputRow.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  inputRow.addView(
                      send,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  panel.addView(
                      inputRow,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val panelParams =
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          430
                      )

                  panelParams.gravity =
                      Gravity.BOTTOM

                  root.addView(
                      panel,
                      panelParams
                  )

                  setContentView(root)
              }
          }
          EOF

      # ------------------------------------------------------------
      # 6. INTERNET PERMISSION
      # ------------------------------------------------------------
      - name: Add Internet permission
        run: |

          MANIFEST=$(find "$APP_DIR" \
            -name AndroidManifest.xml \
            | head -n 1)

          python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = f.read()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if (
              "android.permission.INTERNET"
              not in data
          ):
              data = data.replace(
                  "<application",
                  permission +
                  "\n    <application",
                  1
              )

          with open(
              path,
              "
