name: Habitat 1.0 - Ax Core Build

"on":
  workflow_dispatch:

  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat 1.0
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Habitat ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for file in \
            "./Habitat-Android-v0.2.2-Ax-Edition-2.zip" \
            "./Habitat-Android-v0.2.2-Ax-Edition.zip" \
            "./Habitat-Android-Project.zip"
          do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Habitat ZIP not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Habitat
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction successful."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find MainActivity
        shell: bash
        run: |
          set -e

          MAIN=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.kt" \
            | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found."
            find "$PROJECT_DIR" -type f | sort
            exit 1
          fi

          SOURCE_DIR=$(dirname "$MAIN")

          echo "MainActivity:"
          echo "$MAIN"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================================
      # INSTALL HABITAT SOURCE
      # ==========================================================

      - name: Write Habitat MainActivity
        shell: bash
        run: |
          set -e

          cat > "$SOURCE_DIR/MainActivity.kt" <<'KOTLIN'
package com.habitat.core

import android.app.Activity
import android.content.Context
import android.graphics.Color
import android.graphics.Typeface
import android.graphics.drawable.GradientDrawable
import android.os.Bundle
import android.view.Gravity
import android.view.KeyEvent
import android.view.View
import android.view.WindowInsets
import android.view.WindowInsetsController
import android.view.inputmethod.EditorInfo
import android.widget.EditText
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.TextView
import android.widget.Button
import android.widget.Toast

class MainActivity : Activity() {

    private val store by lazy { HabitatStore(this) }
    private val brain by lazy { BrainAdapter(this) }

    private val bg = Color.rgb(4, 7, 12)
    private val panel = Color.rgb(12, 17, 25)
    private val panel2 = Color.rgb(18, 25, 36)
    private val border = Color.rgb(36, 49, 68)
    private val white = Color.WHITE
    private val muted = Color.rgb(145, 158, 178)
    private val cyan = Color.rgb(80, 195, 255)
    private val green = Color.rgb(100, 220, 155)
    private val orange = Color.rgb(255, 190, 90)

    private fun dp(value: Int): Int =
        (value * resources.displayMetrics.density).toInt()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        configureWindow()
        showHome()
    }

    override fun onDestroy() {
        brain.shutdown()
        super.onDestroy()
    }

    private fun configureWindow() {
        window.statusBarColor = bg
        window.navigationBarColor = bg

        if (android.os.Build.VERSION.SDK_INT >= 30) {
            window.setDecorFitsSystemWindows(false)

            window.insetsController?.setSystemBarsAppearance(
                0,
                WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or
                    WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
            )
        }
    }

    private fun root(): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(bg)
            setPadding(dp(16), dp(12), dp(16), dp(8))

            if (android.os.Build.VERSION.SDK_INT >= 30) {
                setOnApplyWindowInsetsListener { view, insets ->
                    val bars =
                        insets.getInsets(WindowInsets.Type.systemBars())

                    view.setPadding(
                        dp(16),
                        bars.top + dp(12),
                        dp(16),
                        bars.bottom + dp(8)
                    )

                    insets
                }
            }
        }
    }

    private fun background(
        color: Int = panel,
        radius: Int = 16
    ): GradientDrawable {
        return GradientDrawable().apply {
            setColor(color)
            cornerRadius = dp(radius).toFloat()
            setStroke(dp(1), border)
        }
    }

    private fun text(
        value: String,
        size: Float = 14f,
        color: Int = white,
        bold: Boolean = false
    ): TextView {
        return TextView(this).apply {
            text = value
            textSize = size
            setTextColor(color)

            if (bold) {
                typeface = Typeface.DEFAULT_BOLD
            }
        }
    }

    private fun button(
        title: String,
        action: () -> Unit
    ): Button {
        return Button(this).apply {
            text = title
            textSize = 12f
            setTextColor(white)
            typeface = Typeface.DEFAULT_BOLD
            background = background(panel2, 12)

            minHeight = dp(48)
            minimumHeight = dp(48)

            setPadding(
                dp(8),
                dp(2),
                dp(8),
                dp(2)
            )

            setOnClickListener {
                action()
            }
        }
    }

    private fun header(
        title: String,
        subtitle: String
    ): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL

            addView(
                text(
                    title,
                    28f,
                    white,
                    true
                )
            )

            addView(
                text(
                    subtitle,
                    11f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(3)
                }
            )
        }
    }

    private fun install(
        screen: LinearLayout
    ) {
        val content =
            LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
            }

        val existing =
            screen.childCount

        for (i in 0 until existing) {
            val child = screen.getChildAt(i)
            screen.removeView(child)
            content.addView(child)
        }

        screen.removeAllViews()

        screen.addView(
            content,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val nav =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.HORIZONTAL

                gravity =
                    Gravity.CENTER

                setPadding(
                    0,
                    dp(5),
                    0,
                    dp(3)
                )
            }

        val items =
            listOf(
                "HOME",
                "PROJECTS",
                "BRAIN",
                "AGENTS",
                "MORE"
            )

        items.forEach { item ->

            nav.addView(
                button(item) {

                    when (item) {

                        "HOME" ->
                            showHome()

                        "PROJECTS" ->
                            showProjects()

                        "BRAIN" ->
                            showBrain()

                        "AGENTS" ->
                            showAgents()

                        "MORE" ->
                            showMore()
                    }
                },
                LinearLayout.LayoutParams(
                    0,
                    dp(50),
                    1f
                ).apply {
                    marginStart = dp(3)
                    marginEnd = dp(3)
                }
            )
        }

        screen.addView(
            nav,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )

        setContentView(screen)
    }

    private fun card(
        title: String,
        state: String,
        description: String
    ): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            background = background()

            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            val row =
                LinearLayout(this@MainActivity).apply {
                    orientation =
                        LinearLayout.HORIZONTAL
                }

            row.addView(
                text(
                    title,
                    15f,
                    white,
                    true
                ),
                LinearLayout.LayoutParams(
                    0,
                    -2,
                    1f
                )
            )

            row.addView(
                text(
                    state,
                    13f,
                    cyan,
                    true
                )
            )

            addView(row)

            addView(
                text(
                    description,
                    11f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                }
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    dp(78)
                ).apply {
                    bottomMargin = dp(8)
                }
        }
    }

    private fun brainStatus(): String {
        return if (brain.endpoint().isBlank()) {
            "● AX CORE   LOCAL   BRAIN NOT CONNECTED"
        } else {
            "● AX CORE   BRAIN ENDPOINT READY"
        }
    }

    private fun showHome() {

        val screen = root()

        screen.addView(
            header(
                "HABITAT",
                "AX INTELLIGENCE ENVIRONMENT"
            )
        )

        screen.addView(
            text(
                brainStatus(),
                12f,
                if (brain.endpoint().isBlank())
                    orange
                else
                    green,
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(10)
                bottomMargin = dp(10)
            }
        )

        val core =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL

                background =
                    background()

                setPadding(
                    dp(18),
                    dp(18),
                    dp(18),
                    dp(18)
                )
            }

        core.addView(
            text(
                "AX CORE",
                22f,
                white,
                true
            )
        )

        core.addView(
            text(
                "Command center online",
                15f,
                cyan,
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(7)
            }
        )

        core.addView(
            text(
                "UNDERSTAND → PLAN → ACT → OBSERVE → VERIFY",
                11f,
                muted
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(7)
            }
        )

        screen.addView(
            core,
            LinearLayout.LayoutParams(
                -1,
                dp(132)
            ).apply {
                bottomMargin = dp(10)
            }
        )

        screen.addView(
            card(
                "DROPPILOT AI",
                "WORKSPACE",
                "Products • economics • research • listings • growth"
            )
        )

        screen.addView(
            card(
                "VICE CITY FILES",
                "WORKSPACE",
                "Research • scripts • assets • publishing • analytics"
            )
        )

        screen.addView(
            card(
                "HABITAT CORE",
                "RUNNING",
                "Memory • tasks • agents • tools • automation"
            )
        )

        val commands =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.HORIZONTAL
            }

        commands.addView(
            button("TALK TO AX") {
                showChat()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            )
        )

        commands.addView(
            button("TASKS") {
                showTasks()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            ).apply {
                marginStart = dp(8)
            }
        )

        screen.addView(
            commands,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )

        install(screen)
    }

    private fun showChat() {

        val screen = root()

        screen.addView(
            header(
                "AX",
                "DIRECT COMMAND INTERFACE"
            )
        )

        val scroll =
            ScrollView(this)

        val messages =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL

                setPadding(
                    0,
                    dp(10),
                    0,
                    dp(10)
                )
            }

        fun addMessage(
            who: String,
            body: String,
            user: Boolean
        ) {
            val bubble =
                text(
                    "$who\n$body",
                    14f,
                    white
                )

            bubble.background =
                background(
                    if (user)
                        Color.rgb(18, 42, 62)
                    else
                        panel
                )

            bubble.setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            messages.addView(
                bubble,
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                    bottomMargin = dp(5)
                }
            )

            scroll.post {
                scroll.fullScroll(
                    View.FOCUS_DOWN
                )
            }
        }

        addMessage(
            "AX",
            "Habitat command interface online. Awaiting mission.",
            false
        )

        scroll.addView(messages)

        screen.addView(
            scroll,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val input =
            EditText(this).apply {

                hint = "Command Ax..."

                setHintTextColor(muted)
                setTextColor(white)

                textSize = 15f

                singleLine = true

                imeOptions =
                    EditorInfo.IME_ACTION_SEND

                background =
                    background()

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        screen.addView(
            input,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            ).apply {
                bottomMargin = dp(7)
            }
        )

        fun send() {

            val command =
                input.text
                    .toString()
                    .trim()

            if (command.isEmpty()) {
                return
            }

            addMessage(
                "YOU",
                command,
                true
            )

            store.saveMessage(
                "YOU",
                command
            )

            input.text.clear()

            if (brain.endpoint().isBlank()) {

                addMessage(
                    "AX",
                    "Command received locally. Connect a brain endpoint in BRAIN to enable external AI processing.",
                    false
                )

            } else {

                addMessage(
                    "AX",
                    "Processing...",
                    false
                )

                brain.send(
                    command
                ) { result ->

                    runOnUiThread {

                        addMessage(
                            "AX",
                            result.text,
                            false
                        )

                        store.saveMessage(
                            "AX",
                            result.text
                        )
                    }
                }
            }
        }

        input.setOnEditorActionListener { _, action, event ->

            if (
                action == EditorInfo.IME_ACTION_SEND ||
                (
                    event != null &&
                    event.keyCode ==
                        KeyEvent.KEYCODE_ENTER &&
                    event.action ==
                        KeyEvent.ACTION_DOWN
                )
            ) {

                send()
                true

            } else {

                false
            }
        }

        screen.addView(
            button("SEND") {
                send()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            )
        )

        install(screen)
    }

    private fun showProjects() {

        val screen = root()

        screen.addView(
            header(
                "PROJECTS",
                "HABITAT WORKSPACES"
            )
        )

        screen.addView(
            card(
                "DROPPILOT AI",
                "READY",
                "TikTok Shop / Shopify business workspace"
            )
        )

        screen.addView(
            card(
                "VICE CITY FILES",
                "READY",
                "GTA 6 research and content workspace"
            )
        )

        screen.addView(
            card(
                "HABITAT",
                "ACTIVE",
                "Ax intelligence environment"
            )
        )

        screen.addView(
            button("DROPPILOT COMMAND CENTER") {
                showWorkspace(
                    "DROPPILOT AI",
                    listOf(
                        "PRODUCT RESEARCH",
                        "ECONOMICS",
                        "COMPETITOR RESEARCH",
                        "LISTINGS",
                        "CREATOR OUTREACH",
                        "SALES MONITOR"
                    )
                )
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                bottomMargin = dp(8)
            }
        )

        screen.addView(
            button("VICE CITY COMMAND CENTER") {
                showWorkspace(
                    "VICE CITY FILES",
                    listOf(
                        "TOPIC RESEARCH",
                        "FACT CHECK",
                        "SCRIPT ENGINE",
                        "ASSET PLANNER",
                        "PUBLISHING",
                        "ANALYTICS"
                    )
                }
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            )
        )

        install(screen)
    }

    private fun showWorkspace(
        name: String,
        functions: List<String>
    ) {

        val screen = root()

        screen.addView(
            header(
                name,
                "PROJECT COMMAND CENTER"
            )
        )

        functions.forEach { item ->

            screen.addView(
                card(
                    item,
                    "READY",
                    "Habitat capability interface"
                )
            )
        }

        screen.addView(
            button("ASK AX") {
                showChat()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(5)
            }
        )

        install(screen)
    }

    private fun showBrain() {

        val screen = root()

        screen.addView(
            header(
                "BRAIN",
                "AI PROVIDER CONTROL"
            )
        )

        screen.addView(
            text(
                if (brain.endpoint().isBlank())
                    "● BRAIN NOT CONNECTED"
                else
                    "● BRAIN ENDPOINT READY",
                13f,
                if (brain.endpoint().isBlank())
                    orange
                else
                    green,
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(10)
            }
        )

        val endpoint =
            EditText(this).apply {

                hint =
                    "https://your-server/chat"

                setHintTextColor(muted)
                setTextColor(white)

                singleLine = true

                setText(
                    brain.endpoint()
                )

                background =
                    background()

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        screen.addView(
            endpoint,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            ).apply {
                topMargin = dp(10)
            }
        )

        screen.addView(
            button("SAVE BRAIN ENDPOINT") {

                brain.setEndpoint(
                    endpoint.text
                        .toString()
                        .trim()
                )

                Toast.makeText(
                    this,
                    "Brain endpoint saved.",
                    Toast.LENGTH_SHORT
                ).show()

                showBrain()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            ).apply {
                topMargin = dp(7)
            }
        )

        screen.addView(
            card(
                "MEMORY",
                "LOCAL",
                "Persistent local conversation memory"
            )
        )

        screen.addView(
            card(
                "TASK ENGINE",
                "READY",
                "Task creation and state"
            )
        )

        screen.addView(
            card(
                "AGENTS",
                "READY",
                "Habitat specialized workers"
            )
        )

        screen.addView(
            card(
                "EXECUTION",
                "VERIFIED",
                "Actions must be verified before completion"
            )
        )

        install(screen)
    }

    private fun showAgents() {

        val screen = root()

        screen.addView(
            header(
                "AGENTS",
                "SPECIALIZED HABITAT WORKERS"
            )
        )

        listOf(
            "COORDINATOR",
            "RESEARCH",
            "DROPPILOT",
            "VICE CITY",
            "ANDROID",
            "AUTOMATION"
        ).forEach {

            screen.addView(
                card(
                    it,
                    "READY",
                    "Registered Habitat agent"
                )
            )
        }

        install(screen)
    }

    private fun showTasks() {

        val screen = root()

        screen.addView(
            header(
                "TASKS",
                "HABITAT EXECUTION QUEUE"
            )
        )

        val tasks = store.tasks()

        if (tasks.isEmpty()) {

            screen.addView(
                card(
                    "QUEUE",
                    "EMPTY",
                    "No tasks currently stored"
                )
            )

        } else {

            tasks.forEach { task ->

                screen.addView(
                    card(
                        task.title,
                        if (task.completed)
                            "DONE"
                        else
                            "OPEN",
                        task.description
                    )
                )
            }
        }

        screen.addView(
            button("CREATE TEST TASK") {

                store.addTask(
                    "Habitat task",
                    "Created from the Habitat command center."
                )

                showTasks()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(8)
            }
        )

        install(screen)
    }

    private fun showMore() {

        val screen = root()

        screen.addView(
            header(
                "MORE",
                "HABITAT SYSTEM"
            )
        )

        screen.addView(
            card(
                "HABITAT",
                "1.0",
                "Ax Intelligence Environment"
            )
        )

        screen.addView(
            card(
                "MEMORY",
                store.messageCount().toString(),
                "Local messages"
            )
        )

        screen.addView(
            card(
                "TASKS",
                store.tasks().size.toString(),
                "Stored tasks"
            )
        )

        screen.addView(
            button("CLEAR LOCAL MEMORY") {

                store.clearMessages()

                Toast.makeText(
                    this,
                    "Local memory cleared.",
                    Toast.LENGTH_SHORT
                ).show()

                showMore()
            }
        )

        install(screen)
    }
}
KOTLIN

      - name: Write BrainAdapter
        shell: bash
        run: |
          set -e

          cat > "$SOURCE_DIR/BrainAdapter.kt" <<'KOTLIN'
package com.habitat.core

import android.content.Context
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL
import java.util.concurrent.Executors

data class BrainResult(
    val text: String
)

class BrainAdapter(
    context: Context
) {

    private val prefs =
        context.getSharedPreferences(
            "habitat_brain",
            Context.MODE_PRIVATE
        )

    private val executor =
        Executors.newCachedThreadPool()

    fun endpoint(): String =
        prefs.getString(
            "endpoint",
            ""
        ) ?: ""

    fun setEndpoint(
        value: String
    ) {
        prefs.edit()
            .putString(
                "endpoint",
                value
            )
            .apply()
    }

    fun send(
        message: String,
        callback: (BrainResult) -> Unit
    ) {

        val endpoint =
            endpoint()

        if (endpoint.isBlank()) {

            callback(
                BrainResult(
                    "Brain endpoint is not configured."
                )
            )

            return
        }

        executor.execute {

            try {

                val connection =
                    URL(endpoint)
                        .openConnection()
                        as HttpURLConnection

                connection.requestMethod = "POST"
                connection.connectTimeout = 15000
                connection.readTimeout = 30000
                connection.doOutput = true

                connection.setRequestProperty(
                    "Content-Type",
                    "application/json"
                )

                val body =
                    JSONObject()
                        .put(
                            "message",
                            message
                        )
                        .toString()

                connection.outputStream.use {
                    it.write(
                        body.toByteArray(
                            Charsets.UTF_8
                        )
                    )
                }

                val code =
                    connection.responseCode

                val stream =
                    if (code in 200..299)
                        connection.inputStream
                    else
                        connection.errorStream

                val response =
                    stream
                        ?.bufferedReader()
                        ?.use {
                            it.readText()
                        }
                        ?: ""

                val json =
                    try {
                        JSONObject(response)
                    } catch (_: Exception) {
                        JSONObject()
                    }

                val answer =
                    json.optString(
                        "response",
                        json.optString(
                            "error",
                            "Brain returned no response."
                        )
                    )

                callback(
                    BrainResult(answer)
                )

                connection.disconnect()

            } catch (error: Exception) {

                callback(
                    BrainResult(
                        "Brain connection failed: ${
                            error.message
                                ?: "unknown error"
                        }"
                    )
                )
            }
        }
    }

    fun shutdown() {
        executor.shutdownNow()
    }
}
