name: Build Habitat Audrey

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Habitat Android project
        shell: bash
        run: |
          rm -rf habitat-project
          mkdir -p habitat-project/HabitatAndroid/app/src/main/java/com/habitat
          mkdir -p habitat-project/HabitatAndroid/app/src/main/res/values

          cat > habitat-project/HabitatAndroid/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HabitatAndroid"
          include(":app")
          EOF

          cat > habitat-project/HabitatAndroid/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > habitat-project/HabitatAndroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > habitat-project/HabitatAndroid/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.habitat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.habitat"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 505
                  versionName = "0.5.5"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#05070B</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#64D8FF</item>
                  <item name="android:windowNoTitle">true</item>
              </style>

          </resources>
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:label="Habitat"
                  android:theme="@style/AppTheme"
                  android:resizeableActivity="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > habitat-project/HabitatAndroid/app/src/main/java/com/habitat/MainActivity.kt <<'EOF'
          package com.habitat

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.Window
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Space
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.updatePadding
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private val backendUrl = "https://habitat-cr46.onrender.com/chat"

              private lateinit var root: LinearLayout
              private lateinit var chatScroll: ScrollView
              private lateinit var chatColumn: LinearLayout
              private lateinit var input: EditText
              private lateinit var sendButton: Button
              private lateinit var statusText: TextView

              private val executor = Executors.newSingleThreadExecutor()

              private val bg = Color.rgb(5, 7, 11)
              private val panel = Color.rgb(12, 16, 24)
              private val panel2 = Color.rgb(18, 23, 33)
              private val textMain = Color.rgb(235, 244, 250)
              private val textDim = Color.rgb(132, 151, 166)
              private val cyan = Color.rgb(90, 215, 255)
              private val cyanDark = Color.rgb(18, 65, 82)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = bg

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.insetsController?.setSystemBarsAppearance(
                          0,
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                      )
                  }

                  buildInterface()
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              private fun rounded(color: Int, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              private fun buildInterface() {

                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                      clipChildren = false
                      clipToPadding = false
                  }

                  ViewCompat.setOnApplyWindowInsetsListener(root) { view, insets ->

                      val bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                      )

                      val ime = insets.getInsets(
                          WindowInsetsCompat.Type.ime()
                      )

                      val keyboardVisible =
                          insets.isVisible(WindowInsetsCompat.Type.ime())

                      view.updatePadding(
                          left = dp(16),
                          right = dp(16),
                          top = bars.top + dp(10),
                          bottom = if (keyboardVisible) {
                              dp(8)
                          } else {
                              bars.bottom + dp(10)
                          }
                      )

                      if (keyboardVisible) {
                          chatScroll.post {
                              chatScroll.fullScroll(View.FOCUS_DOWN)
                          }
                      }

                      insets
                  }

                  setContentView(root)

                  createHeader()
                  createAudreyArea()
                  createChatArea()
                  createInputArea()

                  ViewCompat.requestApplyInsets(root)
              }

              private fun createHeader() {

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, dp(10))
                  }

                  val brand = TextView(this).apply {
                      text = "HABITAT"
                      textSize = 20f
                      setTextColor(textMain)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      letterSpacing = 0.12f
                  }

                  val spacer = Space(this)

                  statusText = TextView(this).apply {
                      text = "●  ONLINE"
                      textSize = 11f
                      setTextColor(cyan)
                      letterSpacing = 0.08f
                  }

                  header.addView(
                      brand,
                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  header.addView(
                      spacer,
                      LinearLayout.LayoutParams(
                          dp(8),
                          1
                      )
                  )

                  header.addView(statusText)

                  root.addView(
                      header,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
              }

              private fun createAudreyArea() {

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = rounded(panel, 28)
                      setPadding(dp(20), dp(18), dp(20), dp(18))
                  }

                  val aura = TextView(this).apply {
                      text = "◉"
                      textSize = 72f
                      setTextColor(cyan)
                      gravity = Gravity.CENTER
                  }

                  val name = TextView(this).apply {
                      text = "AUDREY"
                      textSize = 24f
                      setTextColor(textMain)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      letterSpacing = 0.16f
                      gravity = Gravity.CENTER
                  }

                  val role = TextView(this).apply {
                      text = "HABITAT INTELLIGENCE"
                      textSize = 10f
                      setTextColor(textDim)
                      letterSpacing = 0.16f
                      gravity = Gravity.CENTER
                  }

                  val line = View(this).apply {
                      setBackgroundColor(cyanDark)
                  }

                  card.addView(
                      aura,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(86)
                      )
                  )

                  card.addView(name)

                  card.addView(
                      role,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(28)
                      )
                  )

                  card.addView(
                      line,
                      LinearLayout.LayoutParams(
                          dp(80),
                          dp(2)
                      ).apply {
                          gravity = Gravity.CENTER
                      }
                  )

                  root.addView(
                      card,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          0.38f
                      ).apply {
                          topMargin = dp(4)
                          bottomMargin = dp(10)
                      }
                  )
              }

              private fun createChatArea() {

                  chatScroll = ScrollView(this).apply {
                      isFillViewport = true
                      overScrollMode = View.OVER_SCROLL_NEVER
                      setBackgroundColor(Color.TRANSPARENT)
                  }

                  chatColumn = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(8)
                      )
                  }

                  addMessage(
                      "Audrey",
                      "I'm online. What do you need?",
                      false
                  )

                  chatScroll.addView(
                      chatColumn,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  root.addView(
                      chatScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          0.42f
                      )
                  )
              }

              private fun createInputArea() {

                  val inputPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = rounded(panel2, 22)
                      setPadding(
                          dp(12),
                          dp(8),
                          dp(8),
                          dp(8)
                      )
                  }

                  input = EditText(this).apply {
                      hint = "Talk to Audrey..."
                      hintTextColor = textDim
                      setTextColor(textMain)
                      textSize = 16f
                      singleLine = true
                      imeOptions = EditorInfo.IME_ACTION_SEND
                      inputType =
                          android.text.InputType.TYPE_CLASS_TEXT or
                          android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES
                      background = null
                      setPadding(dp(4), 0, dp(8), 0)

                      setOnEditorActionListener { _, actionId, _ ->
                          if (actionId == EditorInfo.IME_ACTION_SEND) {
                              sendMessage()
                              true
                          } else {
                              false
                          }
                      }
                  }

                  sendButton = Button(this).apply {
                      text = "SEND"
                      textSize = 11f
                      setTextColor(Color.BLACK)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      background = rounded(cyan, 18)
                      setPadding(dp(14), 0, dp(14), 0)

                      setOnClickListener {
                          sendMessage()
                      }
                  }

                  inputPanel.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          dp(52),
                          1f
                      )
                  )

                  inputPanel.addView(
                      sendButton,
                      LinearLayout.LayoutParams(
                          dp(82),
                          dp(48)
                      )
                  )

                  root.addView(
                      inputPanel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(68)
                      ).apply {
                          topMargin = dp(8)
                      }
                  )

                  input.requestFocus()

                  input.postDelayed({
                      val imm =
                          getSystemService(Context.INPUT_METHOD_SERVICE)
                              as InputMethodManager

                      imm.showSoftInput(
                          input,
                          InputMethodManager.SHOW_IMPLICIT
                      )
                  }, 350)
              }

              private fun addMessage(
                  speaker: String,
                  message: String,
                  user: Boolean
              ) {

                  val wrapper = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity =
                          if (user) Gravity.END else Gravity.START
                      setPadding(0, dp(5), 0, dp(5))
                  }

                  val label = TextView(this).apply {
                      text = speaker.uppercase()
                      textSize = 9f
                      setTextColor(
                          if (user) cyan else textDim
                      )
                      letterSpacing = 0.12f
                      setPadding(dp(8), 0, dp(8), dp(3))
                  }

                  val bubble = TextView(this).apply {
                      text = message
                      textSize = 15f
                      setTextColor(textMain)
                      setPadding(
                          dp(14),
                          dp(11),
                          dp(14),
                          dp(11)
                      )
                      background = rounded(
                          if (user) cyanDark else panel,
                          18
                      )
                  }

                  wrapper.addView(label)

                  wrapper.addView(
                      bubble,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          maxWidth = dp(310)
                      }
                  )

                  chatColumn.addView(wrapper)

                  chatScroll.post {
                      chatScroll.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun sendMessage() {

                  val message = input.text.toString().trim()

                  if (message.isEmpty()) return

                  input.setText("")

                  addMessage(
                      "You",
                      message,
                      true
                  )

                  sendButton.isEnabled = false
                  statusText.text = "● THINKING"

                  executor.execute {

                      try {

                          val connection =
                              URL(backendUrl).openConnection()
                                  as HttpURLConnection

                          connection.requestMethod = "POST"
                          connection.connectTimeout = 20000
                          connection.readTimeout = 60000
                          connection.doOutput = true

                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          )

                          val json =
                              """{"message":${jsonEscape(message)}}"""

                          connection.outputStream.use {
                              it.write(
                                  json.toByteArray(
                                      Charsets.UTF_8
                                  )
                              )
                          }

                          val responseCode =
                              connection.responseCode

                          val stream =
                              if (responseCode in 200..299) {
                                  connection.inputStream
                              } else {
                                  connection.errorStream
                              }

                          val response =
                              stream?.bufferedReader()
                                  ?.use { it.readText() }
                                  ?: ""

                          runOnUiThread {

                              sendButton.isEnabled = true
                              statusText.text = "● ONLINE"

                              if (responseCode in 200..299) {

                                  val reply =
                                      extractReply(response)

                                  addMessage(
                                      "Audrey",
                                      reply,
                                      false
                                  )

                              } else {

                                  addMessage(
                                      "System",
                                      "Backend error $responseCode",
                                      false
                                  )
                              }
                          }

                          connection.disconnect()

                      } catch (e: Exception) {

                          runOnUiThread {

                              sendButton.isEnabled = true
                              statusText.text = "● ONLINE"

                              addMessage(
                                  "System",
                                  "Connection error: ${e.message}",
                                  false
                              )
                          }
                      }
                  }
              }

              private fun jsonEscape(value: String): String {
                  return "\"" +
                      value
                          .replace("\\", "\\\\")
                          .replace("\"", "\\\"")
                          .replace("\n", "\\n")
                          .replace("\r", "\\r")
                          .replace("\t", "\\t") +
                      "\""
              }

              private fun extractReply(json: String): String {

                  val possibleKeys =
                      listOf(
                          "\"reply\"",
                          "\"output\"",
                          "\"message\"",
                          "\"text\""
                      )

                  for (key in possibleKeys) {

                      val start =
                          json.indexOf(key)

                      if (start >= 0) {

                          val colon =
                              json.indexOf(
                                  ":",
                                  start + key.length
                              )

                          if (colon >= 0) {

                              var i = colon + 1

                              while (
                                  i < json.length &&
                                  json[i].isWhitespace()
                              ) {
                                  i++
                              }

                              if (
                                  i < json.length &&
                                  json[i] == '"'
                              ) {

                                  i++

                                  val builder =
                                      StringBuilder()

                                  var escaped = false

                                  while (
                                      i < json.length
                                  ) {

                                      val c = json[i]

                                      if (escaped) {
                                          builder.append(
                                              when (c) {
                                                  'n' -> '\n'
                                                  'r' -> '\r'
                                                  't' -> '\t'
                                                  '"' -> '"'
                                                  '\\' -> '\\'
                                                  else -> c
                                              }
                                          )
                                          escaped = false

                                      } else if (c == '\\') {
                                          escaped = true

                                      } else if (c == '"') {
                                          return builder.toString()

                                      } else {
                                          builder.append(c)
                                      }

                                      i++
                                  }
                              }
                          }
                      }
                  }

                  return json
              }

              override fun onDestroy() {
                  executor.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

      - name: Verify source
        working-directory: habitat-project/HabitatAndroid
        run: |
          echo "Checking MainActivity..."
          grep -n "backendUrl" app/src/main/java/com/habitat/MainActivity.kt
          grep -n "adjustResize" app/src/main/AndroidManifest.xml
          grep -n "LayoutParams" app/src/main/java/com/habitat/MainActivity.kt

      - name: Build APK
        working-directory: habitat-project/HabitatAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-v0.5.5
          path: habitat-project/HabitatAndroid/app/build/outputs/apk/debug/app-debug.apk
