name: Habitat Audrey Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Repair MainActivity timestamp
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "Before repair:"
          nl -ba "$MAIN_FILE" | sed -n '10,35p'

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          # Protect the function declaration.
          for i, line in enumerate(lines):
              if "private fun now()" in line:
                  print("Protected function declaration at line", i + 1)

          # The compiler identified line 27.
          # Only repair a bare `now` used as a value on that line.
          if len(lines) >= 27:
              line = lines[26]

              if "private fun now()" not in line:
                  fixed = re.sub(r'(?<![\w.])now(?!\s*\()', 'now()', line)

                  if fixed != line:
                      lines[26] = fixed
                      print("Repaired line 27.")
                  else:
                      print("Line 27 did not contain a bare now reference.")
              else:
                  print("Line 27 is the function declaration; no change made.")

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          PY

          echo "After repair:"
          nl -ba "$MAIN_FILE" | sed -n '10,35p'

      - name: Build Habitat
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
