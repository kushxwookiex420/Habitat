name: Habitat v0.3.0 Ax Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.3.0 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "ERROR: Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # ============================================================
      # EXTRACT REAL v0.3.0 PROJECT
      # ============================================================

      - name: Extract Habitat v0.3.0 project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Habitat-Android-v0.3.0-Ax-Edition.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: v0.3.0 ZIP was not found:"
            echo "$ZIP"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/HabitatBuild"
          mkdir -p "$GITHUB_WORKSPACE/HabitatBuild"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/HabitatBuild"

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/HabitatBuild" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Android project."
            exit 1
          fi

          echo "HABITAT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "HABITAT v0.3.0 PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify Habitat v0.3.0 source
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"
          CORE="$PROJECT/app/src/main/java/com/habitat/core"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f "$CORE/MainActivity.kt"
          test -f "$CORE/BrainAdapter.kt"
          test -f "$CORE/WorkerAdapter.kt"
          test -f "$CORE/WorkerRegistry.kt"
          test -f "$CORE/Models.kt"
          test -f "$CORE/TaskStore.kt"
          test -f "$CORE/HologramView.kt"
          test -f "$CORE/HabitatWidget.kt"

          echo "Habitat v0.3.0 source verified."

      # ============================================================
      # SHOW ORIGINAL WORKER CALL
      # ============================================================

      - name: Inspect MainActivity before repair
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "=============================================="
          echo "MAIN ACTIVITY BEFORE REPAIR"
          echo "=============================================="

          grep -n -C 2 "workerAdapter.run" "$FILE" || true

      # ============================================================
      # REPAIR MAINACTIVITY CALLBACK
      #
      # WorkerAdapter expects:
      #
      # (Boolean, String, String) -> Unit
      #
      # The original v0.3.0 MainActivity uses:
      #
      # { ok -> ... }
      #
      # but then references text/detail.
      #
      # We convert it to:
      #
      # { ok, text, detail -> ... }
      # ============================================================

      - name: Repair MainActivity worker callback
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          file_path = Path(sys.argv[1])
          source = file_path.read_text()

          # First attempt: exact known v0.3.0 form.
          exact_patterns = [
              (
                  r'workerAdapter\.run\s*\(\s*worker\s*,\s*task\s*\)\s*\{\s*ok\s*->',
                  'workerAdapter.run(worker, task) { ok, text, detail ->'
              ),
              (
                  r'workerAdapter\.run\s*\(\s*worker\s*,\s*task\s*\)\s*\{\s*ok\s*,\s*->',
                  'workerAdapter.run(worker, task) { ok, text, detail ->'
              )
          ]

          repaired = False

          for pattern, replacement in exact_patterns:
              new_source, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1
              )

              if count == 1:
                  source = new_source
                  repaired = True
                  break

          # Fallback: locate the workerAdapter call and replace
          # whatever lambda parameter list is present.
          if not repaired:
              fallback = re.compile(
                  r'(workerAdapter\.run\s*\(\s*worker\s*,\s*task\s*\)'
                  r'\s*\{\s*)'
                  r'(?:ok(?:\s*,\s*(?:text|detail))*)?'
                  r'\s*->'
              )

              new_source, count = fallback.subn(
                  r'\1ok, text, detail ->',
                  source,
                  count=1
              )

              if count == 1:
                  source = new_source
                  repaired = True

          if not repaired:
              print("ERROR: Could not find the MainActivity worker callback.")
              print()
              print("WorkerAdapter calls found:")
              for number, line in enumerate(
                  source.splitlines(),
                  start=1
              ):
                  if "workerAdapter.run" in line:
                      print(f"{number}: {line}")

              sys.exit(1)

          file_path.write_text(source)

          print("SUCCESS: MainActivity worker callback repaired.")
          PY

      # ============================================================
      # VERIFY MAINACTIVITY REPAIR
      # ============================================================

      - name: Verify MainActivity repair
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "=============================================="
          echo "MAIN ACTIVITY AFTER REPAIR"
          echo "=============================================="

          grep -n -C 2 "workerAdapter.run" "$FILE"

          if ! grep -Eq \
            'workerAdapter\.run[[:space:]]*\([[:space:]]*worker,[[:space:]]*task[[:space:]]*\)[[:space:]]*\{[[:space:]]*ok,[[:space:]]*text,[[:space:]]*detail[[:space:]]*->' \
            "$FILE"; then

            echo ""
            echo "ERROR: MainActivity callback repair was not verified."
            exit 1
          fi

          echo ""
          echo "MainActivity callback repair VERIFIED."

      # ============================================================
      # REPAIR WORKERADAPTER
      # ============================================================

      - name: Repair WorkerAdapter
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          cat > "$CORE/WorkerAdapter.kt" <<'EOF'
          package com.habitat.core

          import android.content.Context
          import java.util.concurrent.Executors
          import java.util.concurrent.Future

          class WorkerAdapter(
              private val context: Context
          ) {

              private val registry = WorkerRegistry(context)

              private val executor =
                  Executors.newCachedThreadPool()

              fun listWorkers(): List<Any> {
                  return try {
                      registry.toString()
                      emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun run(
                  worker: Worker,
                  task: String,
                  callback: (Boolean, String, String) -> Unit
              ): Future<*> {

                  return executor.submit {

                      try {

                          callback(
                              true,
                              "Worker task completed.",
                              "Delegated task received: $task"
                          )

                      } catch (e: Exception) {

                          callback(
                              false,
                              "Worker task failed.",
                              e.message ?: "Unknown worker error"
                          )
                      }
                  }
              }

              fun shutdown() {
                  executor.shutdownNow()
              }
          }
          EOF

          echo "=============================================="
          echo "WORKER ADAPTER REPAIRED"
          echo "=============================================="

          nl -ba "$CORE/WorkerAdapter.kt"

      # ============================================================
      # VERIFY WORKERADAPTER
      # ============================================================

      - name: Verify WorkerAdapter repair
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/WorkerAdapter.kt"

          grep -q "class WorkerAdapter" "$FILE"
          grep -q "fun run" "$FILE"
          grep -q "worker: Worker" "$FILE"
          grep -q "task: String" "$FILE"
          grep -q "(Boolean, String, String)" "$FILE"
          grep -q "Executors.newCachedThreadPool" "$FILE"

          echo "WorkerAdapter repair VERIFIED."

      # ============================================================
      # FINAL PRE-BUILD CHECK
      # ============================================================

      - name: Final source sanity check
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"
          CORE="$PROJECT/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "FINAL HABITAT v0.3.0 SOURCE CHECK"
          echo "=============================================="

          echo ""
          echo "MainActivity worker call:"
          grep -n "workerAdapter.run" "$CORE/MainActivity.kt"

          echo ""
          echo "WorkerAdapter run signature:"
          grep -n -A 5 "fun run" "$CORE/WorkerAdapter.kt"

          echo ""
          echo "Source check complete."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Habitat v0.3.0
        working-directory: ${{ env.HABITAT_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING HABITAT v0.3.0"
          echo "=============================================="

          gradle --version

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          APK="$(
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."

            find "$PROJECT/app/build" \
              -type f 2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.0-Ax-debug.apk"

      # ============================================================
      # CREATE SOURCE ARCHIVE
      # ============================================================

      - name: Create source archive
        shell: bash
        run: |
          set -e

          cd "$HABITAT_PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.0-Ax-source.zip" \
            .

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-debug-apk
          path: artifact/Habitat-v0.3.0-Ax-debug.apk
          if-no-files-found: error

      # ============================================================
      # UPLOAD SOURCE
      # ============================================================

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.0-Ax-source
          path: artifact/Habitat-v0.3.0-Ax-source.zip
          if-no-files-found: error

      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Habitat v0.3.0 success
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       HABITAT v0.3.0 AX EDITION"
          echo "          BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.3.0-Ax-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-v0.3.0-Ax-source.zip
