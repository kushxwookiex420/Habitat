name: Habitat v0.3.2 Ax Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat v0.3.2 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            echo "Android SDK was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Extract Habitat v0.3.2 project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Habitat-Android-v0.3.2-Ax-Edition.zip"

          test -f "$ZIP"

          rm -rf HabitatBuild
          mkdir -p HabitatBuild

          unzip -q "$ZIP" -d HabitatBuild

          PROJECT_DIR="$(
            find HabitatBuild \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          test -n "$PROJECT_DIR"

          echo "HABITAT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "HABITAT PROJECT"
          echo "=============================================="
          echo "$PROJECT_DIR"

      - name: Verify Habitat v0.3.2 source
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"
          CORE="$PROJECT/app/src/main/java/com/habitat/core"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          test -f "$CORE/MainActivity.kt"
          test -f "$CORE/BrainAdapter.kt"
          test -f "$CORE/WorkerAdapter.kt"
          test -f "$CORE/WorkerRegistry.kt"
          test -f "$CORE/Models.kt"
          test -f "$CORE/TaskStore.kt"
          test -f "$CORE/HologramView.kt"
          test -f "$CORE/HabitatWidget.kt"

          echo "Habitat v0.3.2 source verified."

      - name: Inspect MainActivity worker call
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "MAIN ACTIVITY WORKER CALL"
          echo "=============================================="

          grep -n -C 12 "adapter.run" "$CORE/MainActivity.kt" || true

      - name: Repair MainActivity worker callback
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()

          callback_patterns = [
              "){res->",
              "){ res ->",
              ") {res->",
              ") { res ->",
          ]

          replacement = "){ok, text, detail ->"

          matched = None

          for pattern in callback_patterns:
              if pattern in source:
                  source = source.replace(
                      pattern,
                      replacement,
                      1
                  )
                  matched = pattern
                  break

          if matched is None:
              print("ERROR: Exact WorkerAdapter callback was not found.")

              worker_pos = source.find("adapter.run")

              if worker_pos < 0:
                  worker_pos = source.find("workerAdapter.run")

              if worker_pos < 0:
                  print("ERROR: WorkerAdapter run call was not found either.")
              else:
                  print("")
                  print("Relevant MainActivity source:")
                  print(
                      source[
                          max(0, worker_pos - 500):
                          min(len(source), worker_pos + 3000)
                      ]
                  )

              sys.exit(1)

          source = source.replace("res.ok", "ok")
          source = source.replace("res.text", "text")
          source = source.replace("res.detail", "detail")

          path.write_text(source)

          check = path.read_text()

          if "ok, text, detail ->" not in check:
              print("ERROR: Correct worker callback was not installed.")
              sys.exit(1)

          if "res.ok" in check:
              print("ERROR: res.ok still exists.")
              sys.exit(1)

          if "res.text" in check:
              print("ERROR: res.text still exists.")
              sys.exit(1)

          if "res.detail" in check:
              print("ERROR: res.detail still exists.")
              sys.exit(1)

          print("==============================================")
          print("MAIN ACTIVITY CALLBACK REPAIRED")
          print("==============================================")
          print(f"Matched pattern: {matched}")
          print("Callback: ok, text, detail")

          PY

      - name: Verify MainActivity repair
        shell: bash
        run: |
          set -e

          FILE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"

          echo "=============================================="
          echo "VERIFYING MAIN ACTIVITY"
          echo "=============================================="

          grep -n -C 8 "adapter.run" "$FILE" || true

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()

          worker_pos = source.find("adapter.run")

          if worker_pos < 0:
              worker_pos = source.find("workerAdapter.run")

          if worker_pos < 0:
              print("ERROR: WorkerAdapter run call was not found.")
              sys.exit(1)

          callback_pos = source.find(
              "ok, text, detail ->",
              worker_pos
          )

          if callback_pos < 0:
              print("ERROR: Correct worker callback was not found.")
              sys.exit(1)

          if "res.ok" in source:
              print("ERROR: res.ok remains.")
              sys.exit(1)

          if "res.text" in source:
              print("ERROR: res.text remains.")
              sys.exit(1)

          if "res.detail" in source:
              print("ERROR: res.detail remains.")
              sys.exit(1)

          print("MainActivity callback repair VERIFIED.")

          PY

      - name: Wire live Claude worker
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"
          MANIFEST="$HABITAT_PROJECT_DIR/app/src/main/AndroidManifest.xml"

          python3 - "$CORE/WorkerAdapter.kt" "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          worker_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])

          worker = r'''package com.habitat.core

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import java.util.concurrent.Future

          class WorkerAdapter(
              private val context: Context
          ) {

              private val registry = WorkerRegistry(context)
              private val executor = Executors.newCachedThreadPool()

              fun listWorkers(): List<Any> {
                  return try {
                      registry.toString()
                      emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun run(
                  worker: Worker,
                  task: String,
                  callback: (Boolean, String, String) -> Unit
              ): Future<*> {
                  return executor.submit {
                      try {
                          val url = URL("https://habitat-1-szzd.onrender.com/worker/claude")
                          val connection = url.openConnection() as HttpURLConnection
                          connection.requestMethod = "POST"
                          connection.connectTimeout = 15000
                          connection.readTimeout = 120000
                          connection.doOutput = true
                          connection.setRequestProperty("Content-Type", "application/json")

                          val payload = JSONObject().apply {
                              put("worker", worker.id)
                              put("task", task)
                          }.toString()

                          connection.outputStream.use { output ->
                              output.write(payload.toByteArray(Charsets.UTF_8))
                          }

                          val code = connection.responseCode
                          val stream = if (code in 200..299) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                          val body = stream?.bufferedReader()?.use { it.readText() } ?: ""
                          connection.disconnect()

                          val json = try { JSONObject(body) } catch (_: Exception) {
                              JSONObject()
                          }

                          if (code in 200..299 && json.optBoolean("ok", false)) {
                              val report = json.optString("response", "Claude returned an empty report.")
                              callback(true, report, "Claude worker completed the delegated mission.")
                          } else {
                              val error = json.optString("error", "Claude worker request failed.")
                              val detail = json.optString("details", "HTTP $code")
                              callback(false, error, detail)
                          }
                      } catch (e: Exception) {
                          callback(false, "Claude worker connection failed.", e.message ?: "Unknown worker error")
                      }
                  }
              }

              fun shutdown() {
                  executor.shutdownNow()
              }
          }
          '''

          worker_path.write_text(worker)

          manifest = manifest_path.read_text()
          if "android.permission.INTERNET" not in manifest:
              marker = "<manifest"
              start = manifest.find(marker)
              close = manifest.find(">", start)
              if start < 0 or close < 0:
                  print("ERROR: AndroidManifest.xml manifest tag not found.")
                  sys.exit(1)
              manifest = manifest[:close+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + manifest[close+1:]
              manifest_path.write_text(manifest)

          print("Live Claude worker wired.")
          PY

          grep -q 'https://habitat-1-szzd.onrender.com/worker/claude' "$CORE/WorkerAdapter.kt"
          grep -q 'android.permission.INTERNET' "$MANIFEST"

          echo "Claude worker endpoint: /worker/claude"

      - name: Verify repaired WorkerAdapter
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          grep -q "class WorkerAdapter" \
            "$CORE/WorkerAdapter.kt"

          grep -q "fun run" \
            "$CORE/WorkerAdapter.kt"

          grep -q "worker: Worker" \
            "$CORE/WorkerAdapter.kt"

          grep -q "task: String" \
            "$CORE/WorkerAdapter.kt"

          grep -q "(Boolean, String, String)" \
            "$CORE/WorkerAdapter.kt"

          grep -q "Executors.newCachedThreadPool" \
            "$CORE/WorkerAdapter.kt"

          echo "WorkerAdapter repair verified."

      - name: Repair Habitat v0.3.2 hologram and navigation UI
        shell: bash
        run: |
          set -e
          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"
          python3 - "$CORE/MainActivity.kt" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          NL=chr(10)
          if "import android.view.WindowInsets" not in s:
              s=s.replace("import android.view.View"+NL,"import android.view.View"+NL+"import android.view.WindowInsets"+NL)
          s=s.replace("override fun onCreate(b:Bundle?){super.onCreate(b);home()}", "override fun onCreate(b:Bundle?){" + NL + "  super.onCreate(b)" + NL + "  window.navigationBarColor=bg" + NL + "  window.statusBarColor=bg" + NL + "  home()" + NL + "}")
          s=s.replace("root.setPadding(dp(12),dp(12),dp(12),dp(8));", "root.setPadding(dp(12),dp(12),dp(12),dp(8))" + NL + "  root.setOnApplyWindowInsetsListener { v, insets ->" + NL + "   val navBottom = if(android.os.Build.VERSION.SDK_INT >= 30) insets.getInsets(WindowInsets.Type.navigationBars()).bottom else insets.systemWindowInsetBottom" + NL + "   v.setPadding(dp(12),dp(12),dp(12),dp(8)+navBottom)" + NL + "   insets" + NL + "  }" + NL + "  root.requestApplyInsets();")
          s=s.replace("v0.3.2","v0.3.2")
          p.write_text(s)
          gradle=Path(sys.argv[1]).parents[5] / "app" / "build.gradle.kts"
          if gradle.exists():
              g=gradle.read_text().replace('versionCode = 5, versionName = "0.3.0"','versionCode = 7, versionName = "0.3.2"')
              gradle.write_text(g)
          PY
          cat > "$CORE/HologramView.kt" <<'KT'
          package com.habitat.core

          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          class HologramView(context: Context): View(context) {
              private val p=Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val glow=Paint(Paint.ANTI_ALIAS_FLAG)
              private var phase=0f
              private var targetYaw=0f
              private var yaw=0f
              private var pulse=0f
              private var touchDown=false
              private val audrey: Bitmap = BitmapFactory.decodeResource(resources,R.drawable.ax_portrait)

              init {
                  setLayerType(View.LAYER_TYPE_SOFTWARE,null)
                  isClickable=true
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when(e.actionMasked){
                      MotionEvent.ACTION_DOWN -> {
                          touchDown=true
                          targetYaw=((e.x/width.toFloat())-.5f)*2.0f
                          pulse=1f
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          targetYaw=((e.x/width.toFloat())-.5f)*2.0f
                          pulse=1f
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          touchDown=false
                          targetYaw=0f
                          performClick()
                          return true
                      }
                  }
                  return true
              }

              override fun performClick(): Boolean {
                  super.performClick()
                  return true
              }

              private fun drawHoloPerson(c:Canvas,w:Float,h:Float,cx:Float,cy:Float){
                  if(audrey.isRecycled) return

                  val src=Rect(
                      (audrey.width*.31f).toInt(),
                      (audrey.height*.035f).toInt(),
                      (audrey.width*.99f).toInt(),
                      (audrey.height*.875f).toInt()
                  )

                  val scale=minOf((w*.54f)/src.width(),(h*.78f)/src.height())
                  val dw=src.width()*scale
                  val dh=src.height()*scale
                  val bob=sin(phase*.065f)*h*.006f
                  val yawEase=yaw
                  val width3d=dw*(.76f+.24f*abs(kotlin.math.cos(yawEase)))
                  val left=cx-width3d/2f
                  val top=cy-dh*.56f+bob

                  c.save()

                  // Volumetric depth: faint offset layers create a 3D scan-volume impression.
                  p.alpha=34
                  p.color=Color.rgb(40,190,255)
                  for(i in -3..3){
                      val depth=i*2.2f
                      val xShift=sin(yawEase)*depth
                      val r=RectF(left+xShift,top+depth*.18f,left+width3d+xShift,top+dh+depth*.18f)
                      c.drawBitmap(audrey,src,r,p)
                  }

                  // Main projected layer with animated horizontal compression/shear.
                  val skew=sin(yawEase)*.075f
                  val m=Matrix()
                  val srcPts=floatArrayOf(
                          src.left.toFloat(),src.top.toFloat(),
                          src.right.toFloat(),src.top.toFloat(),
                          src.right.toFloat(),src.bottom.toFloat(),
                          src.left.toFloat(),src.bottom.toFloat()
                  )
                  val dstPts=floatArrayOf(
                          left+dw*.10f,top,
                          left+width3d-dw*.10f+skew*dw,top,
                          left+width3d-dw*.03f-skew*dw,top+dh,
                          left+dw*.03f,top+dh
                  )
                  m.setPolyToPoly(srcPts,0,dstPts,0,4)

                  p.alpha=220
                  p.setShadowLayer(22f,0f,0f,Color.rgb(30,185,255))
                  c.drawBitmap(audrey,src,m,p)
                  p.clearShadowLayer()

                  // Cyan hologram veil.
                  glow.color=Color.argb(32,70,210,255)
                  glow.style=Paint.Style.FILL
                  c.drawRect(left,top,left+width3d,top+dh,glow)

                  c.restore()
              }

              override fun onDraw(c:Canvas){
                  super.onDraw(c)
                  val w=width.toFloat()
                  val h=height.toFloat()
                  val cx=w/2f
                  val cy=h*.46f

                  c.drawColor(Color.rgb(4,8,15))

                  yaw += (targetYaw-yaw)*.12f
                  if(!touchDown) targetYaw*=.94f
                  pulse*=.90f

                  // Holographic portal.
                  p.style=Paint.Style.STROKE
                  p.strokeWidth=2f
                  p.color=Color.rgb(40,160,230)
                  p.setShadowLayer(14f,0f,0f,Color.rgb(30,170,255))
                  c.drawOval(cx-w*.30f,cy-h*.40f,cx+w*.30f,cy+h*.40f,p)
                  c.drawOval(cx-w*.23f,cy-h*.33f,cx+w*.23f,cy+h*.33f,p)
                  p.clearShadowLayer()

                  drawHoloPerson(c,w,h,cx,cy)

                  // Moving depth rings / projector base.
                  p.strokeWidth=3f
                  p.color=Color.rgb(45,195,255)
                  p.setShadowLayer(16f+18f*pulse,0f,0f,Color.rgb(45,195,255))
                  val ring=h*.80f+sin(phase*.08f)*3f
                  c.drawOval(cx-w*.27f,ring,cx+w*.27f,ring+h*.095f,p)
                  p.strokeWidth=1.5f
                  c.drawOval(cx-w*.19f,ring+h*.025f,cx+w*.19f,ring+h*.075f,p)
                  p.clearShadowLayer()

                  // Scan field and animated particles.
                  p.strokeWidth=1f
                  p.color=Color.argb(95,55,135,190)
                  for(y in 0 until height step 8){
                      val off=sin((y+phase)*.055f)*3f
                      c.drawLine(0f,y.toFloat(),w,y.toFloat()+off,p)
                  }

                  p.style=Paint.Style.FILL
                  p.color=Color.argb(150,115,225,255)
                  for(i in 0..11){
                      val px=cx+sin(phase*.018f+i*1.71f)*w*.24f
                      val py=cy+h*.32f+sin(phase*.027f+i*.83f)*h*.22f
                      val r=1.2f+abs(sin(phase*.05f+i))*1.8f
                      c.drawCircle(px,py,r,p)
                  }

                  p.color=Color.rgb(170,235,255)
                  p.textAlign=Paint.Align.CENTER
                  p.textSize=14f
                  c.drawText(if(touchDown) "AX • INTERACTIVE HOLOGRAM" else "AX • AUDREY 3D HOLOGRAM",cx,h*.95f,p)

                  phase+=1.15f
                  postInvalidateDelayed(32)
              }
          }
          KT
      - name: Pre-build Kotlin sanity check
        shell: bash
        run: |
          set -e

          CORE="$HABITAT_PROJECT_DIR/app/src/main/java/com/habitat/core"

          echo "=============================================="
          echo "KOTLIN SOURCE SANITY CHECK"
          echo "=============================================="

          for file in \
            MainActivity.kt \
            BrainAdapter.kt \
            WorkerAdapter.kt \
            WorkerRegistry.kt \
            Models.kt \
            TaskStore.kt \
            HologramView.kt \
            HabitatWidget.kt
          do
            test -f "$CORE/$file"
            echo "OK: $file"
          done

          echo ""
          echo "Checking repaired worker callback..."

          python3 - "$CORE/MainActivity.kt" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()

          worker_pos = source.find("adapter.run")

          if worker_pos < 0:
              worker_pos = source.find("workerAdapter.run")

          if worker_pos < 0:
              print("ERROR: WorkerAdapter run call is missing.")
              sys.exit(1)

          callback_pos = source.find(
              "ok, text, detail ->",
              worker_pos
          )

          if callback_pos < 0:
              print("ERROR: Worker callback is missing.")
              sys.exit(1)

          print("Worker callback is structurally valid.")

          PY

      - name: Build Habitat v0.3.2
        working-directory: ${{ env.HABITAT_PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING HABITAT v0.3.2"
          echo "=============================================="

          gradle --version

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          PROJECT="$HABITAT_PROJECT_DIR"

          APK="$(
            find "$PROJECT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "=============================================="
          echo "APK FOUND"
          echo "=============================================="

          echo "$APK"

          mkdir -p artifact

          cp "$APK" \
            artifact/Habitat-v0.3.2-Ax-debug.apk

      - name: Create source archive
        shell: bash
        run: |
          set -e

          cd "$HABITAT_PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-v0.3.2-Ax-source.zip" \
            .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.2-Ax-debug-apk
          path: artifact/Habitat-v0.3.2-Ax-debug.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.2-Ax-source
          path: artifact/Habitat-v0.3.2-Ax-source.zip
          if-no-files-found: error

      - name: Habitat v0.3.2 success
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       HABITAT v0.3.2 AX EDITION"
          echo "          BUILD SUCCESSFUL"
          echo "================================================"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-v0.3.2-Ax-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-v0.3.2-Ax-source.zip
