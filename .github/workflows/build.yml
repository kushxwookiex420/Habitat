name: Habitat v0.8 APK
run-name: Habitat APK Build — ${{ github.ref_name }} / ${{ github.sha }}

on:
  push:
    branches: [ main, ax-v0.6-real-brain, ax-v0.6-brain-identity, ax-v0.7-droppilot-operator, ax-task-orchestration-fix ]
  workflow_dispatch:

# Ax build trigger verified: every main push packages a fresh debug APK.
# Ax artifact verification: upload the APK and publish the latest release on every build.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Locate Android SDK
        run: |
          set -e
          for SDK in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            if [ -n "$SDK" ] && [ -d "$SDK" ]; then
              echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
              echo "$SDK/platform-tools" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "Android SDK not found"; exit 1
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"; fi
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace
      - name: Package
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/Habitat-v0.8-Ax-debug.apk
          ls -lh artifact/*
      - uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.8-Ax-debug-apk
          path: artifact/Habitat-v0.7-Ax-debug.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="habitat-v0.8-latest"
          TITLE="Habitat v0.8 Ax — Latest APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/Habitat-v0.7-Ax-debug.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "Latest verified Habitat v0.7 Ax debug APK. Built from main commit $GITHUB_SHA."
          else
            gh release create "$TAG" artifact/Habitat-v0.7-Ax-debug.apk --title "$TITLE" --notes "Latest verified Habitat v0.7 Ax debug APK. Built from main commit $GITHUB_SHA."
          fi
