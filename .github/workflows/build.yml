      - name: Update Android manifest
        shell: bash
        run: |
          set -e

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest#<manifest\n    <uses-permission android:name="android.permission.INTERNET" />#' "$MANIFEST"
          fi

          echo "Manifest updated."

      - name: Build Habitat APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="$(find . -type f -path '*/build/outputs/apk/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            find . -type f | sort | tail -n 100
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifact/Habitat-1.0-Ax-Core-debug.apk"

      - name: Package Habitat source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          zip -qr \
            "$GITHUB_WORKSPACE/artifact/Habitat-1.0-Ax-Core-source.zip" \
            .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-1.0-Ax-Core-debug-apk
          path: artifact/Habitat-1.0-Ax-Core-debug.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-1.0-Ax-Core-source
          path: artifact/Habitat-1.0-Ax-Core-source.zip
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo " HABITAT 1.0 AX CORE BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "APK:"
          ls -lh artifact/Habitat-1.0-Ax-Core-debug.apk
          echo ""
          echo "SOURCE:"
          ls -lh artifact/Habitat-1.0-Ax-Core-source.zip
          echo ""
          echo "Ready for download from Actions artifacts."
