            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(12)
            }
        )

        install(screen)
    }

    private fun statusTextOrCreate(
        parent: LinearLayout
    ): TextView {

        if (::statusText.isInitialized) {
            return statusText
        }

        statusText =
            text(
                brainStatus(),
                13f,
                brainColor(),
                true
            )

        parent.addView(
            statusText,
            1
        )

        return statusText
    }

