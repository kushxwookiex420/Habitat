name: Habitat Audrey Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Habitat
        run: |
          rm -rf habitat-project
          unzip -q Habitat-Android-Project.zip -d habitat-project

          if [ ! -d "habitat-project/HabitatAndroid" ]; then
            echo "HabitatAndroid project folder not found"
            exit 1
          fi

          echo "PROJECT_DIR=habitat-project/HabitatAndroid" >> "$GITHUB_ENV"
          echo "APP_DIR=habitat-project/HabitatAndroid/app" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          echo "Checking Habitat project..."

          ls -la "$PROJECT_DIR"
          ls -la "$APP_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          if [ ! -f "$APP_DIR/src/main/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml not found"
            exit 1
          fi

          echo "Android project verified."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Audrey workstation
        run: |
          RES_DIR="$APP_DIR/src/main/res"

          mkdir -p "$RES_DIR/drawable-nodpi"

          if [ ! -f "lucia.png" ]; then
            echo "ERROR: lucia.png is missing from repository root."
            echo "Upload the Lucia image as lucia.png."
            exit 1
          fi

          cp lucia.png "$RES_DIR/drawable-nodpi/lucia.png"

          echo "================================"
          echo "AUDREY WORKSTATION INSTALLED"
          echo "LUCIA IMAGE LOADED"
          echo "================================"

      - name: Create Audrey Brain
        run: |
          MAIN="habitat-project/HabitatAndroid/app/src/main/java/com/habitat/core/MainActivity.kt"
          MAIN_DIR=$(dirname "$MAIN")

          mkdir -p "$MAIN_DIR"

          cat > "$MAIN_DIR/AudreyBrain.kt" <<'EOF'
package com.habitat.core

import android.content.Context
import org.json.JSONArray
import org.json.JSONObject

class AudreyBrain(private val context: Context) {

    private val prefs =
        context.getSharedPreferences(
            "audrey_brain",
            Context.MODE_PRIVATE
        )

    fun remember(role: String, message: String) {

        val raw =
            prefs.getString("memory", "[]") ?: "[]"

        val array =
            try {
                JSONArray(raw)
            } catch (e: Exception) {
                JSONArray()
            }

        val item = JSONObject()

        item.put("role", role)
        item.put("message", message)
        item.put("time", System.currentTimeMillis())

        array.put(item)

        while (array.length() > 150) {
            array.remove(0)
        }

        prefs.edit()
            .putString("memory", array.toString())
            .apply()
    }

    fun memoryCount(): Int {
        val raw =
            prefs.getString("memory", "[]") ?: "[]"

        return try {
            JSONArray(raw).length()
        } catch (e: Exception) {
            0
        }
    }

    fun respond(message: String): String {

        remember("user", message)

        val text =
            message.trim().lowercase()

        val response = when {

            text.contains("hello") ||
            text.contains("hi") ||
            text.contains("hey") ->
                "Hey. Audrey is online. Habitat is ready."

            text.contains("who are you") ->
                "I'm Audrey — the companion interface living inside Habitat."

            text.contains("status") ->
                "Habitat online. Memory online. Brain adapter online. AI backend connection ready."

            text.contains("remember") ->
                "Local persistent memory is active."

            text.contains("brain") ->
                "Brain adapter online."

            text.contains("habitat") ->
                "Habitat is my environment. This workstation is my interface."

            else ->
                "I'm listening. The local brain received that message."
        }

        remember("assistant", response)

        return response
    }
}
EOF

      - name: Create Audrey Interface
        run: |
          MAIN="habitat-project/HabitatAndroid/app/src/main/java/com/habitat/core/MainActivity.kt"

          cat > "$MAIN" <<'EOF'
