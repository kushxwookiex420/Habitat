    private val prefs by lazy {
        getSharedPreferences("habitat", Context.MODE_PRIVATE)
    }

    private val brainAdapter by lazy {
        BrainAdapter(this)
    }

    private val bg = Color.rgb(5, 8, 13)
    private val panel = Color.rgb(13, 18, 27)
    private val panel2 = Color.rgb(18, 24, 35)
    private val border = Color.rgb(35, 48, 67)
    private val white = Color.WHITE
    private val muted = Color.rgb(145, 158, 178)
    private val accent = Color.rgb(76, 190, 255)
    private val green = Color.rgb(100, 220, 155)
    private val orange = Color.rgb(255, 190, 90)

    private lateinit var root: LinearLayout
    private lateinit var content: LinearLayout
    private lateinit var statusText: TextView

    private fun dp(value: Int): Int =
        (value * resources.displayMetrics.density).toInt()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        configureWindow()
        showHome()
    }

    override fun onDestroy() {
        brainAdapter.shutdown()
        super.onDestroy()
    }

    private fun configureWindow() {
        window.statusBarColor = bg
        window.navigationBarColor = bg

        if (android.os.Build.VERSION.SDK_INT >= 30) {
            window.setDecorFitsSystemWindows(false)

            window.insetsController?.setSystemBarsAppearance(
                0,
                WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or
                        WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
            )
        }
    }

    private fun createRoot(): LinearLayout {
        return LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(bg)
            setPadding(
                dp(16),
                dp(14),
                dp(16),
                dp(8)
            )

            if (android.os.Build.VERSION.SDK_INT >= 30) {
                setOnApplyWindowInsetsListener { view, insets ->

                    val bars =
                        insets.getInsets(
                            WindowInsets.Type.systemBars()
                        )

                    view.setPadding(
                        dp(16),
                        bars.top + dp(14),
                        dp(16),
                        bars.bottom + dp(8)
                    )

                    insets
                }
            }
        }
    }

    private fun text(
        value: String,
        size: Float = 14f,
        color: Int = white,
        bold: Boolean = false
    ): TextView {
        return TextView(this).apply {
            this.text = value
            textSize = size
            setTextColor(color)

            if (bold) {
                typeface = Typeface.DEFAULT_BOLD
            }
        }
    }

    private fun rounded(
        color: Int,
        radius: Int = 16
    ): GradientDrawable {
        return GradientDrawable().apply {
            setColor(color)
            cornerRadius = dp(radius).toFloat()
            setStroke(dp(1), border)
        }
    }

    private fun actionButton(
        title: String,
        action: () -> Unit
    ): Button {
        return Button(this).apply {
            text = title
            textSize = 12f
            setTextColor(white)
            typeface = Typeface.DEFAULT_BOLD

            background = rounded(panel2, 12)

            minHeight = dp(48)
            minimumHeight = dp(48)

            setPadding(
                dp(10),
                dp(4),
                dp(10),
                dp(4)
            )

            setOnClickListener {
                action()
            }
        }
    }

    private fun install(screen: LinearLayout) {

        root = screen

        content = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }

        root.addView(
            content,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val nav = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER
            setPadding(0, dp(6), 0, dp(2))
        }

        val items = listOf(
            "HOME",
            "PROJECTS",
            "BRAIN",
            "AGENTS",
            "MORE"
        )

        items.forEach { item ->

            nav.addView(
                actionButton(item) {

                    when (item) {

                        "HOME" ->
                            showHome()

                        "PROJECTS" ->
                            showProjects()

                        "BRAIN" ->
                            showBrain()

                        "AGENTS" ->
                            showAgents()

                        "MORE" ->
                            showMore()
                    }
                },
                LinearLayout.LayoutParams(
                    0,
                    dp(50),
                    1f
                ).apply {
                    marginStart = dp(3)
                    marginEnd = dp(3)
                }
            )
        }

        root.addView(
            nav,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )

        setContentView(root)
    }

    private fun header(
        title: String,
        subtitle: String
