name: Habitat Audrey Command Center

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Habitat project
        run: |
          mkdir -p extracted
          unzip -o Habitat-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install Audrey Command Center
        run: |
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/habitat/core/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          cat > "$MAIN_FILE" <<'KOTLIN'
          package com.habitat.core

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.graphics.drawable.GradientDrawable
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var log: TextView
              private val history = mutableListOf<Pair<String, String>>()

              private fun now() =
                  SimpleDateFormat(
                      "HH:mm:ss",
                      Locale.US
                  ).format(Date())

              private fun panelBackground(): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.rgb(18, 21, 30))
                      cornerRadius = 28f
                      setStroke(
                          2,
                          Color.rgb(45, 70, 95)
                      )
                  }
              }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor =
                      Color.rgb(5, 7, 12)

                  window.navigationBarColor =
                      Color.rgb(5, 7, 12)

                  val root =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL

                          setPadding(
                              24,
                              28,
                              24,
                              20
                          )

                          setBackgroundColor(
                              Color.rgb(5, 7, 12)
                          )
                      }

                  val header =
                      TextView(this).apply {
                          text = "H A B I T A T"
                          textSize = 25f
                          typeface =
                              Typeface.DEFAULT_BOLD

                          setTextColor(
                              Color.WHITE
                          )

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              0,
                              8,
                              0,
                              2
                          )
                      }

                  status =
                      TextView(this).apply {
                          text =
                              "●  AUDREY // ONLINE"

                          textSize = 13f

                          setTextColor(
                              Color.rgb(
                                  100,
                                  230,
                                  170
                              )
                          )

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              0,
                              4,
                              0,
                              18
                          )
                      }

                  val audreyPanel =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.CENTER

                          background =
                              panelBackground()

                          setPadding(
                              20,
                              26,
                              20,
                              26
                          )
                      }

                  val audreyLabel =
                      TextView(this).apply {
                          text =
                              "AUDREY"

                          textSize = 18f

                          typeface =
                              Typeface.DEFAULT_BOLD

                          setTextColor(
                              Color.rgb(
                                  180,
                                  220,
                                  255
                              )
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  val visual =
                      TextView(this).apply {
                          text =
                              "◈\n\nAUDREY VISUAL CORE\n\nREADY"

                          textSize = 22f

                          setTextColor(
                              Color.rgb(
                                  125,
                                  190,
                                  255
                              )
                          )

                          gravity =
                              Gravity.CENTER

                          setPadding(
                              10,
                              35,
                              10,
                              35
                          )
                      }

                  val visualInfo =
                      TextView(this).apply {
                          text =
                              "FUTURISTIC COMPANION INTERFACE"

                          textSize = 10f

                          setTextColor(
                              Color.rgb(
                                  110,
                                  125,
                                  145
                              )
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  audreyPanel.addView(
                      audreyLabel
                  )

                  audreyPanel.addView(
                      visual,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  audreyPanel.addView(
                      visualInfo
                  )

                  root.addView(
                      header
                  )

                  root.addView(
                      status
                  )

                  root.addView(
                      audreyPanel,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1.0f
                      )
                  )

                  val chatTitle =
                      TextView(this).apply {
                          text =
                              "  HABITAT LINK"

                          textSize = 12f

                          setTextColor(
                              Color.rgb(
                                  120,
                                  145,
                                  170
                              )
                          )

                          setPadding(
                              0,
                              14,
                              0,
                              6
                          )
                      }

                  root.addView(
                      chatTitle
                  )

                  val input =
                      EditText(this).apply {
                          hint =
                              "Talk to Audrey..."

                          setHintTextColor(
                              Color.rgb(
                                  100,
                                  105,
                                  115
                              )
                          )

                          setTextColor(
                              Color.WHITE
                          )

                          setSingleLine(false)

                          imeOptions =
                              EditorInfo.IME_ACTION_SEND

                          inputType =
                              android.text.InputType.TYPE_CLASS_TEXT or
                              android.text.InputType.TYPE_TEXT_FLAG_CAP_SENTENCES or
                              android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE

                          background =
                              panelBackground()

                          setPadding(
                              20,
                              12,
                              20,
                              12
                          )
                      }

                  val send =
                      Button(this).apply {
                          text = "SEND"

                          setTextColor(
                              Color.WHITE
                          )
                      }

                  val row =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.HORIZONTAL
                      }

                  row.addView(
                      input,
                      LinearLayout.LayoutParams(
                          0,
                          110,
                          1f
                      )
                  )

                  row.addView(
                      send,
                      LinearLayout.LayoutParams(
                          125,
                          110
                      )
                  )

                  root.addView(row)

                  val scroll =
                      ScrollView(this).apply {
                          setBackgroundColor(
                              Color.TRANSPARENT
                          )
                      }

                  log =
                      TextView(this).apply {
                          text =
                              "HABITAT CORE READY\n"

                          textSize = 13f

                          setTextColor(
                              Color.LTGRAY
                          )

                          setPadding(
                              8,
                              10,
                              8,
                              10
                          )
                      }

                  scroll.addView(log)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          -1,
                          130
                      )
                  )

                  setContentView(root)

                  val sendMessage = {

                      val msg =
                          input.text
                              .toString()
                              .trim()

                      if (msg.isNotEmpty()) {

                          input.text.clear()

                          send.isEnabled =
                              false

                          status.text =
                              "●  AUDREY // THINKING..."

                          status.setTextColor(
                              Color.rgb(
                                  255,
                                  205,
                                  90
                              )
                          )

                          log.text =
                              "${log.text}\n[${
                                  now()
                              }] YOU: $msg\nAUDREY: Thinking..."

                          thread {

                              val result =
                                  askAudrey(msg)

                              runOnUiThread {

                                  send.isEnabled =
                                      true

                                  if (
                                      result.startsWith(
                                          "ERROR:"
                                      )
                                  ) {

                                      status.text =
                                          "●  BRAIN LINK ERROR"

                                      status.setTextColor(
                                          Color.rgb(
                                              255,
                                              100,
                                              100
                                          )
                                      )

                                  } else {

                                      status.text =
                                          "●  AUDREY // ONLINE"

                                      status.setTextColor(
                                          Color.rgb(
                                              100,
                                              230,
                                              170
                                          )
                                      )

                                      history.add(
                                          msg to result
                                      )
                                  }

                                  log.text =
                                      "${log.text}\nAUDREY: $result\n"

                                  scroll.post {
                                      scroll.fullScroll(
                                          ScrollView.FOCUS_DOWN
                                      )
                                  }

                                  val imm =
                                      getSystemService(
                                          Context.INPUT_METHOD_SERVICE
                                      ) as InputMethodManager

                                  imm.hideSoftInputFromWindow(
                                      input.windowToken,
                                      0
                                  )
                              }
                          }
                      }
                  }

                  send.setOnClickListener {
                      sendMessage()
                  }

                  input.setOnEditorActionListener {
                      _,
                      actionId,
                      event ->

                      val enterPressed =
                          event != null &&
                          event.keyCode ==
                          KeyEvent.KEYCODE_ENTER &&
                          event.action ==
                          KeyEvent.ACTION_DOWN

                      if (
                          actionId ==
                          EditorInfo.IME_ACTION_SEND ||
                          enterPressed
                      ) {
                          sendMessage()
                          true
                      } else {
                          false
                      }
                  }
              }

              private fun askAudrey(
                  message: String
              ): String {

                  return try {

                      val url =
                          URL(
                              "https://habitat-cr46.onrender.com/chat"
                          )

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod =
                          "POST"

                      connection.connectTimeout =
                          20000

                      connection.readTimeout =
                          60000

                      connection.doOutput =
                          true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.setRequestProperty(
                          "Accept",
                          "application/json"
                      )

                      val historyJson =
                          JSONArray()

                      history.takeLast(20)
                          .forEach { pair ->

                              val item =
                                  JSONObject()

                              item.put(
                                  "user",
                                  pair.first
                              )

                              item.put(
                                  "assistant",
                                  pair.second
                              )

                              historyJson.put(
                                  item
                              )
                          }

                      val body =
                          JSONObject()

                      body.put(
                          "message",
                          message
                      )

                      body.put(
                          "history",
                          historyJson
                      )

                      connection.outputStream
                          .use { output ->

                              output.write(
                                  body.toString()
                                      .toByteArray(
                                          Charsets.UTF_8
                                      )
                              )
                          }

                      val responseCode =
                          connection.responseCode

                      val stream =
                          if (
                              responseCode in
                              200..299
                          ) {
                              connection.inputStream
                          } else {
                              connection.errorStream
                          }

                      val responseText =
                          stream
                              ?.bufferedReader()
                              ?.use {
                                  it.readText()
                              }
                              ?: ""

                      connection.disconnect()

                      if (
                          responseCode !in
                          200..299
                      ) {
                          return "ERROR: Brain returned HTTP $responseCode"
                      }

                      val json =
                          JSONObject(
                              responseText
                          )

                      json.optString(
                          "response",
                          "ERROR: Audrey returned no response."
                      )

                  } catch (e: Exception) {

                      "ERROR: ${
                          e.message
                              ?: "Unable to reach Habitat brain."
                      }"
                  }
              }
          }
          KOTLIN

          python3 - "$MANIFEST" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = '<application'

              if marker in text:
                  text = text.replace(
                      marker,
                      permission + '\n\n    ' + marker,
                      1
                  )
              else:
                  text = text.replace(
                      '<manifest',
                      '<manifest\n    ' + permission,
                      1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("SUCCESS: Internet permission enabled.")
          PY

      - name: Build Habitat
        run: |
          cd "$PROJECT_DIR"
          echo "Building Habitat Audrey Command Center..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Habitat APK
        uses: actions/upload-artifact@v4
        with:
          name: Habitat-Audrey-Command-Center
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
