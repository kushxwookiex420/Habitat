name: Habitat v0.3.3 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Package source
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/Habitat-v0.3.3-Ax-debug.apk
          zip -qr artifact/Habitat-v0.3.3-Ax-source.zip . -x ".git/*" "artifact/*"
      - uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.3-Ax-debug-apk
          path: artifact/Habitat-v0.3.3-Ax-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Habitat-v0.3.3-Ax-source
          path: artifact/Habitat-v0.3.3-Ax-source.zip
