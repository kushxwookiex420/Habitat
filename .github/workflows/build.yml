    private fun brainStatus(): String {

        return if (
            brainAdapter.endpoint().isBlank()
        ) {
            "● AX CORE  •  LOCAL SHELL  •  BRAIN NOT CONNECTED"
        } else {
            "● AX CORE  •  ENDPOINT READY"
        }
    }

    private fun brainColor(): Int {

        return if (
            brainAdapter.endpoint().isBlank()
        ) {
            orange
        } else {
            green
        }
    }

    private fun showChat() {

        val screen = createRoot()

        screen.addView(
            header(
                "AX",
                "DIRECT COMMAND INTERFACE"
            )
        )

        val log =
            ScrollView(this)

        val messages =
            LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(
                    0,
                    dp(12),
                    0,
                    dp(8)
                )
            }

        messages.addView(
            message(
                "AX",
                "Habitat command interface online. What's the mission?",
                false
            )
        )

        log.addView(messages)

        screen.addView(
            log,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val input =
            EditText(this).apply {

                hint = "Command Ax..."

                setHintTextColor(muted)
                setTextColor(white)

                textSize = 15f

                singleLine = false

                background =
                    rounded(panel)

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        screen.addView(
            input,
            LinearLayout.LayoutParams(
                -1,
                dp(60)
            ).apply {
                bottomMargin = dp(7)
            }
        )

        val send =
            actionButton("SEND") {

                val command =
                    input.text
                        .toString()
                        .trim()

                if (command.isEmpty()) {
                    return@actionButton
                }

                messages.addView(
                    message(
                        "YOU",
                        command,
                        true
                    )
                )

                input.text.clear()

                log.post {
                    log.fullScroll(
                        View.FOCUS_DOWN
                    )
                }

                if (
                    brainAdapter.endpoint().isBlank()
                ) {

                    messages.addView(
                        message(
                            "AX",
                            "Command saved locally. Connect a brain endpoint from Brain before I can send it to an external AI service.",
                            false
                        )
                    )

                } else {

                    messages.addView(
                        message(
                            "AX",
                            "Connecting to brain...",
                            false
                        )
                    )

                    brainAdapter.send(command) { result ->

                        runOnUiThread {

                            messages.addView(
                                message(
                                    "AX",
                                    result.text,
                                    false
                                )
                            )

                            log.post {
                                log.fullScroll(
                                    View.FOCUS_DOWN
                                )
                            }
                        }
                    }
                }
            }

        screen.addView(
            send,
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            )
        )

        install(screen)
    }

    private fun message(
        who: String,
        body: String,
        user: Boolean
    ): TextView {

        return text(
            "$who\n$body",
            14f,
            white
        ).apply {

            background =
                rounded(
                    if (user)
                        Color.rgb(22, 45, 65)
                    else
                        panel
                )

            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                    bottomMargin = dp(5)
                }
        }
    }

