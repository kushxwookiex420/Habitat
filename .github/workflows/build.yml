name: Habitat 1.0 - Ax Core Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Habitat 1.0 Ax Core
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # FIND SOURCE ZIP
      # ============================================================

      - name: Find Habitat Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for file in \
            "./Habitat-Android-v0.2.2-Ax-Edition-2.zip" \
            "./Habitat-Android-v0.2.2-Ax-Edition.zip" \
            "./Habitat-Android-Project.zip"
          do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No Android source ZIP found."
            exit 1
          fi

          echo "ZIP=$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract Habitat
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

      # ============================================================
      # LOCATE PROJECT
      # ============================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDK" --licenses || true

          "$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # CREATE HABITAT CORE SOURCE
      # ============================================================

      - name: Install Habitat 1.0 source
        shell: bash
        run: |

          set -e

          SRC="$PROJECT_DIR/app/src/main/java/com/habitat/core"

          mkdir -p "$SRC"

          # --------------------------------------------------------
          # MainActivity.kt
          # --------------------------------------------------------

          cat > "$SRC/MainActivity.kt" <<'KOTLIN'

package com.habitat.core

import android.app.Activity
import android.content.Context
import android.graphics.Color
import android.graphics.Typeface
import android.graphics.drawable.GradientDrawable
import android.os.Bundle
import android.view.Gravity
import android.view.KeyEvent
import android.view.View
import android.view.WindowInsets
import android.view.WindowInsetsController
import android.view.inputmethod.EditorInfo
import android.widget.*
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

class MainActivity : Activity() {

    private val store by lazy {
        HabitatStore(this)
    }

    private val brain by lazy {
        BrainAdapter(this)
    }

    private lateinit var root: LinearLayout
    private lateinit var content: LinearLayout

    private val background = Color.rgb(4, 7, 12)
    private val panel = Color.rgb(12, 17, 25)
    private val panel2 = Color.rgb(18, 25, 36)
    private val line = Color.rgb(36, 49, 68)
    private val text = Color.WHITE
    private val muted = Color.rgb(145, 158, 178)
    private val cyan = Color.rgb(80, 195, 255)
    private val green = Color.rgb(100, 220, 155)
    private val orange = Color.rgb(255, 190, 90)
    private val red = Color.rgb(255, 105, 105)

    private fun dp(v: Int): Int =
        (v * resources.displayMetrics.density).toInt()

    override fun onCreate(state: Bundle?) {
        super.onCreate(state)

        configureWindow()
        showHome()
    }

    override fun onDestroy() {
        brain.shutdown()
        super.onDestroy()
    }

    private fun configureWindow() {

        window.statusBarColor = background
        window.navigationBarColor = background

        if (android.os.Build.VERSION.SDK_INT >= 30) {

            window.setDecorFitsSystemWindows(false)

            window.insetsController?.setSystemBarsAppearance(
                0,
                WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or
                    WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
            )
        }
    }

    private fun makeRoot(): LinearLayout {

        return LinearLayout(this).apply {

            orientation = LinearLayout.VERTICAL

            setBackgroundColor(background)

            setPadding(
                dp(16),
                dp(12),
                dp(16),
                dp(8)
            )

            if (android.os.Build.VERSION.SDK_INT >= 30) {

                setOnApplyWindowInsetsListener { view, insets ->

                    val bars =
                        insets.getInsets(
                            WindowInsets.Type.systemBars()
                        )

                    view.setPadding(
                        dp(16),
                        bars.top + dp(12),
                        dp(16),
                        bars.bottom + dp(8)
                    )

                    insets
                }
            }
        }
    }

    private fun panelBackground(
        color: Int = panel,
        radius: Int = 16
    ): GradientDrawable {

        return GradientDrawable().apply {

            setColor(color)

            cornerRadius =
                dp(radius).toFloat()

            setStroke(
                dp(1),
                line
            )
        }
    }

    private fun label(
        value: String,
        size: Float = 14f,
        color: Int = text,
        bold: Boolean = false
    ): TextView {

        return TextView(this).apply {

            this.text = value

            textSize = size

            setTextColor(color)

            if (bold) {
                typeface = Typeface.DEFAULT_BOLD
            }
        }
    }

    private fun button(
        title: String,
        action: () -> Unit
    ): Button {

        return Button(this).apply {

            text = title

            textSize = 12f

            setTextColor(text)

            typeface = Typeface.DEFAULT_BOLD

            background =
                panelBackground(
                    panel2,
                    12
                )

            minHeight = dp(48)

            minimumHeight = dp(48)

            setPadding(
                dp(8),
                dp(2),
                dp(8),
                dp(2)
            )

            setOnClickListener {
                action()
            }
        }
    }

    private fun header(
        title: String,
        subtitle: String
    ): LinearLayout {

        return LinearLayout(this).apply {

            orientation = LinearLayout.VERTICAL

            addView(
                label(
                    title,
                    28f,
                    text,
                    true
                )
            )

            addView(
                label(
                    subtitle,
                    11f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(3)
                }
            )
        }
    }

    private fun install(
        screen: LinearLayout
    ) {

        root = screen

        content =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL
            }

        root.addView(
            content,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val navigation =
            LinearLayout(this).apply {

                orientation =
                    LinearLayout.HORIZONTAL

                gravity =
                    Gravity.CENTER

                setPadding(
                    0,
                    dp(5),
                    0,
                    dp(3)
                )
            }

        listOf(
            "HOME",
            "PROJECTS",
            "BRAIN",
            "AGENTS",
            "MORE"
        ).forEach { name ->

            navigation.addView(
                button(name) {

                    when (name) {

                        "HOME" ->
                            showHome()

                        "PROJECTS" ->
                            showProjects()

                        "BRAIN" ->
                            showBrain()

                        "AGENTS" ->
                            showAgents()

                        "MORE" ->
                            showMore()
                    }

                },
                LinearLayout.LayoutParams(
                    0,
                    dp(50),
                    1f
                ).apply {

                    marginStart = dp(3)
                    marginEnd = dp(3)
                }
            )
        }

        root.addView(
            navigation,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )

        setContentView(root)
    }

    private fun statusLine(): String {

        return if (
            brain.endpoint().isBlank()
        ) {
            "● AX CORE   LOCAL   BRAIN OFFLINE"
        } else {
            "● AX CORE   BRAIN ENDPOINT READY"
        }
    }

    private fun statusColor(): Int {

        return if (
            brain.endpoint().isBlank()
        ) {
            orange
        } else {
            green
        }
    }

    private fun card(
        title: String,
        state: String,
        description: String
    ): LinearLayout {

        return LinearLayout(this).apply {

            orientation =
                LinearLayout.VERTICAL

            background =
                panelBackground()

            setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            val row =
                LinearLayout(this@MainActivity).apply {

                    orientation =
                        LinearLayout.HORIZONTAL
                }

            row.addView(
                label(
                    title,
                    15f,
                    text,
                    true
                ),
                LinearLayout.LayoutParams(
                    0,
                    -2,
                    1f
                )
            )

            row.addView(
                label(
                    state,
                    13f,
                    cyan,
                    true
                )
            )

            addView(row)

            addView(
                label(
                    description,
                    11f,
                    muted
                ),
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                }
            )

            layoutParams =
                LinearLayout.LayoutParams(
                    -1,
                    dp(78)
                ).apply {
                    bottomMargin = dp(8)
                }
        }
    }

    private fun showHome() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "HABITAT",
                "AX INTELLIGENCE ENVIRONMENT"
            )
        )

        screen.addView(
            label(
                statusLine(),
                12f,
                statusColor(),
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(10)
                bottomMargin = dp(10)
            }
        )

        val core =
            LinearLayout(this).apply {

                orientation =
                    LinearLayout.VERTICAL

                background =
                    panelBackground()

                setPadding(
                    dp(18),
                    dp(18),
                    dp(18),
                    dp(18)
                )
            }

        core.addView(
            label(
                "AX CORE",
                22f,
                text,
                true
            )
        )

        core.addView(
            label(
                "Command center online",
                15f,
                cyan,
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(7)
            }
        )

        core.addView(
            label(
                "UNDERSTAND → PLAN → ACT → OBSERVE → VERIFY",
                11f,
                muted
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(7)
            }
        )

        screen.addView(
            core,
            LinearLayout.LayoutParams(
                -1,
                dp(132)
            ).apply {
                bottomMargin = dp(10)
            }
        )

        screen.addView(
            card(
                "DROPPILOT AI",
                "WORKSPACE",
                "Products • economics • research • listings • growth"
            )
        )

        screen.addView(
            card(
                "VICE CITY FILES",
                "WORKSPACE",
                "Research • scripts • assets • publishing • analytics"
            )
        )

        screen.addView(
            card(
                "HABITAT CORE",
                "RUNNING",
                "Memory • tasks • agents • tools • automation"
            )
        )

        val commands =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.HORIZONTAL
            }

        commands.addView(
            button("TALK TO AX") {
                showChat()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            )
        )

        commands.addView(
            button("TASKS") {
                showTasks()
            },
            LinearLayout.LayoutParams(
                0,
                dp(52),
                1f
            ).apply {
                marginStart = dp(8)
            }
        )

        screen.addView(
            commands,
            LinearLayout.LayoutParams(
                -1,
                dp(58)
            )
        )

        install(screen)
    }

    private fun showChat() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "AX",
                "DIRECT COMMAND INTERFACE"
            )
        )

        val scroll =
            ScrollView(this)

        val messages =
            LinearLayout(this).apply {
                orientation =
                    LinearLayout.VERTICAL

                setPadding(
                    0,
                    dp(10),
                    0,
                    dp(10)
                )
            }

        fun addMessage(
            who: String,
            message: String,
            user: Boolean
        ) {

            val bubble =
                label(
                    "$who\n$message",
                    14f,
                    text
                )

            bubble.background =
                panelBackground(
                    if (user)
                        Color.rgb(18, 42, 62)
                    else
                        panel
                )

            bubble.setPadding(
                dp(14),
                dp(12),
                dp(14),
                dp(12)
            )

            messages.addView(
                bubble,
                LinearLayout.LayoutParams(
                    -1,
                    -2
                ).apply {
                    topMargin = dp(5)
                    bottomMargin = dp(5)
                }
            )

            scroll.post {
                scroll.fullScroll(
                    View.FOCUS_DOWN
                )
            }
        }

        addMessage(
            "AX",
            "Habitat command interface online. Awaiting mission.",
            false
        )

        scroll.addView(messages)

        screen.addView(
            scroll,
            LinearLayout.LayoutParams(
                -1,
                0,
                1f
            )
        )

        val input =
            EditText(this).apply {

                hint = "Command Ax..."

                setHintTextColor(muted)

                setTextColor(text)

                textSize = 15f

                singleLine = true

                imeOptions =
                    EditorInfo.IME_ACTION_SEND

                background =
                    panelBackground()

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        screen.addView(
            input,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            ).apply {
                bottomMargin = dp(7)
            }
        )

        fun sendCommand() {

            val command =
                input.text
                    .toString()
                    .trim()

            if (command.isEmpty()) {
                return
            }

            addMessage(
                "YOU",
                command,
                true
            )

            store.saveMessage(
                "YOU",
                command
            )

            input.text.clear()

            if (brain.endpoint().isBlank()) {

                addMessage(
                    "AX",
                    "I received it locally. Connect a brain endpoint in BRAIN for external AI processing.",
                    false
                )

            } else {

                addMessage(
                    "AX",
                    "Processing...",
                    false
                )

                brain.send(
                    command
                ) { result ->

                    runOnUiThread {

                        addMessage(
                            "AX",
                            result.text,
                            false
                        )

                        store.saveMessage(
                            "AX",
                            result.text
                        )
                    }
                }
            }
        }

        input.setOnEditorActionListener { _, action, event ->

            if (
                action == EditorInfo.IME_ACTION_SEND ||
                (
                    event != null &&
                    event.keyCode == KeyEvent.KEYCODE_ENTER &&
                    event.action == KeyEvent.ACTION_DOWN
                )
            ) {

                sendCommand()

                true

            } else {

                false
            }
        }

        screen.addView(
            button("SEND") {
                sendCommand()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            )
        )

        install(screen)
    }

    private fun showProjects() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "PROJECTS",
                "HABITAT WORKSPACES"
            )
        )

        screen.addView(
            card(
                "DROPPILOT AI",
                "READY",
                "TikTok Shop / Shopify business workspace"
            )
        )

        screen.addView(
            card(
                "VICE CITY FILES",
                "READY",
                "GTA 6 research and content workspace"
            )
        )

        screen.addView(
            card(
                "HABITAT",
                "ACTIVE",
                "Core AI environment"
            )
        )

        screen.addView(
            button("DROPPILOT COMMAND CENTER") {
                showWorkspace(
                    "DROPPILOT AI",
                    listOf(
                        "PRODUCT RESEARCH",
                        "ECONOMICS",
                        "COMPETITOR RESEARCH",
                        "LISTINGS",
                        "CREATOR OUTREACH",
                        "SALES MONITOR"
                    )
                )
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                bottomMargin = dp(8)
            }
        )

        screen.addView(
            button("VICE CITY COMMAND CENTER") {
                showWorkspace(
                    "VICE CITY FILES",
                    listOf(
                        "TOPIC RESEARCH",
                        "FACT CHECK",
                        "SCRIPT ENGINE",
                        "ASSET PLANNER",
                        "PUBLISHING",
                        "ANALYTICS"
                    )
                )
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            )
        )

        install(screen)
    }

    private fun showWorkspace(
        name: String,
        functions: List<String>
    ) {

        val screen =
            makeRoot()

        screen.addView(
            header(
                name,
                "PROJECT COMMAND CENTER"
            )
        )

        functions.forEach { function ->

            screen.addView(
                card(
                    function,
                    "READY",
                    "Habitat capability interface"
                )
            )
        }

        screen.addView(
            button("ASK AX ABOUT THIS PROJECT") {
                showChat()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(5)
            }
        )

        install(screen)
    }

    private fun showBrain() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "BRAIN",
                "AI PROVIDER CONTROL"
            )
        )

        screen.addView(
            label(
                if (brain.endpoint().isBlank())
                    "● BRAIN NOT CONNECTED"
                else
                    "● BRAIN ENDPOINT READY",
                13f,
                if (brain.endpoint().isBlank())
                    orange
                else
                    green,
                true
            ),
            LinearLayout.LayoutParams(
                -1,
                -2
            ).apply {
                topMargin = dp(10)
            }
        )

        val endpoint =
            EditText(this).apply {

                hint =
                    "https://your-server/chat"

                setHintTextColor(muted)

                setTextColor(text)

                singleLine = true

                setText(
                    brain.endpoint()
                )

                background =
                    panelBackground()

                setPadding(
                    dp(14),
                    dp(10),
                    dp(14),
                    dp(10)
                )
            }

        screen.addView(
            endpoint,
            LinearLayout.LayoutParams(
                -1,
                dp(56)
            ).apply {
                topMargin = dp(10)
            }
        )

        screen.addView(
            button("SAVE BRAIN ENDPOINT") {

                brain.setEndpoint(
                    endpoint.text
                        .toString()
                        .trim()
                )

                Toast.makeText(
                    this,
                    "Brain endpoint saved.",
                    Toast.LENGTH_SHORT
                ).show()

                showBrain()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(50)
            ).apply {
                topMargin = dp(7)
            }
        )

        screen.addView(
            card(
                "MEMORY",
                "LOCAL",
                "Persistent Habitat conversation memory"
            )
        )

        screen.addView(
            card(
                "TASK ENGINE",
                "READY",
                "Task creation and completion state"
            )
        )

        screen.addView(
            card(
                "AGENT COORDINATOR",
                "READY",
                "Specialized workers and project routing"
            )
        )

        screen.addView(
            card(
                "EXECUTION",
                "SAFE",
                "Actions should be verified before claiming completion"
            )
        )

        install(screen)
    }

    private fun showAgents() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "AGENTS",
                "SPECIALIZED HABITAT WORKERS"
            )
        )

        listOf(
            "COORDINATOR",
            "RESEARCH",
            "DROPPILOT",
            "VICE CITY",
            "ANDROID",
            "AUTOMATION"
        ).forEach {

            screen.addView(
                card(
                    it,
                    "READY",
                    "Agent role registered with Habitat Core"
                )
            )
        }

        install(screen)
    }

    private fun showTasks() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "TASKS",
                "HABITAT EXECUTION QUEUE"
            )
        )

        val tasks =
            store.tasks()

        if (tasks.isEmpty()) {

            screen.addView(
                card(
                    "QUEUE",
                    "EMPTY",
                    "No tasks are currently stored"
                )
            )

        } else {

            tasks.forEach { task ->

                screen.addView(
                    card(
                        task.title,
                        if (task.completed)
                            "DONE"
                        else
                            "OPEN",
                        task.description
                    )
                )
            }
        }

        screen.addView(
            button("CREATE HABITAT TASK") {

                store.addTask(
                    "Habitat task",
                    "New task created from command center"
                )

                showTasks()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(8)
            }
        )

        install(screen)
    }

    private fun showMore() {

        val screen =
            makeRoot()

        screen.addView(
            header(
                "MORE",
                "HABITAT SYSTEM"
            )
        )

        screen.addView(
            card(
                "HABITAT",
                "1.0",
                "Ax Intelligence Environment"
            )
        )

        screen.addView(
            card(
                "MEMORY",
                store.messageCount().toString(),
                "Local messages stored"
            )
        )

        screen.addView(
            card(
                "TASKS",
                store.tasks().size.toString(),
                "Tasks stored"
            )
        )

        screen.addView(
            button("VIEW MEMORY") {

                val count =
                    store.messageCount()

                Toast.makeText(
                    this,
                    "$count local messages stored.",
                    Toast.LENGTH_SHORT
                ).show()
            }
        )

        screen.addView(
            button("CLEAR LOCAL MEMORY") {

                store.clearMessages()

                Toast.makeText(
                    this,
                    "Local conversation memory cleared.",
                    Toast.LENGTH_SHORT
                ).show()
            },
            LinearLayout.LayoutParams(
                -1,
                dp(52)
            ).apply {
                topMargin = dp(8)
            }
        )

        install(screen)
    }
}

KOTLIN

        # --------------------------------------------------------
