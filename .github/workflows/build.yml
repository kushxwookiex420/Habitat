        cat > "$SRC/BrainAdapter.kt" <<'KOTLIN'

package com.habitat.core

import android.content.Context
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL
import java.util.concurrent.Executors

data class BrainResult(
    val text: String
)

class BrainAdapter(
    context: Context
) {

    private val prefs =
        context.getSharedPreferences(
            "habitat_brain",
            Context.MODE_PRIVATE
        )

    private val executor =
        Executors.newCachedThreadPool()

    fun endpoint(): String =
        prefs.getString(
            "endpoint",
            ""
        ) ?: ""

    fun setEndpoint(
        value: String
    ) {

        prefs.edit()
            .putString(
                "endpoint",
                value
            )
            .apply()
    }

    fun send(
        message: String,
        callback: (BrainResult) -> Unit
    ) {

        val endpoint =
            endpoint()

        if (endpoint.isBlank()) {

            callback(
                BrainResult(
                    "Brain endpoint is not configured."
                )
            )

            return
        }

        executor.execute {

            try {

                val connection =
                    URL(endpoint)
                        .openConnection()
                        as HttpURLConnection

                connection.requestMethod =
                    "POST"

                connection.connectTimeout =
                    15000

                connection.readTimeout =
                    30000

                connection.doOutput = true

                connection.setRequestProperty(
                    "Content-Type",
                    "application/json"
                )

                val body =
                    JSONObject()
                        .put(
                            "message",
                            message
                        )
                        .toString()

                connection.outputStream
                    .use {
                        it.write(
                            body.toByteArray(
                                Charsets.UTF_8
                            )
                        )
                    }

                val code =
                    connection.responseCode

                val stream =
                    if (code in 200..299)
                        connection.inputStream
                    else
                        connection.errorStream

                val response =
                    stream
                        ?.bufferedReader()
                        ?.use { it.readText() }
                        ?: ""

                val json =
                    try {
                        JSONObject(response)
                    } catch (_: Exception) {
                        JSONObject()
                    }

                val answer =
                    json.optString(
                        "response",
                        json.optString(
                            "error",
                            "Brain returned no response."
                        )
                    )

                callback(
                    BrainResult(answer)
                )

                connection.disconnect()

            } catch (error: Exception) {

                callback(
                    BrainResult(
                        "Brain connection failed: ${
                            error.message ?: "unknown error"
                        }"
                    )
                )
            }
        }
    }

    fun shutdown() {

        executor.shutdownNow()
    }
}

