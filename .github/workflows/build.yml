package com.habitat.core

data class HabitatMemory(
    val id: String,
    val category: String,
    val content: String,
    val timestamp: Long
)

class MemoryEngine {

    private val memories =
        mutableListOf<HabitatMemory>()

    fun remember(
        memory: HabitatMemory
    ) {
        memories.add(memory)
    }

    fun recent(
        limit: Int = 20
    ): List<HabitatMemory> {

        return memories
            .sortedByDescending {
                it.timestamp
            }
            .take(limit)
    }

    fun clear() {
        memories.clear()
    }
}

