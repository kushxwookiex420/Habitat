package com.habitat.core

import android.content.Context
import org.json.JSONArray
import org.json.JSONObject
import java.util.UUID

data class HabitatTask(
    val id: String,
    val title: String,
    val description: String,
    val completed: Boolean
)

class HabitatStore(
    context: Context
) {

    private val prefs =
        context.getSharedPreferences(
            "habitat_store",
            Context.MODE_PRIVATE
        )

    fun saveMessage(
        role: String,
        message: String
    ) {

        val raw =
            prefs.getString(
                "messages",
                "[]"
            ) ?: "[]"

        val array =
            try {
                JSONArray(raw)
            } catch (_: Exception) {
                JSONArray()
            }

        array.put(
            JSONObject()
                .put("role", role)
                .put("message", message)
                .put(
                    "timestamp",
                    System.currentTimeMillis()
                )
        )

        while (array.length() > 200) {
            array.remove(0)
        }

        prefs.edit()
            .putString(
                "messages",
                array.toString()
            )
            .apply()
    }

    fun messageCount(): Int {

        val raw =
            prefs.getString(
                "messages",
                "[]"
            ) ?: "[]"

        return try {
            JSONArray(raw).length()
        } catch (_: Exception) {
            0
        }
    }

    fun clearMessages() {

        prefs.edit()
            .remove("messages")
            .apply()
    }

    fun tasks(): List<HabitatTask> {

        val raw =
            prefs.getString(
                "tasks",
                "[]"
            ) ?: "[]"

        val array =
            try {
                JSONArray(raw)
            } catch (_: Exception) {
                JSONArray()
            }

        val result =
            mutableListOf<HabitatTask>()

        for (i in 0 until array.length()) {

            val item =
                array.optJSONObject(i)
                    ?: continue

            result.add(
                HabitatTask(
                    item.optString("id"),
                    item.optString("title"),
                    item.optString("description"),
                    item.optBoolean("completed")
                )
            )
        }

        return result
    }

    fun addTask(
        title: String,
        description: String
    ) {

        val array = JSONArray()

        tasks().forEach { task ->

            array.put(
                JSONObject()
                    .put("id", task.id)
                    .put("title", task.title)
                    .put(
                        "description",
                        task.description
                    )
                    .put(
                        "completed",
                        task.completed
                    )
            )
        }

        array.put(
            JSONObject()
                .put(
                    "id",
                    UUID.randomUUID().toString()
                )
                .put("title", title)
                .put(
                    "description",
                    description
                )
                .put(
                    "completed",
                    false
                )
        )

        prefs.edit()
            .putString(
                "tasks",
                array.toString()
            )
            .apply()
    }
}
