package com.habitat.core

enum class HabitatState {
    IDLE,
    THINKING,
    PLANNING,
    ACTING,
    OBSERVING,
    VERIFYING,
    COMPLETE,
    FAILED
}

data class HabitatAction(
    val id: String,
    val name: String,
    val description: String,
    val requiresConfirmation: Boolean
)

data class HabitatPlan(
    val objective: String,
    val actions: List<HabitatAction>
)

class HabitatEngine {

    var state: HabitatState =
        HabitatState.IDLE
        private set

    fun begin(
        objective: String
    ): HabitatPlan {

        state = HabitatState.THINKING
        state = HabitatState.PLANNING

        return HabitatPlan(
            objective,
            listOf(
                HabitatAction(
                    "research",
                    "Research",
                    "Gather required information.",
                    false
                ),
                HabitatAction(
                    "verify",
                    "Verify",
                    "Verify results before completion.",
                    false
                )
            )
        )
    }

    fun acting() {
        state = HabitatState.ACTING
    }

    fun observing() {
        state = HabitatState.OBSERVING
    }

    fun verifying() {
        state = HabitatState.VERIFYING
    }

    fun complete() {
        state = HabitatState.COMPLETE
    }

    fun fail() {
        state = HabitatState.FAILED
    }
}
