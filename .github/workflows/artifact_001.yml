name: Artifact 001 execution

# Manual runs remain available. A narrow path-filtered main-branch trigger lets a
# renderer/workflow change produce a QA-gated review artifact without triggering
# on ordinary app commits. This workflow never publishes to TikTok.
on:
  workflow_call:
    inputs:
      objective:
        description: "Content mission objective"
        required: false
        default: "Create Artifact 001: Vice City 6: The Next Big Leap"
        type: string
  workflow_dispatch:
    inputs:
      objective:
        description: "Content mission objective"
        required: false
        default: "Create Artifact 001: Vice City 6: The Next Big Leap"
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/artifact_001.yml"
      - "scripts/render-artifact-001.sh"
      - "scripts/vice-city-release-gate.mjs"
      - "visual-qa.mjs"
      - "scripts/assemble-vice-city-files.sh"
      - "assets/**"
      - "docs/VICE_CITY_FILES_VIDEO_QA.md"

concurrency:
  group: vice-city-files-video-production
  cancel-in-progress: false

jobs:
  execute-artifact-001:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Habitat source
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu librsvg2-bin

      - name: Restore or build Vice City Files branding assets
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f assets/vice-city-files-assets.zip ]; then
            unzip -o assets/vice-city-files-assets.zip -d assets
          fi
          # The repository's title-card source is versioned; do not let a missing
          # optional media ZIP strand the whole render after the body is ready.
          if [ ! -s assets/vice-city-files-intro.mp4 ] || [ ! -s assets/vice-city-files-outro.mp4 ]; then
            rsvg-convert -o /tmp/vice-city-title-card.png artifacts/vice-city-6-title-card.svg
            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 30 -i /tmp/vice-city-title-card.png \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 \
              -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='THE STORY BEHIND THE HYPE':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=1260,format=yuv420p" \
              -t 7 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 22 \
              -c:a aac -b:a 96k -ar 48000 -ac 2 -shortest -movflags +faststart \
              assets/vice-city-files-intro.mp4
            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 30 -i /tmp/vice-city-title-card.png \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 \
              -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FOLLOW FOR FACT-CHECKED GAMING UPDATES':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=1260,format=yuv420p" \
              -t 3.5 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 22 \
              -c:a aac -b:a 96k -ar 48000 -ac 2 -shortest -movflags +faststart \
              assets/vice-city-files-outro.mp4
          fi
          test -s assets/vice-city-files-intro.mp4
          test -s assets/vice-city-files-outro.mp4
          for clip in assets/vice-city-files-intro.mp4 assets/vice-city-files-outro.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate \
              -of compact "$clip"
          done

      - name: Validate renderer shell syntax
        run: bash -n scripts/render-artifact-001.sh

      - name: Wait for Habitat Render deployment
        run: |
          set -e
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://habitat-1-szzd.onrender.com/health || true)
            if [ "$code" = "200" ]; then
              echo "Habitat is healthy"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for Habitat... HTTP $code"
            sleep 10
          done
          echo "Habitat did not become healthy"
          exit 1

      - name: Create content mission
        env:
          OBJECTIVE: "${{ inputs.objective || 'Create Artifact 001: Vice City 6: The Next Big Leap' }}"
        run: |
          set -euo pipefail
          jq -n --arg objective "$OBJECTIVE" '{project:"ViceCityFiles",objective:$objective,platform:"tiktok",format:"9:16"}' > /tmp/job-request.json
          curl --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 180 --max-time 240 -sS -f -X POST \
            https://habitat-1-szzd.onrender.com/content/jobs \
            -H 'content-type: application/json' --data-binary @/tmp/job-request.json > /tmp/job.json
          cat /tmp/job.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/job.json'))
          assert d.get('ok') and d.get('job',{}).get('id')
          print(d['job']['id'])
          open('/tmp/job_id','w').write(d['job']['id'])
          PY

      - name: Research
        run: |
          set -e
          id=$(cat /tmp/job_id)
          curl --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 180 --max-time 240 -sS -f -X POST "https://habitat-1-szzd.onrender.com/content/jobs/$id/research"             -H 'content-type: application/json' -d '{}' > /tmp/research.json
          cat /tmp/research.json

      - name: Script
        run: |
          set -e
          id=$(cat /tmp/job_id)
          curl --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 180 --max-time 240 -sS -f -X POST "https://habitat-1-szzd.onrender.com/content/jobs/$id/script"             -H 'content-type: application/json' -d '{}' > /tmp/script.json
          cat /tmp/script.json

      - name: Render plan
        run: |
          set -e
          id=$(cat /tmp/job_id)
          curl --retry 6 --retry-all-errors --retry-delay 8 --retry-max-time 180 --max-time 240 -sS -f -X POST "https://habitat-1-szzd.onrender.com/content/jobs/$id/render-plan"             -H 'content-type: application/json' -d '{}' > /tmp/plan.json
          cat /tmp/plan.json

      - name: Render real MP4 locally
        run: |
          set -e
          chmod +x scripts/render-artifact-001.sh
          ./scripts/render-artifact-001.sh habitat-artifact-001-body.mp4 /tmp/script.json

      - name: Assemble approved intro, complete narration, and branded outro
        run: |
          set -e
          chmod +x scripts/assemble-vice-city-files.sh
          ./scripts/assemble-vice-city-files.sh \
            habitat-artifact-001-body.mp4 \
            assets/vice-city-files-intro.mp4 \
            assets/vice-city-files-outro.mp4 \
            habitat-artifact-001.mp4 \
            vice-city-edit-manifest.json

      - name: Verify Artifact 001 metadata
        run: |
          set -e
          python - <<'PY'
          import json, subprocess, os
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height","-of","json","habitat-artifact-001.mp4"]))
          video=next(s for s in p["streams"] if s["codec_type"]=="video")
          duration=float(p["format"]["duration"])
          size=os.path.getsize("habitat-artifact-001.mp4")
          assert size > 0
          assert duration >= 44
          assert int(video["width"]) == 1080 and int(video["height"]) == 1920
          print("CANONICAL ARTIFACT 001 VERIFIED")
          print(json.dumps({"verified":True,"bytes":size,"durationSeconds":duration,"width":1080,"height":1920,"renderer":"uncropped-images-neural-narration-v3","audio":"narration-present","scenes":6}))
          PY

      - name: Run deterministic visual and audio QA
        run: |
          set -e
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { runVisualQA } from './visual-qa.mjs';
          const titles = [
            ['VICE CITY IS BACK', 'GTA VI • OFFICIAL DETAILS'],
            ['NOVEMBER 19, 2026', 'ANNOUNCED RELEASE DATE'],
            ['JASON + LUCIA', 'THE MAIN CHARACTERS'],
            ['WELCOME TO LEONIDA', 'VICE CITY AND BEYOND'],
            ['PS5 + XBOX SERIES X AND S', 'ANNOUNCED LAUNCH PLATFORMS'],
            ['FACTS, NOT RUMORS', 'FOLLOW VICE CITY FILES']
          ];
          const footer = 'VICE CITY FILES  •  FACT-CHECKED GAMING UPDATES';
          const renderPlan = {
            format: '9:16',
            scenes: titles.map(([title, subtitle]) => ({ title, subtitle })),
            onScreenText: [
              ...titles.map(([title]) => ({ text: title, fontSize: 44, bold: true })),
              ...titles.map(([, subtitle]) => ({ text: subtitle, fontSize: 24, bold: false })),
              { text: footer, fontSize: 23, bold: false }
            ]
          };
          const result = await runVisualQA({
            artifactPath: 'habitat-artifact-001.mp4',
            renderPlan,
            expectedSceneCount: 6,
            requireAudio: true
          });
          fs.writeFileSync('visual-qa-report.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify({
            status: result.status,
            checks: result.checks,
            issues: result.issues
          }, null, 2));
          if (result.status !== 'VISUAL_PASS') process.exit(1);
          JS

      - name: Enforce Vice City Files release gate
        if: always()
        env:
          VICE_CITY_EDIT_MANIFEST: vice-city-edit-manifest.json
        run: |
          set -e
          INTRO="${VICE_CITY_FILES_INTRO_PATH:-assets/vice-city-files-intro.mp4}"
          OUTRO="${VICE_CITY_FILES_OUTRO_PATH:-assets/vice-city-files-outro.mp4}"
          node scripts/vice-city-release-gate.mjs \
            habitat-artifact-001.mp4 "$INTRO" "$OUTRO" vice-city-release-gate-report.json

      - name: Upload Artifact 001 and QA report to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habitat-artifact-001
          path: |
            habitat-artifact-001.mp4
            habitat-artifact-001-body.mp4
            visual-qa-report.json
            vice-city-release-gate-report.json
          if-no-files-found: warn
          retention-days: 7
