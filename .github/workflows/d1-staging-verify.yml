name: D1 staging verification

# Uses the repository's existing HABITAT_D1_API_TOKEN secret so the token never reaches an
# operator's shell, a log or a file. Read-only by default; `migrate` is explicit and still refuses
# the production database id.

# `workflow_dispatch` is only offered for workflows on the default branch, and this one is not
# there yet, so the integration branch also verifies on push. A push can only ever run `verify`:
# migrations stay a manual, confirmed action.
on:
  push:
    branches: [staging/integration]
    paths:
      - "scripts/d1-staging-verify.mjs"
      - "scripts/staging-preflight.mjs"
      - "migrations/**"
      - ".github/workflows/d1-staging-verify.yml"
  workflow_dispatch:
    inputs:
      database_id:
        description: "Target D1 database id (must be the non-production database, a 36-character UUID)"
        required: true
        type: string
      mode:
        description: "verify = read-only schema report; migrate = apply migrations 0008-0009 then verify"
        required: true
        type: choice
        options: ["verify", "migrate"]
        default: "verify"
      confirm:
        description: "Type nonprod to confirm the target is not production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm intent
        env:
          CONFIRM: ${{ inputs.confirm }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ]; then
            if [ "${MODE:-}" = "migrate" ]; then
              echo "::error::a push may not migrate; migrations are manual and confirmed"
              exit 1
            fi
            echo "confirmed: push-triggered read-only verification"
            exit 0
          fi
          if [ "${CONFIRM:-}" != "nonprod" ]; then
            echo "::error::confirm must be exactly 'nonprod'; refusing to touch a database"
            exit 1
          fi
          echo "confirmed: non-production target"

      - name: Isolation guard (never production)
        env:
          TARGET: ${{ inputs.database_id || vars.HABITAT_STAGING_D1_DATABASE_ID }}
          PRODUCTION: ${{ vars.HABITAT_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION}" ]; then
            echo "::error::repository variable HABITAT_D1_DATABASE_ID is not set, so production cannot be excluded"
            exit 1
          fi
          if [ "${TARGET}" = "${PRODUCTION}" ]; then
            echo "::error::target equals the production database id; nothing was sent"
            exit 1
          fi
          case "${TARGET}" in
            *-*-*-*-*) ;;
            *) echo "::error::target is not a D1 UUID"; exit 1 ;;
          esac
          echo "guard ok: target differs from production"

      - name: Preflight (no writes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.HABITAT_D1_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ inputs.database_id || vars.HABITAT_STAGING_D1_DATABASE_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.HABITAT_D1_DATABASE_ID }}
          STAGING_D1_CONFIRM: provision
          NEXUS_RUNTIME_ENABLED: ""
        run: node scripts/staging-preflight.mjs

      - name: Verify or migrate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HABITAT_D1_API_TOKEN: ${{ secrets.HABITAT_D1_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ inputs.database_id || vars.HABITAT_STAGING_D1_DATABASE_ID }}
          PRODUCTION_D1_DATABASE_ID: ${{ vars.HABITAT_D1_DATABASE_ID }}
        run: node scripts/d1-staging-verify.mjs --mode "${{ inputs.mode || 'verify' }}" | tee d1-staging-evidence.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-staging-evidence
          path: d1-staging-evidence.json
          if-no-files-found: warn
          retention-days: 30
