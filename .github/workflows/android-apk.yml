name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # setup-android@v3 currently tries to install the removed "tools" package and aborts before the
      # build. The runner already ships the SDK; select it and install only the two pinned packages.
      - name: Select the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          test -d "$SDK" || { echo "::error::preinstalled Android SDK not found"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # GITHUB_PATH only affects later steps, so resolve the binary for this one explicitly.
          SDKMANAGER=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # The repository intentionally has no wrapper jar; pin the same Gradle line as the docs.
          gradle-version: "8.10.2"
      - name: Build production and staging debug APKs
        run: gradle :app:assembleProductionDebug :app:assembleStagingDebug --no-daemon --console=plain

      # A cache of the runner's generated keystore did not survive between jobs, so three builds
      # produced three certificates. The identity now comes from the repository keystore, and this
      # step fails the build if the APK's certificate is not the expected one.
      - name: Verify the signing identity is the repository's
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d '[:space:]' < EXPECTED_DEBUG_CERT_SHA256)
          ACTUAL=$(node scripts/apk-cert-fingerprint.mjs app/build/outputs/apk/production/debug/app-production-debug.apk | sed -n 's/^certificate-sha256=//p')
          STAGING=$(node scripts/apk-cert-fingerprint.mjs app/build/outputs/apk/staging/debug/app-staging-debug.apk | sed -n 's/^certificate-sha256=//p')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          echo "staging =$STAGING"
          if [ -z "${ACTUAL}" ]; then
            echo "::error::Could not read the APK certificate."
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::The debug APK is not signed by the repository keystore; an upgrade over an installed debug build would fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE."
            exit 1
          fi
          if [ "$EXPECTED" != "$STAGING" ]; then
            echo "::error::The staging APK is not signed by the repository debug identity."
            exit 1
          fi
          echo "::notice::Both production and staging APKs are signed by the repository debug identity $ACTUAL"
      - name: Build signed release when the owner has configured signing
        env:
          HABITAT_KEYSTORE_BASE64: ${{ secrets.HABITAT_KEYSTORE_BASE64 }}
          HABITAT_KEYSTORE_PASSWORD: ${{ secrets.HABITAT_KEYSTORE_PASSWORD }}
          HABITAT_KEY_ALIAS: ${{ secrets.HABITAT_KEY_ALIAS }}
          HABITAT_KEY_PASSWORD: ${{ secrets.HABITAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HABITAT_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::No signing secrets; release APK is not built. Debug APK is still produced."
            exit 0
          fi
          KS="$RUNNER_TEMP/owner.jks"
          printf '%s' "$HABITAT_KEYSTORE_BASE64" | base64 -d > "$KS"
          export HABITAT_KEYSTORE_FILE="$KS"
          gradle :app:assembleProductionRelease :app:assembleStagingRelease --no-daemon --console=plain
          rm -f "$KS"
      - name: Checksums
        run: |
          set -euo pipefail
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            sha256sum "$apk" | tee "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: habitat-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
